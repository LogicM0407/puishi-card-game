function gainReputation(playerIndex, amount, options = {}) {
  const player = game.players[playerIndex];
  if (!player || player.frozen || !amount) return 0;
  const before = player.reputation;
  if (options.cap != null && amount > 0) {
    player.reputation = player.reputation >= options.cap
      ? player.reputation
      : Math.min(options.cap, player.reputation + amount);
  } else {
    player.reputation += amount;
  }
  return player.reputation - before;
}

function applyScoreChange(playerIndex, dimension, requestedAmount, context = {}) {
  const player = game.players[playerIndex];
  if (!player || !DIMENSIONS.includes(dimension) || !requestedAmount || player.frozen || player.commissionLocked) return 0;
  if (dimension === "selection" && player.firstRoundSkillUsed && !context.allowSelectionChange) return 0;
  if (game.effectDepth > 40) return 0;

  let amount = requestedAmount;
  if (amount > 0 && dimension === "config" && ownsCharacter(player, "chi-mahu")) {
    amount = Math.floor(amount * .5);
  }
  if (amount < 0 && dimension === "config" && ownsCharacter(player, "tokyo")) {
    const source = game.players[context.sourcePlayerIndex];
    if (source && source.memberId !== player.memberId) source.disableUntilOwnTurn = true;
    appendLog(`${player.name} 的配置水平减少被“地道东京爷”免疫。`, "effect");
    return 0;
  }
  if (!amount) return 0;

  const beforeAll = game.players.map(candidate => candidate.scores[dimension]);
  player.scores[dimension] += amount;
  game.effectDepth++;
  runScorePassives(playerIndex, dimension, amount, beforeAll, context);
  game.effectDepth--;
  return amount;
}

function setScore(playerIndex, dimension, value, context = {}) {
  const player = game.players[playerIndex];
  if (!player) return 0;
  return applyScoreChange(playerIndex, dimension, value - player.scores[dimension], context);
}

function runScorePassives(playerIndex, dimension, amount, beforeAll, context) {
  const player = game.players[playerIndex];
  const sourceIndex = Number.isInteger(context.sourcePlayerIndex) ? context.sourcePlayerIndex : playerIndex;
  const source = game.players[sourceIndex];

  if (amount < 0) {
    game.players.forEach((owner, ownerIndex) => {
      if (ownsCharacter(owner, "jinye") && owner.counters.jinyeDraws < 2) {
        owner.counters.jinyeDraws++;
        drawCards(ownerIndex, 1);
        appendLog(`${owner.name} 因场上能力值降低抽1张牌。`, "effect");
      }
    });
  }

  if (amount > 0 && source && sourceIndex !== playerIndex && ownsCharacter(source, "ruishi")) {
    gainReputation(sourceIndex, 1);
    appendLog(`${source.name} 因使其他玩家维度增长获得1点声望。`, "effect");
  }

  if (amount > 0 && (dimension === "abstract" || dimension === "concrete") && ownsCharacter(player, "summercube")) {
    player.counters.summercubeMotion += amount;
    while (player.counters.summercubeMotion >= 15) {
      player.counters.summercubeMotion -= 15;
      applyScoreChange(playerIndex, "config", 3, { sourcePlayerIndex: playerIndex, skipCrossing: true });
      appendLog(`${player.name} 累计提高15点动效，配置水平+3。`, "effect");
    }
  }

  if (amount > 0 && ownsCharacter(player, "naogui") && !player.counters.naoguiTriggered) {
    player.counters.naoguiTriggered = true;
    drawCards(playerIndex, 2);
    appendLog(`${player.name} 因能力值提升抽2张牌。`, "effect");
  }

  if (amount > 0 && dimension === "innovation" && ownsCharacter(player, "furry")) {
    drawCards(playerIndex, 1);
    appendLog(`${player.name} 因创新能力增加抽1张牌。`, "effect");
  }

  if (amount > 0 && ownsCharacter(player, "disinfectant")) {
    player.counters.disinfectantGain += amount;
    while (player.counters.disinfectantGain >= 15) {
      player.counters.disinfectantGain -= 15;
      drawCards(playerIndex, 2);
      appendLog(`${player.name} 累计提升15点能力值，抽2张牌。`, "effect");
    }
  }

  if (amount > 0 && dimension === "config" && ownsCharacter(player, "chi-mahu")) {
    player.counters.chiMahuConfig += amount;
    while (player.counters.chiMahuConfig >= 8) {
      player.counters.chiMahuConfig -= 8;
      DIMENSIONS.forEach(dim => applyScoreChange(playerIndex, dim, 5, {
        sourcePlayerIndex: playerIndex,
        skipCrossing: true
      }));
      appendLog(`${player.name} 累计提升8点配置能力，所有维度+5。`, "effect");
    }
  }

  if (amount > 0 && dimension === "config" && ownsCharacter(player, "hotwind")) {
    player.counters.hotwindConfig += amount;
    while (player.counters.hotwindConfig >= 5) {
      player.counters.hotwindConfig -= 5;
      gainReputation(playerIndex, 1);
      appendLog(`${player.name} 累计提升5点配置水平，获得1点声望。`, "effect");
    }
  }

  if (!context.skipCrossing) runCrossingPassives(playerIndex, dimension, beforeAll);
}

function runCrossingPassives(playerIndex, dimension, beforeAll) {
  const player = game.players[playerIndex];
  const afterValue = player.scores[dimension];

  if (ownsCharacter(player, "ftayo")) {
    game.players.forEach((opponent, opponentIndex) => {
      if (opponentIndex === playerIndex) return;
      if (beforeAll[playerIndex] <= beforeAll[opponentIndex] && afterValue > opponent.scores[dimension]) {
        const targetIndex = randomItem(game.players.map((_, index) => index).filter(index => index !== playerIndex));
        const targetDimension = randomDimension();
        applyScoreChange(targetIndex, targetDimension, -2, { sourcePlayerIndex: playerIndex, skipCrossing: true });
        appendLog(`${player.name} 的维度超过对手，随机对手的${DIMENSION_LABELS[targetDimension]}-2。`, "effect");
      }
    });
  }

  game.players.forEach((ftayoOwner, ownerIndex) => {
    if (ownerIndex === playerIndex || !ownsCharacter(ftayoOwner, "ftayo")) return;
    if (beforeAll[playerIndex] <= beforeAll[ownerIndex] && afterValue > ftayoOwner.scores[dimension]) {
      drawCards(ownerIndex, 1);
      appendLog(`${ftayoOwner.name} 的维度被对手超过，抽1张牌。`, "effect");
    }
  });

  if (ownsCharacter(player, "ziwei") && !player.counters.ziweiHighest[dimension]) {
    const wasHighest = beforeAll.every((value, index) => index === playerIndex || beforeAll[playerIndex] > value);
    const isHighest = game.players.every((candidate, index) => index === playerIndex || afterValue >= candidate.scores[dimension]);
    if (!wasHighest && isHighest) {
      player.counters.ziweiHighest[dimension] = true;
      drawCards(playerIndex, 2);
      const bonusDimension = randomDimension();
      applyScoreChange(playerIndex, bonusDimension, 8, { sourcePlayerIndex: playerIndex });
      appendLog(`${player.name} 的${DIMENSION_LABELS[dimension]}成为全场最高，抽2张牌且随机维度+8。`, "effect");
    }
  }
}

function resolveEvent(playerIndex, card) {
  const player = game.players[playerIndex];
  const event = eventDefinition(card.cardId);
  if (!player || !event) return;

  if (ownsCharacter(player, "cherry")) {
    appendLog(`${player.name} 的“樱桃喝酒人”使事件牌「${event.name}」不产生效果。`, "event");
  } else if (event.id === "meeting") {
    if (Math.random() < .8) {
      DIMENSIONS.forEach(dim => applyScoreChange(playerIndex, dim, 1, {
        sourcePlayerIndex: playerIndex,
        allowSelectionChange: true
      }));
      appendLog(`${player.name} 触发「面基」：所有维度+1。`, "event");
    } else {
      player.disableCharacterTurns = Math.max(player.disableCharacterTurns, 3);
      appendLog(`${player.name} 触发「面基」：3回合无法发动角色牌技能。`, "event");
    }
  } else if (event.id === "recruit") {
    const available = player.characters.filter(instance => !instance.permanentlyDisabled);
    if (available.length) {
      const strongest = available
        .map(instance => ({ instance, value: CHARACTER_STATS.reduce((sum, stat) => sum + characterDefinition(instance.id).stats[stat], 0) }))
        .sort((a, b) => b.value - a.value)[0].instance;
      strongest.permanentlyDisabled = true;
      gainReputation(playerIndex, 5);
      appendLog(`${player.name} 触发「招安」：${characterDefinition(strongest.id).name}永久失效，声望+5。`, "event");
    } else {
      gainReputation(playerIndex, 5);
      appendLog(`${player.name} 触发「招安」：声望+5。`, "event");
    }
  } else if (event.id === "retire") {
    player.frozenScore = totalScore(player);
    player.frozen = true;
    appendLog(`${player.name} 触发「退坑」：所有点数定格。`, "event");
  }

  game.players.forEach((owner, ownerIndex) => {
    if (!ownsCharacter(owner, "canada-goose")) return;
    const dimension = randomDimension(true);
    applyScoreChange(ownerIndex, dimension, 8, {
      sourcePlayerIndex: ownerIndex,
      allowSelectionChange: true
    });
    appendLog(`${owner.name} 因事件牌发动，${DIMENSION_LABELS[dimension]}+8。`, "effect");
  });

  game.deck.push(card);
  shuffle(game.deck);
}

function drawSkillFromPool(playerIndex) {
  const player = game.players[playerIndex];
  if (!player) return null;
  const definition = randomItem(SKILL_CARDS);
  const card = createCard("skill", definition.id);
  player.hand.push(card);
  player.handCount = player.hand.length;
  return card;
}

function drawCard(playerIndex) {
  refillDeckIfNeeded();
  const player = game.players[playerIndex];
  if (!player) return { kind: "empty" };

  if (ownsCharacter(player, "cherry")) {
    const skillIndex = game.deck.map(item => item.type).lastIndexOf("skill");
    if (skillIndex >= 0) {
      const card = game.deck.splice(skillIndex, 1)[0];
      player.hand.push(card);
      player.handCount = player.hand.length;
      appendLog(`${player.name} 摸到1张技能牌。`);
      return { kind: "skill", name: skillDefinition(card.cardId)?.name || "技能牌" };
    }
    const card = drawSkillFromPool(playerIndex);
    appendLog(`${player.name} 摸到1张技能牌。`);
    return { kind: "skill", name: skillDefinition(card.cardId)?.name || "技能牌" };
  }

  const card = game.deck.pop();
  if (!card) {
    appendLog("牌堆和弃牌堆均为空，本次未摸到牌。", "event");
    return { kind: "empty" };
  }
  if (card.type === "event") {
    const event = eventDefinition(card.cardId);
    resolveEvent(playerIndex, card);
    return { kind: "event", name: event?.name || "事件牌" };
  }
  player.hand.push(card);
  player.handCount = player.hand.length;
  const skill = skillDefinition(card.cardId);
  appendLog(`${player.name} 摸到1张技能牌。`);
  return { kind: "skill", name: skill.name };
}

function drawCards(playerIndex, count, skillOnly = false) {
  const results = [];
  for (let i = 0; i < count; i++) {
    if (skillOnly) {
      const card = drawSkillFromPool(playerIndex);
      results.push(card ? { kind: "skill", name: skillDefinition(card.cardId)?.name } : { kind: "empty" });
    } else {
      results.push(drawCard(playerIndex));
    }
  }
  return results;
}

function dealInitialHands() {
  game.players.forEach((player, playerIndex) => {
    drawCards(playerIndex, 5, true);
    appendLog(`${player.name} 从技能卡池抽取5张技能牌。`);
  });
}

function beginTurn() {
  const player = currentPlayer();
  if (!player) return;
  player.characters.forEach(character => {
    Object.keys(character.cooldowns).forEach(abilityId => {
      if (character.cooldowns[abilityId] > 0) character.cooldowns[abilityId]--;
    });
  });
  player.disableUntilOwnTurn = false;
  player.reviewActionUsed = false;
  player.counters.jinyeDraws = 0;
  player.counters.naoguiTriggered = false;
  player.counters.twoThreeEightLoss = 0;
  if (player.commissionLockAtRound != null && game.round >= player.commissionLockAtRound) {
    player.commissionLocked = true;
  }
  game.turn = {
    hasDrawn: false,
    skillCardsPlayed: 0,
    usedAbilityIds: [],
    number: game.turn.number + 1
  };
  appendLog(`轮到 ${player.name} 行动。`);
  if (player.extraDrawNextTurn > 0) {
    const count = player.extraDrawNextTurn;
    player.extraDrawNextTurn = 0;
    drawCards(game.currentPlayerIndex, count);
    appendLog(`${player.name} 额外摸${count}张牌。`, "effect");
  }
}

function buyCharacter(playerIndex, characterId) {
  const player = game.players[playerIndex];
  const character = characterDefinition(characterId);
  if (!character) return fail("角色不存在");
  if (player.characters.some(item => item.id === characterId)) return fail("不能重复购置同一角色");
  const price = RARITY[character.rarity].price;
  if (player.funds < price) return fail("购置点数不足");
  player.funds -= price;
  const cooldowns = {};
  const uses = {};
  character.abilities.forEach(ability => {
    cooldowns[ability.id] = 0;
    uses[ability.id] = 0;
  });
  player.characters.push({
    uid: `c_${cryptoRandom(8)}`,
    id: character.id,
    cooldowns,
    uses,
    disabledTurns: 0,
    permanentlyDisabled: false
  });
  appendLog(`${player.name} 购置了「${character.name}」，剩余${player.funds}点。`, "effect");
  return ok();
}

function finishDraft(playerIndex) {
  const player = game.players[playerIndex];
  if (!player.characters.length) return fail("至少购置1名角色后才能完成购置");
  if (game.draftDone.includes(player.memberId)) return fail("你已完成购置");
  game.draftDone.push(player.memberId);
  appendLog(`${player.name} 完成角色购置。`);
  if (game.draftDone.length === game.players.length) {
    game.phase = GAME_PHASE.TURN;
    game.round = 1;
    game.currentPlayerIndex = 0;
    dealInitialHands();
    appendLog("购置阶段结束。第1轮开始，每位玩家必须发动1次角色技能。", "event");
    beginTurn();
  } else {
    game.currentPlayerIndex = (game.currentPlayerIndex + 1) % game.players.length;
  }
  return ok();
}

function characterAbilityDefinition(characterId, abilityId) {
  return characterDefinition(characterId)?.abilities.find(ability => ability.id === abilityId);
}

function isAllSkillBlocked(player) {
  return player.disableAllSkillTurns > 0 || player.disableUntilOwnTurn;
}

function canActivateCharacter(player, instance, ability) {
  if (instance.permanentlyDisabled) return fail("该角色技能已永久失效");
  const useKey = `${instance.uid}:${ability.id}`;
  if (game.turn.usedAbilityIds.includes(useKey)) return fail("该技能本回合已经发动过");
  const firstRoundOverride = game.round === 1 && !player.firstRoundSkillUsed;
  if (!firstRoundOverride && (player.disableCharacterTurns > 0 || isAllSkillBlocked(player) || instance.disabledTurns > 0)) {
    return fail("本回合角色技能被禁用");
  }
  if (instance.cooldowns[ability.id] > 0) return fail(`技能冷却剩余${instance.cooldowns[ability.id]}回合`);
  if (ability.maxUses && instance.uses[ability.id] >= ability.maxUses) return fail("该技能已达到发动次数上限");
  if (ability.id === "ftayo-main" && game.round > Math.floor(game.totalRounds * .7)) return fail("已超过总回合数70%");
  return ok();
}

function activateCharacter(playerIndex, characterId, abilityId, payload = {}) {
  const player = game.players[playerIndex];
  const instance = player.characters.find(character => character.id === characterId);
  const definition = characterDefinition(characterId);
  const ability = characterAbilityDefinition(characterId, abilityId);
  if (!instance || !definition || !ability) return fail("未拥有该角色技能");
  const allowed = canActivateCharacter(player, instance, ability);
  if (!allowed.ok) return allowed;
  if (ability.choice === "three-dimensions") {
    const choices = Array.isArray(payload.dimensions) ? [...new Set(payload.dimensions)] : [];
    if (choices.length !== 3 || choices.some(dim => !CHANGEABLE_DIMENSIONS.includes(dim))) return fail("请选择3个不同维度");
  }
  if (ability.choice === "motion-distribution") {
    const abstractPoints = Number(payload.abstractPoints);
    if (!Number.isInteger(abstractPoints) || abstractPoints < 0 || abstractPoints > 5) return fail("请分配5个动效点数");
  }
  if (ability.choice === "opponent") {
    const target = game.players.find(candidate => candidate.memberId === payload.targetMemberId);
    if (!target || target.memberId === player.memberId) return fail("请选择1名其他玩家");
  }

  if (game.round === 1 && !player.firstRoundSkillUsed) {
    setScore(playerIndex, "selection", characterSelection(definition), {
      sourcePlayerIndex: playerIndex,
      allowSelectionChange: true,
      skipCrossing: true
    });
    player.firstRoundSkillUsed = true;
    appendLog(`${player.name} 以「${definition.name}」确定初始选曲品味为${characterSelection(definition)}。`, "effect");
  }

  if (ability.id === "ftayo-main") {
    payload.dimensions.forEach(dimension => {
      const highest = Math.max(...game.players.map(target => target.scores[dimension]));
      setScore(playerIndex, dimension, highest, { sourcePlayerIndex: playerIndex });
    });
    appendLog(`${player.name} 发动Ftayo技能：3个维度提升至全场最高。`, "effect");
  } else if (ability.id === "summercube-main") {
    applyScoreChange(playerIndex, "config", -1, { sourcePlayerIndex: playerIndex });
    applyScoreChange(playerIndex, "concrete", 5, { sourcePlayerIndex: playerIndex });
    appendLog(`${player.name} 发动Summercube技能：配置-1，具象动效+5。`, "effect");
  } else if (ability.id === "sulfur-main") {
    const abstractPoints = Number(payload.abstractPoints);
    applyScoreChange(playerIndex, "abstract", abstractPoints, { sourcePlayerIndex: playerIndex });
    applyScoreChange(playerIndex, "concrete", 5 - abstractPoints, { sourcePlayerIndex: playerIndex });
    appendLog(`${player.name} 发动SulfurDXD技能：分配5点动效。`, "effect");
  } else if (ability.id === "jinye-main") {
    const amount = Math.random() < .2 ? -2 : 5;
    applyScoreChange(playerIndex, "abstract", amount, { sourcePlayerIndex: playerIndex });
    appendLog(`${player.name} 发动金叶技能：抽象动效${amount > 0 ? "+" : ""}${amount}。`, "effect");
  } else if (ability.id === "ruishi-main") {
    const highest = Math.max(...DIMENSIONS.map(dim => player.scores[dim]));
    setScore(playerIndex, "config", Math.max(player.scores.config, highest), { sourcePlayerIndex: playerIndex });
    setScore(playerIndex, "abstract", Math.max(player.scores.abstract, highest), { sourcePlayerIndex: playerIndex });
    if (ownsCharacter(player, "cherry")) {
      DIMENSIONS.forEach(dim => applyScoreChange(playerIndex, dim, 1, { sourcePlayerIndex: playerIndex }));
    }
    appendLog(`${player.name} 发动瑞矢级别大技能。`, "effect");
  } else if (ability.id === "cherry-main") {
    applyScoreChange(playerIndex, "config", 2, { sourcePlayerIndex: playerIndex });
    applyScoreChange(playerIndex, "abstract", 2, { sourcePlayerIndex: playerIndex });
    if (ownsCharacter(player, "ruishi")) {
      DIMENSIONS.forEach(dim => applyScoreChange(playerIndex, dim, 1, { sourcePlayerIndex: playerIndex }));
    }
    appendLog(`${player.name} 发动樱桃喝酒人技能。`, "effect");
  } else if (ability.id === "naogui-main") {
    applyScoreChange(playerIndex, "config", 3, { sourcePlayerIndex: playerIndex });
    appendLog(`${player.name} 发动恼鬼技能：配置水平+3。`, "effect");
  } else if (ability.id === "two-three-eight-main") {
    applyScoreChange(playerIndex, "abstract", 3, { sourcePlayerIndex: playerIndex });
    appendLog(`${player.name} 发动238技能：抽象动效+3。`, "effect");
  } else if (ability.id === "tokyo-main") {
    const halved = game.players.some(candidate => ownsCharacter(candidate, "canada-goose"));
    applyScoreChange(playerIndex, "config", halved ? 2 : 4, { sourcePlayerIndex: playerIndex });
    appendLog(`${player.name} 发动地道东京爷技能：配置水平+${halved ? 2 : 4}。`, "effect");
  } else if (ability.id === "furry-main") {
    if (Math.random() < .7) {
      drawCards(playerIndex, 1);
      appendLog(`${player.name} 发动福瑞王技能：额外抽1张牌。`, "effect");
    } else {
      DIMENSIONS.forEach(dim => applyScoreChange(playerIndex, dim, dim === "innovation" ? 2 : -1, { sourcePlayerIndex: playerIndex }));
      appendLog(`${player.name} 发动福瑞王技能并触发“创新”。`, "effect");
    }
  } else if (ability.id === "canada-wjc") {
    game.players.forEach((target, targetIndex) => {
      if (targetIndex === playerIndex) return;
      target.characters.forEach(character => {
        if (character.id !== "canada-goose") character.disabledTurns = Math.max(character.disabledTurns, 1);
      });
    });
    appendLog(`${player.name} 发动WJC：其他玩家的非加拿大鹅角色卡下回合禁用。`, "effect");
  } else if (ability.id === "canada-shift") {
    const targetIds = Array.isArray(payload.targetMemberIds) ? [...new Set(payload.targetMemberIds)].slice(0, 2) : [];
    targetIds.forEach(memberId => {
      const targetIndex = game.players.findIndex(candidate => candidate.memberId === memberId && candidate.memberId !== player.memberId);
      if (targetIndex >= 0) applyScoreChange(targetIndex, randomDimension(), -1, { sourcePlayerIndex: playerIndex });
    });
    applyScoreChange(playerIndex, randomDimension(), 2, { sourcePlayerIndex: playerIndex });
    appendLog(`${player.name} 发动加拿大鹅技能。`, "effect");
  } else if (ability.id === "disinfectant-main") {
    const cards = game.players.flatMap(target => target.characters).filter(character => !character.permanentlyDisabled);
    shuffle(cards);
    cards.slice(0, Math.floor(game.players.length / 3)).forEach(character => {
      character.disabledTurns = Math.max(character.disabledTurns, 1);
    });
    appendLog(`${player.name} 发动“魅惑”。`, "effect");
  } else if (ability.id === "ziwei-main") {
    if (Math.random() < .8) {
      const dimension = randomDimension();
      applyScoreChange(playerIndex, dimension, 3, { sourcePlayerIndex: playerIndex });
      appendLog(`${player.name} 发动子微中技能：${DIMENSION_LABELS[dimension]}+3。`, "effect");
    } else {
      appendLog(`${player.name} 发动子微中技能并触发“子微”，技能失败。`, "effect");
    }
  } else if (ability.id === "chi-mahu-main") {
    const targetIndex = game.players.findIndex(candidate => candidate.memberId === payload.targetMemberId);
    const target = game.players[targetIndex];
    gainReputation(playerIndex, -player.handExchangeCost);
    handleNonPlayCardLoss(playerIndex, player.hand.length);
    handleNonPlayCardLoss(targetIndex, target.hand.length);
    const ownHand = player.hand;
    player.hand = target.hand;
    target.hand = ownHand;
    player.handCount = player.hand.length;
    target.handCount = target.hand.length;
    player.handExchangeCost *= 2;
    appendLog(`${player.name} 与${target.name}交换全部手牌。`, "effect");
  } else if (ability.id === "dagezi-main") {
    const lowest = Math.min(...DIMENSIONS.map(dim => player.scores[dim]));
    DIMENSIONS.forEach(dim => setScore(playerIndex, dim, lowest, { sourcePlayerIndex: playerIndex }));
    gainReputation(playerIndex, 1, { cap: 15 });
    appendLog(`${player.name} 发动大鸽子喵喵喵技能：选曲品味外的维度降至${lowest}，声望+1。`, "effect");
  } else if (ability.id === "hotwind-main") {
    gainReputation(playerIndex, -1);
    game.players.forEach((target, targetIndex) => {
      if (target.reviewTurns > 0) applyScoreChange(targetIndex, "abstract", -2, { sourcePlayerIndex: playerIndex });
    });
    appendLog(`${player.name} 发动热风小西八技能：评议玩家抽象动效-2。`, "effect");
  }

  const actualCooldown = ability.id === "two-three-eight-main" && ownsCharacter(player, "ftayo") ? 2 : ability.cooldown;
  instance.cooldowns[ability.id] = actualCooldown;
  instance.uses[ability.id]++;
  game.turn.usedAbilityIds.push(`${instance.uid}:${ability.id}`);
  return ok();
}

function executeSkillCard(playerIndex, cardUid, payload = {}) {
  const player = game.players[playerIndex];
  const cardIndex = player.hand.findIndex(card => card.uid === cardUid);
  if (cardIndex < 0) return fail("手牌不存在");
  const card = player.hand[cardIndex];
  const definition = skillDefinition(card.cardId);
  const ownTurn = game.currentPlayerIndex === playerIndex;
  if (!definition) return fail("卡牌数据不存在");
  if (!ownTurn) return fail("该牌只能在自己的回合打出");
  if (isAllSkillBlocked(player)) return fail("本回合不能发动技能");

  let target = null;
  if (definition.target === "opponent") {
    target = game.players.find(candidate => candidate.memberId === payload.targetMemberId);
    if (!target) return fail("目标不存在");
    if (target.memberId === player.memberId) return fail("必须选择其他玩家");
  }

  if (definition.id === "review") {
    player.reviewTurns = Math.max(player.reviewTurns, 2);
  } else if (definition.id === "commission") {
    const average = game.players.reduce((sum, candidate) => sum + candidate.scores.selection, 0) / game.players.length;
    setScore(playerIndex, "selection", average, {
      sourcePlayerIndex: playerIndex,
      allowSelectionChange: true,
      skipCrossing: true
    });
    drawCards(playerIndex, 1, true);
    const remainingRounds = game.totalRounds - game.round + 1;
    player.commissionLockAtRound = game.round + Math.floor(remainingRounds * .7);
    if (player.commissionLockAtRound <= game.round) player.commissionLocked = true;
  } else if (definition.id === "drink") {
    target.disableAllSkillTurns = Math.max(target.disableAllSkillTurns, 1);
  } else if (definition.id === "fge") {
    player.storyboard = true;
  }

  appendLog(`${player.name} 打出「${definition.name}」。`, "effect");
  player.hand.splice(cardIndex, 1);
  player.handCount = player.hand.length;
  game.discard.push(card);
  game.turn.skillCardsPlayed++;
  if (game.turn.skillCardsPlayed === 3 && ownsCharacter(player, "ziwei")) {
    drawCards(playerIndex, 1);
    appendLog(`${player.name} 在本回合打出第3张牌，抽1张牌。`, "effect");
  }
  return ok();
}

function handleNonPlayCardLoss(playerIndex, count) {
  const player = game.players[playerIndex];
  if (!player || !ownsCharacter(player, "two-three-eight") || count <= 0) return;
  const triggers = Math.min(count, 5 - player.counters.twoThreeEightLoss);
  for (let i = 0; i < triggers; i++) {
    player.counters.twoThreeEightLoss++;
    applyScoreChange(playerIndex, randomDimension(), 4, { sourcePlayerIndex: playerIndex });
  }
  if (triggers > 0) appendLog(`${player.name} 因非打出方式失去${triggers}张牌，随机维度获得加成。`, "effect");
}

function executeReviewVote(playerIndex, payload = {}) {
  const player = game.players[playerIndex];
  if (player.reviewTurns <= 0) return fail("当前没有评议身份");
  if (player.reviewActionUsed) return fail("本回合已经进行过评议");
  if (isAllSkillBlocked(player)) return fail("本回合不能发动技能");
  const targetIndex = game.players.findIndex(candidate => candidate.memberId === payload.targetMemberId);
  const target = game.players[targetIndex];
  if (!target) return fail("目标不存在");
  if (payload.vote === "red") {
    applyScoreChange(targetIndex, "config", 10, { sourcePlayerIndex: playerIndex });
    target.disableAllSkillTurns = Math.max(target.disableAllSkillTurns, 3);
    appendLog(`${player.name} 向${target.name}送出红票：配置水平+10，连续3回合不可发动技能。`, "effect");
  } else if (payload.vote === "green") {
    target.extraDrawNextTurn++;
    appendLog(`${player.name} 向${target.name}送出绿票：下回合额外摸1张牌。`, "effect");
  } else {
    return fail("请选择红票或绿票");
  }
  player.reviewActionUsed = true;
  return ok();
}

function endTurn(playerIndex) {
  const player = game.players[playerIndex];
  if (!game.turn.hasDrawn) return fail("必须先完成摸牌");
  if (game.round === 1 && !player.firstRoundSkillUsed) {
    return fail("第1轮必须发动至少1次角色技能");
  }
  if (player.disableCharacterTurns > 0) player.disableCharacterTurns--;
  if (player.disableAllSkillTurns > 0) player.disableAllSkillTurns--;
  if (player.reviewTurns > 0) player.reviewTurns--;
  player.characters.forEach(character => {
    if (character.disabledTurns > 0) character.disabledTurns--;
  });
  game.currentPlayerIndex++;
  if (game.currentPlayerIndex >= game.players.length) {
    game.currentPlayerIndex = 0;
    game.round++;
    if (game.round > game.totalRounds) {
      settleGame();
      return ok();
    }
    appendLog(`第${game.round}轮开始。`, "event");
  }
  beginTurn();
  return ok();
}

function settleGame() {
  const preliminary = game.players
    .map((player, index) => ({ index, score: totalScore(player) }))
    .sort((a, b) => b.score - a.score);
  preliminary.forEach((entry, rankIndex) => {
    const player = game.players[entry.index];
    if (!ownsCharacter(player, "dagezi") || rankIndex === 0) return;
    const gap = preliminary[rankIndex - 1].score - entry.score;
    const triggers = Math.floor(gap / 3);
    for (let i = 0; i < triggers; i++) {
      const opponents = game.players.map((_, index) => index).filter(index => index !== entry.index && !game.players[index].frozen);
      if (!opponents.length) break;
      const targetIndex = randomItem(opponents);
      game.players[targetIndex].settlementPenalty -= 2;
      appendLog(`${player.name} 的结算被动使${game.players[targetIndex].name}综合分-2。`, "effect");
    }
  });
  game.phase = GAME_PHASE.SETTLEMENT;
  game.ranking = game.players
    .map(player => ({
      memberId: player.memberId,
      name: player.name,
      score: totalScore(player),
      scores: clone(player.scores),
      reputation: player.reputation,
      storyboard: player.storyboard,
      settlementPenalty: player.settlementPenalty
    }))
    .sort((a, b) => b.score - a.score);
  room.lifecycle = ROOM_STATE.SETTLEMENT;
  appendLog("全部回合结束，进入结算。", "event");
}

function ok(extra = {}) { return { ok: true, ...extra }; }
function fail(reason) { return { ok: false, reason }; }

function validateActor(memberId) {
  const index = game?.players.findIndex(player => player.memberId === memberId) ?? -1;
  if (index < 0) return { index, error: fail("观战者不能操作") };
  return { index, error: null };
}

function hostDispatch(memberId, action, payload = {}) {
  if (!room.isHost || !game || room.lifecycle !== ROOM_STATE.PLAYING) return fail("游戏当前不可操作");
  const actor = validateActor(memberId);
  if (actor.error) return actor.error;
  const playerIndex = actor.index;
  const ownTurn = game.currentPlayerIndex === playerIndex;
  let result = fail("未知操作");

  if (action === "DRAFT_BUY") {
    if (game.phase !== GAME_PHASE.DRAFT || !ownTurn) return fail("还没轮到你购置");
    result = buyCharacter(playerIndex, payload.characterId);
  } else if (action === "DRAFT_DONE") {
    if (game.phase !== GAME_PHASE.DRAFT || !ownTurn) return fail("还没轮到你购置");
    result = finishDraft(playerIndex);
  } else if (action === "DRAW") {
    if (game.phase !== GAME_PHASE.TURN || !ownTurn) return fail("现在不能摸牌");
    if (game.turn.hasDrawn) return fail("本回合已经摸过牌");
    game.turn.hasDrawn = true;
    result = ok({ draw: drawCard(playerIndex) });
  } else if (action === "PLAY_CARD") {
    if (game.phase !== GAME_PHASE.TURN) return fail("现在不能打出技能牌");
    result = executeSkillCard(playerIndex, payload.cardUid, payload);
  } else if (action === "ACTIVATE_CHARACTER") {
    if (game.phase !== GAME_PHASE.TURN || !ownTurn) return fail("只能在自己的回合发动角色技能");
    result = activateCharacter(playerIndex, payload.characterId, payload.abilityId, payload);
  } else if (action === "REVIEW_VOTE") {
    if (game.phase !== GAME_PHASE.TURN || !ownTurn) return fail("只能在自己的回合进行评议");
    result = executeReviewVote(playerIndex, payload);
  } else if (action === "END_TURN") {
    if (game.phase !== GAME_PHASE.TURN || !ownTurn) return fail("现在不能结束回合");
    result = endTurn(playerIndex);
  }

  if (result.ok) {
    game.sequence++;
    syncAll();
  }
  return result;
}

function publicGameFor(memberId) {
  if (!game) return null;
  const publicGame = clone(game);
  publicGame.players.forEach(player => {
    player.handCount = player.hand.length;
    if (player.memberId !== memberId) player.hand = [];
  });
  return publicGame;
}

function publicRoom() {
  return {
    code: room.code,
    hostId: room.hostId,
    lifecycle: room.lifecycle,
    settings: clone(room.settings),
    members: clone(room.members)
  };
}

function applyRoomSnapshot(snapshot) {
  if (!snapshot) return;
  room.code = snapshot.code;
  room.hostId = snapshot.hostId;
  room.isHost = room.myId === snapshot.hostId;
  room.lifecycle = snapshot.lifecycle;
  room.settings = snapshot.settings;
  room.members = snapshot.members;
  room.connected = true;
  ui.hostLostAt = 0;
  ui.message = "";
  ui.messageError = false;
  ui.screen = room.lifecycle === ROOM_STATE.WAITING ? "lobby" : "game";
}

function syncAll() {
  if (!room.isHost) {
    render();
    return;
  }
  room.members.forEach(member => {
    if (member.id === room.myId || !member.connected) return;
    room.transport?.sendToPlayer(member.id, {
      type: "SYNC",
      room: publicRoom(),
      game: publicGameFor(member.id),
      authorityBackup: game
    });
  });
  render();
}

function sendWelcome(memberId) {
  room.transport?.sendToPlayer(memberId, {
    type: "WELCOME",
    room: publicRoom(),
    game: publicGameFor(memberId),
    authorityBackup: game
  });
}

function broadcastLobby() {
  if (!room.isHost) return;
  room.transport?.broadcast({ type: "ROOM_SYNC", room: publicRoom() });
  render();
}

function handleJoin(message, meta) {
  if (!room.isHost || message.roomCode !== room.code) return;
  const safeName = String(message.name || "玩家").trim().slice(0, 16) || "玩家";
  room.transport.bindPlayer(meta.peerId, message.playerId, safeName);
  let member = room.members.find(item => item.id === message.playerId);
  if (member) {
    member.connected = true;
    member.disconnectedAt = 0;
    member.name = safeName;
    member.peerId = meta.peerId;
  } else {
    const spectator = room.lifecycle === ROOM_STATE.PLAYING ||
      room.lifecycle === ROOM_STATE.SETTLEMENT;
    member = {
      id: message.playerId,
      name: safeName,
      isHost: false,
      connected: true,
      spectator,
      peerId: meta.peerId
    };
    room.members.push(member);
  }
  if (game) {
    const player = game.players.find(item => item.memberId === member.id);
    if (player) {
      player.connected = true;
      player.disconnectedAt = 0;
      member.spectator = false;
    }
  }
  sendWelcome(member.id);
  if (room.lifecycle === ROOM_STATE.WAITING) broadcastLobby();
  else syncAll();
}

function handleNetworkMessage(message, meta = {}) {
  if (!message || !message.type) return;
  if (message.type === "JOIN") {
    handleJoin(message, meta);
    return;
  }
  if (message.type === "WELCOME") {
    applyRoomSnapshot(message.room);
    game = message.game;
    ui.authorityBackup = message.authorityBackup;
    if (ui.joinResolver) {
      ui.joinResolver(ok());
      ui.joinResolver = null;
    }
    render();
    return;
  }
  if (message.type === "REJECT") {
    if (ui.joinResolver) {
      ui.joinResolver(fail(message.reason || "无法加入房间"));
      ui.joinResolver = null;
    }
    return;
  }
  if (message.type === "ROOM_SYNC") {
    applyRoomSnapshot(message.room);
    render();
    return;
  }
  if (message.type === "SYNC") {
    applyRoomSnapshot(message.room);
    game = message.game;
    ui.authorityBackup = message.authorityBackup;
    ui.pendingRequest = false;
    render();
    return;
  }
  if (message.type === "ROOM_ACTION" && room.isHost) {
    handleRoomAction(meta.playerId, message.action, message.payload || {});
    return;
  }
  if (message.type === "GAME_ACTION" && room.isHost) {
    const result = hostDispatch(meta.playerId, message.action, message.payload || {});
    if (!result.ok) room.transport.sendToPlayer(meta.playerId, { type: "ACTION_ERROR", reason: result.reason });
    else if (result.draw?.kind === "event") room.transport.sendToPlayer(meta.playerId, { type: "DRAW_NOTICE", text: `摸到事件牌「${result.draw.name}」，已立即结算。` });
    return;
  }
  if (message.type === "ACTION_ERROR") {
    ui.pendingRequest = false;
    showToast(message.reason || "操作失败");
    render();
    return;
  }
  if (message.type === "DRAW_NOTICE") {
    showToast(message.text);
    return;
  }
  if (message.type === "HOST_MOVING") {
    scheduleGracefulMigration(message.nextHostId);
    return;
  }
  if (message.type === "PROMOTE") {
    promoteToHost(message.room, message.gameBackup);
  }
}

function handleRoomAction(memberId, action, payload) {
  if (!room.isHost) return;
  const member = room.members.find(item => item.id === memberId);
  if (!member) return;
  if (action === "UPDATE_ROUNDS" && memberId === room.hostId && room.lifecycle === ROOM_STATE.WAITING) {
    const rounds = Number(payload.totalRounds);
    if (Number.isSafeInteger(rounds) && rounds > 0) {
      room.settings.totalRounds = rounds;
      broadcastLobby();
    }
  } else if (action === "START" && memberId === room.hostId) {
    startGame();
  } else if (action === "BACK_TO_LOBBY" && memberId === room.hostId && room.lifecycle === ROOM_STATE.SETTLEMENT) {
    resetToLobby();
  } else if (action === "LEAVE") {
    markMemberDisconnected(memberId, true);
  }
}

function sendRoomAction(action, payload = {}) {
  if (room.isHost) handleRoomAction(room.myId, action, payload);
  else room.transport?.sendToHost({ type: "ROOM_ACTION", action, payload });
}

function sendGameAction(action, payload = {}) {
  if (ui.pendingRequest) return;
  if (room.isHost) {
    const result = hostDispatch(room.myId, action, payload);
    if (!result.ok) showToast(result.reason);
    else if (result.draw?.kind === "event") showToast(`摸到事件牌「${result.draw.name}」，已立即结算。`);
    render();
    return;
  }
  ui.pendingRequest = true;
  room.transport?.sendToHost({ type: "GAME_ACTION", action, payload });
  render();
}

function startGame() {
  const players = roomPlayers().filter(member => member.connected);
  if (room.lifecycle !== ROOM_STATE.WAITING) return;
  if (players.length < 2) return showToast("至少需要2名玩家");
  game = createGameState(players, room.settings.totalRounds);
  room.lifecycle = ROOM_STATE.PLAYING;
  appendLog(`游戏开始，共${game.totalRounds}轮。每位玩家拥有12点购置点数。`, "event");
  syncAll();
}

function resetToLobby() {
  game = null;
  room.lifecycle = ROOM_STATE.WAITING;
  const connected = room.members
    .filter(member => member.connected)
    .sort((a, b) => Number(b.id === room.hostId) - Number(a.id === room.hostId));
  room.members = connected.map(member => ({
    ...member,
    spectator: false
  }));
  broadcastLobby();
}

function markMemberDisconnected(memberId, voluntary = false) {
  const member = room.members.find(item => item.id === memberId);
  if (!member || member.id === room.hostId) return;
  if (voluntary && (room.lifecycle === ROOM_STATE.WAITING || member.spectator)) {
    room.members = room.members.filter(item => item.id !== memberId);
    if (game) syncAll();
    else broadcastLobby();
    return;
  }
  member.connected = false;
  member.disconnectedAt = Date.now();
  const player = game?.players.find(item => item.memberId === memberId);
  if (player) {
    player.connected = false;
    player.disconnectedAt = Date.now();
  }
  if (game) syncAll();
  else broadcastLobby();
}

async function createRoom(name) {
  ui.busy = true;
  ui.message = "正在创建房间...";
  ui.messageError = false;
  render();
  const code = cryptoRandom(5);
  try {
    const transport = new PeerTransport(code);
    installTransport(transport);
    await transport.startHost();
    room.connected = true;
    room.code = code;
    room.myName = name;
    room.hostId = room.myId;
    room.isHost = true;
    room.lifecycle = ROOM_STATE.WAITING;
    room.settings = { totalRounds: 10 };
    room.members = [{
      id: room.myId,
      name,
      isHost: true,
      connected: true,
      spectator: false,
      peerId: transport.myPeerId
    }];
    room.transport = transport;
    ui.screen = "lobby";
    ui.message = "";
  } catch (error) {
    room.transport?.close();
    room.transport = null;
    ui.message = friendlyConnectionError(error);
    ui.messageError = true;
  } finally {
    ui.busy = false;
    render();
  }
}

async function joinRoom(name, code, reconnect = false) {
  if (!reconnect) {
    ui.busy = true;
    ui.message = `正在加入房间 ${code}...`;
    ui.messageError = false;
    render();
  }
  try {
    const transport = new PeerTransport(code);
    installTransport(transport);
    await transport.startClient();
    room.transport = transport;
    room.code = code;
    room.myName = name;
    const joined = new Promise(resolve => {
      ui.joinResolver = resolve;
      setTimeout(() => {
        if (ui.joinResolver) {
          ui.joinResolver(fail("房间无响应"));
          ui.joinResolver = null;
        }
      }, 12000);
    });
    transport.sendToHost({ type: "JOIN", roomCode: code, playerId: room.myId, name, reconnect });
    const result = await joined;
    if (!result.ok) throw new Error(result.reason);
    room.connected = true;
    ui.message = "";
    ui.messageError = false;
  } catch (error) {
    room.transport?.close();
    room.transport = null;
    room.connected = false;
    if (!reconnect) {
      ui.screen = "entry";
      ui.message = friendlyConnectionError(error);
      ui.messageError = true;
    } else {
      ui.message = "重连失败，请返回首页后重新加入。";
      ui.messageError = true;
    }
  } finally {
    ui.busy = false;
    render();
  }
}

function installTransport(transport) {
  room.transport = transport;
  transport.onMessage = handleNetworkMessage;
  transport.onPeerLeft = meta => {
    if (room.isHost && meta.playerId) markMemberDisconnected(meta.playerId);
  };
  transport.onHostLost = () => handleUnexpectedHostLoss();
}

function friendlyConnectionError(error) {
  const message = String(error?.message || error || "连接失败");
  if (message.includes("unavailable-id")) return "该房间码已被占用，请重试。";
  if (message.includes("peer-unavailable")) return "房间不存在或房主尚未就绪。";
  if (message.includes("PeerJS")) return "联机组件加载失败，请检查网络后刷新。";
  if (message.includes("timeout") || message.includes("超时") || message.includes("无响应")) return "连接超时，请确认房间码和网络状态。";
  return message;
}

function handleUnexpectedHostLoss() {
  if (room.isHost || !room.connected) return;
  ui.hostLostAt = Date.now();
  ui.message = "房主连接中断，30秒后尝试转移房主。";
  render();
  clearTimeout(ui.migrationTimer);
  const candidates = room.members.filter(member => member.id !== room.hostId && member.connected && !member.spectator);
  const nextHost = candidates[0];
  if (!nextHost) return;
  const delay = nextHost.id === room.myId ? 30000 : 33500;
  ui.migrationTimer = setTimeout(() => {
    if (nextHost.id === room.myId) {
      const snapshot = publicRoom();
      snapshot.hostId = room.myId;
      snapshot.members = snapshot.members.map(member => ({
        ...member,
        isHost: member.id === room.myId,
        connected: member.id === room.hostId ? false : member.connected
      }));
      promoteToHost(snapshot, ui.authorityBackup);
    } else {
      reconnectToCurrentHost();
    }
  }, delay);
}

function scheduleGracefulMigration(nextHostId) {
  clearTimeout(ui.migrationTimer);
  ui.message = "房主正在转移，稍后自动重连。";
  render();
  if (nextHostId !== room.myId) ui.migrationTimer = setTimeout(reconnectToCurrentHost, 1800);
}

async function promoteToHost(roomSnapshot, gameBackup) {
  try {
    room.transport?.close();
    await new Promise(resolve => setTimeout(resolve, 700));
    applyRoomSnapshot(roomSnapshot);
    room.hostId = room.myId;
    room.isHost = true;
    room.members = room.members.map(member => ({ ...member, isHost: member.id === room.myId }));
    game = gameBackup || game;
    const transport = new PeerTransport(room.code);
    installTransport(transport);
    await transport.startHost();
    room.transport = transport;
    room.connected = true;
    ui.message = "";
    if (game) {
      const previousHost = game.players.find(player => player.memberId !== room.myId && !room.members.find(member => member.id === player.memberId)?.connected);
      if (previousHost) {
        previousHost.connected = false;
        previousHost.disconnectedAt = Date.now();
      }
    }
    syncAll();
  } catch (error) {
    room.isHost = false;
    ui.message = "房主转移失败，正在尝试恢复连接。";
    render();
    setTimeout(reconnectToCurrentHost, 1200);
  }
}

function reconnectToCurrentHost() {
  room.transport?.close();
  joinRoom(room.myName, room.code, true);
}

function leaveRoom() {
  if (!room.connected) return resetClient();
  if (room.isHost) {
    const next = room.members.find(member => member.id !== room.myId && member.connected && !member.spectator);
    if (next) {
      const snapshot = publicRoom();
      snapshot.hostId = next.id;
      snapshot.members = snapshot.members.map(member => ({
        ...member,
        isHost: member.id === next.id,
        connected: member.id === room.myId ? false : member.connected
      }));
      room.transport.sendToPlayer(next.id, { type: "PROMOTE", room: snapshot, gameBackup: game });
      room.transport.broadcast({ type: "HOST_MOVING", nextHostId: next.id });
      setTimeout(resetClient, 350);
      return;
    }
  } else {
    room.transport?.sendToHost({ type: "ROOM_ACTION", action: "LEAVE", payload: {} });
  }
  resetClient();
}

function resetClient() {
  clearTimeout(ui.migrationTimer);
  room.transport?.close();
  room.connected = false;
  room.code = "";
  room.hostId = "";
  room.isHost = false;
  room.lifecycle = ROOM_STATE.WAITING;
  room.members = [];
  room.transport = null;
  game = null;
  ui.screen = "entry";
  ui.modal = null;
  ui.pendingRequest = false;
  ui.message = "";
  render();
}

function render() {
  if (ui.screen === "entry" || !room.connected) renderEntry();
  else if (room.lifecycle === ROOM_STATE.WAITING) renderLobby();
  else if (room.lifecycle === ROOM_STATE.SETTLEMENT || game?.phase === GAME_PHASE.SETTLEMENT) renderSettlement();
  else renderGame();
  if (ui.toast) app.insertAdjacentHTML("beforeend", `<div class="toast" role="status">${escapeHtml(ui.toast)}</div>`);
  if (ui.rulesOpen) renderRulesModal();
  if (ui.modal) renderActionModal();
  if (ui.hostLostAt && !room.isHost && room.connected) {
    app.insertAdjacentHTML("beforeend", `<div class="connection-warning">${escapeHtml(ui.message || "连接中断，正在恢复。")}</div>`);
  }
  initIcons();
}

function renderEntry() {
  app.innerHTML = `
    <div class="entry-shell">
      <div class="brand">
        <div class="brand-mark">${icon("music-2", 26)}</div>
        <div><h1>谱师卡牌</h1><div class="version">${VERSION}</div></div>
      </div>
      <section class="entry-form">
        <div class="mode-line">${icon("users", 18)} 房间</div>
        <div class="field">
          <label for="player-name">玩家名称</label>
          <input class="input" id="player-name" maxlength="16" autocomplete="nickname" placeholder="输入你的名称" value="${escapeHtml(room.myName)}">
        </div>
        <button class="btn primary full" id="create-room" ${ui.busy ? "disabled" : ""}>${icon("plus", 16)} 创建房间</button>
        <div class="divider">或加入房间</div>
        <div class="join-row">
          <input class="input room-code-input" id="join-code" maxlength="5" placeholder="房间码" autocomplete="off">
          <button class="btn" id="join-room" ${ui.busy ? "disabled" : ""}>${icon("log-in", 16)} 加入</button>
        </div>
        <div class="status-message ${ui.messageError ? "error" : ""}" role="status">${escapeHtml(ui.message)}</div>
        <div class="brief">房间人数大于1人即可开始。游戏开始后加入的成员只能观战，等本局结束后再加入玩家列表。</div>
      </section>
    </div>`;
  const nameInput = document.getElementById("player-name");
  document.getElementById("create-room").onclick = () => {
    const name = nameInput.value.trim();
    if (!name) return setMessage("请输入玩家名称。", true);
    room.myName = name;
    createRoom(name);
  };
  document.getElementById("join-room").onclick = () => {
    const name = nameInput.value.trim();
    const code = document.getElementById("join-code").value.trim().toUpperCase();
    if (!name) return setMessage("请输入玩家名称。", true);
    if (!/^[A-Z2-9]{5}$/.test(code)) return setMessage("请输入5位房间码。", true);
    room.myName = name;
    joinRoom(name, code);
  };
  document.getElementById("join-code").onkeydown = event => {
    if (event.key === "Enter") document.getElementById("join-room").click();
  };
}

function topbar(title, extra = "") {
  return `
    <header class="topbar">
      <div class="topbar-title">${escapeHtml(title)}</div>
      <span class="room-pill">${room.code}</span>
      ${extra}
      <span class="spacer"></span>
      <button class="btn icon-only small" id="rules-button" title="查看规则">${icon("book-open", 16)}</button>
      <button class="btn icon-only small danger" id="leave-button" title="离开房间">${icon("log-out", 16)}</button>
    </header>`;
}

function bindTopbar() {
  document.getElementById("rules-button").onclick = () => { ui.rulesOpen = true; render(); };
  document.getElementById("leave-button").onclick = leaveRoom;
}

function renderLobby() {
  const activePlayers = roomPlayers().filter(member => member.connected);
  const canStart = room.isHost &&
    activePlayers.length >= 2;
  app.innerHTML = `
    ${topbar("房间大厅", `<span class="state-pill">${room.lifecycle}</span>`)}
    <div class="room-layout">
      <div>
        <section class="section">
          <div class="section-note">房间码</div>
          <div class="lobby-code">${room.code}</div>
          <div class="lobby-sub">将房间码发给其他玩家。</div>
          <div class="lobby-actions">
            <button class="btn" id="copy-code">${icon("copy", 15)} 复制房间码</button>
            ${room.isHost
              ? `<button class="btn primary" id="start-game" ${canStart ? "" : "disabled"}>${icon("play", 15)} 开始游戏</button>`
              : ""}
          </div>
          <div class="status-message ${ui.messageError ? "error" : ""}">${escapeHtml(ui.message)}</div>
        </section>
        <section class="section">
          <div class="section-head"><h2>玩家列表</h2><span class="section-note">${activePlayers.length} 名玩家</span></div>
          <div class="member-list">${room.members.map(renderMemberRow).join("")}</div>
        </section>
      </div>
      <aside>
        <section class="section">
          <div class="section-head"><h2>房间设置</h2>${room.isHost ? '<span class="tag host">房主可改</span>' : ""}</div>
          <div class="setting-row">
            <div class="setting-label">总回合数<span>回合数可由玩家自行设置</span></div>
            <input class="input round-input" id="round-count" type="number" min="1" step="1" value="${room.settings.totalRounds}" ${room.isHost ? "" : "disabled"}>
          </div>
          <div class="setting-row">
            <div class="setting-label">初始购置点数<span>购置角色后进入第1轮</span></div>
            <strong>12</strong>
          </div>
        </section>
        <div class="notice">房间人数大于1人即可开始。游戏开始后新成员只能观战。</div>
      </aside>
    </div>`;
  bindTopbar();
  document.getElementById("copy-code").onclick = async () => {
    try {
      await navigator.clipboard.writeText(room.code);
      showToast("房间码已复制");
    } catch (_) {
      showToast(`房间码：${room.code}`);
    }
  };
  if (room.isHost) {
    document.getElementById("start-game").onclick = () => sendRoomAction("START");
    document.getElementById("round-count").onchange = event => {
      const rounds = Number(event.target.value);
      if (Number.isSafeInteger(rounds) && rounds > 0) sendRoomAction("UPDATE_ROUNDS", { totalRounds: rounds });
      else render();
    };
  }
}

function renderMemberRow(member) {
  const labels = [
    member.isHost ? '<span class="tag host">房主</span>' : "",
    member.spectator ? '<span class="tag spectator">观战</span>' : "",
    !member.connected ? '<span class="tag bad">掉线</span>' : "",
    member.id === room.myId ? '<span class="tag">你</span>' : ""
  ].join("");
  return `<div class="member-row">
    <span class="member-dot ${member.connected ? "" : "offline"}"></span>
    <span class="member-name">${escapeHtml(member.name)}</span>
    ${labels}
  </div>`;
}

function renderGame() {
  const me = myGamePlayer();
  const current = currentPlayer();
  const draft = game.phase === GAME_PHASE.DRAFT;
  const phaseLabel = draft ? "购置阶段" : `第${game.round}/${game.totalRounds}轮`;
  app.innerHTML = `
    ${topbar("谱师卡牌", `<span class="state-pill">${phaseLabel}</span>
      <div class="turn-line">当前：<strong>${escapeHtml(current?.name || "")}</strong>${draft ? "购置角色" : "进行回合"}</div>`)}
    ${isSpectator() ? `<div class="spectator-banner">${icon("eye", 15)} 观战模式：你可以查看公开数据，但不能查看手牌或执行操作。</div>` : ""}
    <div class="game-layout">
      <aside class="side-column">
        <section class="section">
          <div class="section-head"><h2>玩家</h2><span class="section-note">${game.players.length}人</span></div>
          ${game.players.map((player, index) => renderPlayerMini(player, index)).join("")}
        </section>
        <section class="section">
          <div class="section-head"><h2>操作记录</h2></div>
          <div class="log-list">${game.log.slice().reverse().map(renderLog).join("")}</div>
        </section>
      </aside>
      <div class="main-column">
        ${renderDimensionPanel(me)}
        ${draft ? renderDraft(me) : renderTurn(me)}
      </div>
    </div>`;
  bindTopbar();
  if (draft) bindDraft(me);
  else bindTurn(me);
}

function renderDimensionPanel(player) {
  if (!player) return "";
  return `<div class="dimension-panel">
    ${DIMENSIONS.map(dim => `<div class="dimension"><div class="dimension-label">${DIMENSION_LABELS[dim]} · ${SCORE_WEIGHTS[dim] * 100}%</div><div class="dimension-value">${formatNumber(player.scores[dim])}</div></div>`).join("")}
    <div class="dimension reputation"><div class="dimension-label">声望 / 总分</div><div class="dimension-value">${player.reputation} <span class="dimension-total">· ${totalScore(player)}</span></div></div>
  </div>`;
}

function formatNumber(value) {
  return Number.isInteger(value) ? value : roundScore(value);
}

function renderPlayerMini(player, index) {
  const active = index === game.currentPlayerIndex;
  const statuses = [
    player.disableAllSkillTurns > 0 || player.disableUntilOwnTurn ? `<span class="tag bad">禁用技能</span>` : "",
    player.disableCharacterTurns > 0 ? `<span class="tag bad">角色禁用${player.disableCharacterTurns}</span>` : "",
    player.reviewTurns > 0 ? `<span class="tag good">评议${player.reviewTurns}</span>` : "",
    player.frozen ? '<span class="tag bad">点数定格</span>' : "",
    player.storyboard ? '<span class="tag good">故事板</span>' : "",
    !player.connected ? '<span class="tag bad">掉线</span>' : ""
  ].join("");
  return `<div class="player-mini ${active ? "active" : ""} ${player.memberId === room.myId ? "me" : ""}">
    <div class="player-mini-head"><span class="player-mini-name">${escapeHtml(player.name)}</span>${active ? '<span class="tag good">当前</span>' : ""}${statuses}</div>
    <div class="mini-dims">${DIMENSIONS.map(dim => `<span class="mini-dim">${DIMENSION_LABELS[dim].slice(0, 2)}<b>${player.scores[dim]}</b></span>`).join("")}</div>
  </div>`;
}

function renderLog(entry) {
  return `<div class="log-entry ${entry.type}"><span class="log-round">${entry.round ? `R${entry.round}` : "准备"}</span><span class="log-text">${escapeHtml(entry.text)}</span></div>`;
}

function renderDraft(me) {
  const active = isMyTurn() && !isSpectator();
  return `
    <div class="phase-banner">${icon("shopping-basket", 19)}<div><strong>${active ? "轮到你购置角色" : `等待 ${escapeHtml(currentPlayer()?.name)} 购置`}</strong><span>每名玩家拥有12点，不可重复购置同一角色。</span></div></div>
    <section class="section">
      <div class="section-head"><h2>角色卡池</h2><span class="shop-balance">剩余 ${me?.funds ?? "-"} 点</span></div>
      <div class="character-grid">${CHARACTERS.map(character => renderShopCard(character, me, active)).join("")}</div>
    </section>
    <div class="actionbar">
      <span class="action-hint">${active ? "确认完成后将轮到下一名玩家。" : "非当前购置玩家不能操作。"}</span>
      ${active ? `<button class="btn primary" id="draft-done" ${me?.characters.length ? "" : "disabled"}>${icon("check", 15)} 完成购置</button>` : ""}
    </div>`;
}

function renderShopCard(character, me, active) {
  const price = RARITY[character.rarity].price;
  const owned = me?.characters.some(item => item.id === character.id);
  const affordable = Boolean(active && me && me.funds >= price && !owned);
  return `<article class="game-card character">
    <div class="card-top"><span class="card-kind">角色</span><span class="rarity">${character.rarity}</span></div>
    <div class="card-glyph">${icon(character.glyph, 28)}</div>
    <div class="card-name">${escapeHtml(character.name)}</div>
    ${character.lore ? `<div class="card-lore">${escapeHtml(character.lore)}</div>` : ""}
    <div class="character-stats">${CHARACTER_STATS.map(stat => `<div class="character-stat"><span>${CHARACTER_STAT_LABELS[stat]}</span><b>★${character.stats[stat]}</b></div>`).join("")}</div>
    <div class="card-desc">
      ${character.abilities.map((ability, index) => `<div class="card-effect"><strong>${character.abilities.length > 1 ? `角色技能${index + 1}` : "角色技能"}</strong> ${escapeHtml(ability.description)}</div>`).join("")}
      <div class="card-passive"><strong>被动技能</strong> ${escapeHtml(character.passive)}</div>
    </div>
    <div class="card-meta">购置 ${price}点 · 选曲品味 ${character.stats.selection}</div>
    <div class="card-action">${owned
      ? '<div class="owned-mark">已购置</div>'
      : `<button class="btn ${affordable ? "coral" : ""}" data-buy="${character.id}" ${affordable ? "" : "disabled"}>${icon("coins", 14)} ${price}点购置</button>`}</div>
  </article>`;
}

function bindDraft(me) {
  document.querySelectorAll("[data-buy]").forEach(button => {
    button.onclick = () => sendGameAction("DRAFT_BUY", { characterId: button.dataset.buy });
  });
  const done = document.getElementById("draft-done");
  if (done) done.onclick = () => sendGameAction("DRAFT_DONE");
}

function renderTurn(me) {
  const ownTurn = isMyTurn() && !isSpectator();
  const mustUseCharacter = ownTurn && game.round === 1 && !me?.firstRoundSkillUsed;
  const hand = me?.hand || [];
  let instruction = `等待 ${escapeHtml(currentPlayer()?.name)} 完成回合`;
  if (mustUseCharacter && !game.turn.hasDrawn) instruction = "第1轮至少发动1次角色技能，本轮还需摸1张牌";
  else if (mustUseCharacter) instruction = "第1轮至少发动1次角色技能";
  else if (ownTurn && !game.turn.hasDrawn) instruction = "本轮必须且只能摸1张牌";
  else if (ownTurn) instruction = "可以发动角色技能、打出技能牌或结束回合";
  return `
    <div class="phase-banner">${icon(mustUseCharacter ? "circle-alert" : "route", 19)}<div><strong>${instruction}</strong><span>牌堆 ${game.deck.length} · 弃牌 ${game.discard.length} · 本回合打出 ${game.turn.skillCardsPlayed} 张技能牌</span></div></div>
    ${renderPlayerStatuses(me, ownTurn)}
    <section class="section">
      <div class="section-head"><h2>手牌</h2><span class="section-note">${me ? `${me.handCount}张` : "不可见"}</span></div>
      ${hand.length ? `<div class="card-row">${hand.map(card => renderSkillCard(card, me, ownTurn)).join("")}</div>` : '<div class="empty">暂无技能牌。事件牌摸到后会立即触发，不会进入这里。</div>'}
    </section>
    <section class="section">
      <div class="section-head"><h2>角色技能</h2><span class="section-note">角色牌只能发动技能</span></div>
      ${me?.characters.length ? `<div class="ability-grid">${me.characters.map(instance => renderAbility(instance, me, ownTurn)).join("")}</div>` : '<div class="empty">未购置角色</div>'}
    </section>
    <div class="actionbar">
      <span class="action-hint">${instruction}</span>
      ${ownTurn && !game.turn.hasDrawn ? `<button class="btn primary" id="draw-card" ${ui.pendingRequest ? "disabled" : ""}>${icon("hand", 15)} 摸1张牌</button>` : ""}
      ${ownTurn ? `<button class="btn coral" id="end-turn" ${(!game.turn.hasDrawn || mustUseCharacter || ui.pendingRequest) ? "disabled" : ""}>${icon("skip-forward", 15)} 结束回合</button>` : ""}
    </div>`;
}

function renderPlayerStatuses(me, ownTurn) {
  if (!me) return "";
  const statuses = [
    me.reviewTurns > 0 ? `<span class="tag good">评议剩余${me.reviewTurns}回合</span>` : "",
    me.storyboard ? '<span class="tag good">故事板 +5</span>' : "",
    me.frozen ? '<span class="tag bad">所有点数定格</span>' : "",
    me.commissionLocked ? '<span class="tag bad">约稿点数锁定</span>' : "",
    me.commissionLockAtRound != null && !me.commissionLocked ? `<span class="tag">第${me.commissionLockAtRound}轮锁定</span>` : "",
    me.disableAllSkillTurns > 0 || me.disableUntilOwnTurn ? '<span class="tag bad">本回合不可发动技能</span>' : "",
    me.disableCharacterTurns > 0 ? `<span class="tag bad">角色技能禁用${me.disableCharacterTurns}回合</span>` : ""
  ].filter(Boolean);
  const canReview = ownTurn && me.reviewTurns > 0 && !me.reviewActionUsed && !isAllSkillBlocked(me) && !ui.pendingRequest;
  if (!statuses.length && !canReview) return "";
  return `<div class="status-row">${statuses.join("")}${canReview ? `<button class="btn small" id="review-vote">${icon("tickets", 14)} 进行评议</button>` : ""}</div>`;
}

function renderSkillCard(card, me, ownTurn) {
  const definition = skillDefinition(card.cardId);
  const canUse = ownTurn && !ui.pendingRequest && !isAllSkillBlocked(me);
  return `<article class="game-card skill">
    <div class="card-top"><span class="card-kind">技能牌</span><span class="rarity">己方</span></div>
    <div class="card-glyph">${icon(definition.glyph, 28)}</div>
    <div class="card-name">${escapeHtml(definition.name)}</div>
    <div class="card-desc">${escapeHtml(definition.description)}</div>
    <div class="card-meta">自己的回合使用</div>
    <div class="card-action"><button class="btn" data-play-card="${card.uid}" ${canUse ? "" : "disabled"}>${icon("play", 13)} 使用</button></div>
  </article>`;
}

function renderAbility(instance, me, ownTurn) {
  const definition = characterDefinition(instance.id);
  return definition.abilities.map((ability, abilityIndex) => {
    const allowed = ownTurn ? canActivateCharacter(me, instance, ability) : fail("等待自己的回合");
    const canUse = ownTurn && !ui.pendingRequest && allowed.ok;
    return `<article class="ability-item">
      <div class="ability-head"><div><div class="ability-name">${definition.abilities.length > 1 ? `角色技能${abilityIndex + 1}` : "角色技能"}</div><div class="ability-owner">${escapeHtml(definition.name)}</div></div><span class="tag ${canUse ? "good" : ""}">${canUse ? "可发动" : escapeHtml(allowed.reason)}</span></div>
      <div class="ability-desc">${escapeHtml(ability.description)}</div>
      ${abilityIndex === 0 ? `<div class="ability-passive"><strong>被动：</strong>${escapeHtml(definition.passive)}</div>` : ""}
      <button class="btn" data-character="${definition.id}" data-ability="${ability.id}" ${canUse ? "" : "disabled"}>${icon("sparkles", 13)} 发动技能</button>
    </article>`;
  }).join("");
}

function bindTurn(me) {
  document.getElementById("draw-card")?.addEventListener("click", () => sendGameAction("DRAW"));
  document.getElementById("end-turn")?.addEventListener("click", () => sendGameAction("END_TURN"));
  document.querySelectorAll("[data-play-card]").forEach(button => {
    button.onclick = () => openCardAction(button.dataset.playCard);
  });
  document.querySelectorAll("[data-ability]").forEach(button => {
    button.onclick = () => openAbilityAction(button.dataset.character, button.dataset.ability);
  });
  document.getElementById("review-vote")?.addEventListener("click", openReviewAction);
}

function openCardAction(cardUid) {
  const me = myGamePlayer();
  const card = me?.hand.find(item => item.uid === cardUid);
  const definition = skillDefinition(card?.cardId);
  if (!card || !definition) return;
  if (definition.target === "self") return sendGameAction("PLAY_CARD", { cardUid });
  const targets = game.players.filter(player => player.memberId !== me.memberId);
  ui.modal = { kind: "target-card", cardUid, title: definition.name, description: definition.description, targets };
  render();
}

function openAbilityAction(characterId, abilityId) {
  const definition = characterDefinition(characterId);
  const ability = characterAbilityDefinition(characterId, abilityId);
  if (!definition || !ability) return;
  if (ability.choice === "three-dimensions") {
    ui.modal = { kind: "three-dimensions", characterId, abilityId, title: definition.name, description: ability.description, selected: [] };
  } else if (ability.choice === "motion-distribution") {
    ui.modal = { kind: "motion-distribution", characterId, abilityId, title: definition.name, description: ability.description };
  } else if (ability.choice === "up-to-two-targets") {
    ui.modal = {
      kind: "up-to-two-targets",
      characterId,
      abilityId,
      title: definition.name,
      description: ability.description,
      targets: game.players.filter(player => player.memberId !== room.myId),
      selected: []
    };
  } else if (ability.choice === "opponent") {
    ui.modal = {
      kind: "target-ability",
      characterId,
      abilityId,
      title: definition.name,
      description: ability.description,
      targets: game.players.filter(player => player.memberId !== room.myId)
    };
  } else {
    return sendGameAction("ACTIVATE_CHARACTER", { characterId, abilityId });
  }
  render();
}

function openReviewAction() {
  ui.modal = {
    kind: "review-vote",
    title: "评议",
    description: skillDefinition("review").description,
    targets: game.players
  };
  render();
}

function renderActionModal() {
  const modal = ui.modal;
  let choices = "";
  if (modal.kind === "target-card" || modal.kind === "target-ability") {
    choices = `<div class="target-list">${modal.targets.map(target => `<button class="target-btn" data-select-target="${target.memberId}"><span>${escapeHtml(target.name)}</span><span class="target-score">${totalScore(target)}分</span></button>`).join("")}</div>`;
  } else if (modal.kind === "motion-distribution") {
    choices = `<div class="target-list">
      ${[0, 1, 2, 3, 4, 5].map(value => `<button class="target-btn" data-motion-points="${value}"><span>抽象 ${value} · 具象 ${5 - value}</span><span class="target-score">5点</span></button>`).join("")}
    </div>`;
  } else if (modal.kind === "three-dimensions") {
    choices = `<div class="target-list">${CHANGEABLE_DIMENSIONS.map(dim => `<button class="target-btn ${modal.selected.includes(dim) ? "selected" : ""}" data-toggle-dimension="${dim}"><span>${DIMENSION_LABELS[dim]}</span><span class="target-score">${modal.selected.includes(dim) ? "已选" : "选择"}</span></button>`).join("")}</div>
      <div class="modal-actions"><button class="btn primary" id="confirm-modal" ${modal.selected.length === 3 ? "" : "disabled"}>确定</button></div>`;
  } else if (modal.kind === "up-to-two-targets") {
    choices = `<div class="target-list">${modal.targets.map(target => `<button class="target-btn ${modal.selected.includes(target.memberId) ? "selected" : ""}" data-toggle-target="${target.memberId}"><span>${escapeHtml(target.name)}</span><span class="target-score">${modal.selected.includes(target.memberId) ? "已选" : "选择"}</span></button>`).join("")}</div>
      <div class="modal-actions"><button class="btn primary" id="confirm-modal">确定</button></div>`;
  } else if (modal.kind === "review-vote") {
    choices = `<div>${modal.targets.map(target => `<div class="vote-row"><span>${escapeHtml(target.name)}</span><button class="btn small" data-review-target="${target.memberId}" data-vote="green">绿票</button><button class="btn small coral" data-review-target="${target.memberId}" data-vote="red">红票</button></div>`).join("")}</div>`;
  }
  app.insertAdjacentHTML("beforeend", `<div class="modal"><div class="modal-box">
    <div class="modal-head"><h3>${escapeHtml(modal.title)}</h3><button class="btn icon-only small" id="close-modal" title="关闭">${icon("x", 15)}</button></div>
    <div class="modal-desc">${escapeHtml(modal.description)}</div>${choices}
  </div></div>`);
  document.getElementById("close-modal").onclick = () => { ui.modal = null; render(); };
  document.querySelectorAll("[data-select-target]").forEach(button => {
    button.onclick = () => {
      const targetMemberId = button.dataset.selectTarget;
      ui.modal = null;
      if (modal.kind === "target-card") sendGameAction("PLAY_CARD", { cardUid: modal.cardUid, targetMemberId });
      else sendGameAction("ACTIVATE_CHARACTER", { characterId: modal.characterId, abilityId: modal.abilityId, targetMemberId });
    };
  });
  document.querySelectorAll("[data-motion-points]").forEach(button => {
    button.onclick = () => {
      ui.modal = null;
      sendGameAction("ACTIVATE_CHARACTER", {
        characterId: modal.characterId,
        abilityId: modal.abilityId,
        abstractPoints: Number(button.dataset.motionPoints)
      });
    };
  });
  document.querySelectorAll("[data-toggle-dimension]").forEach(button => {
    button.onclick = () => {
      const dimension = button.dataset.toggleDimension;
      modal.selected = modal.selected.includes(dimension)
        ? modal.selected.filter(item => item !== dimension)
        : modal.selected.length < 3 ? [...modal.selected, dimension] : modal.selected;
      render();
    };
  });
  document.querySelectorAll("[data-toggle-target]").forEach(button => {
    button.onclick = () => {
      const targetId = button.dataset.toggleTarget;
      modal.selected = modal.selected.includes(targetId)
        ? modal.selected.filter(item => item !== targetId)
        : modal.selected.length < 2 ? [...modal.selected, targetId] : modal.selected;
      render();
    };
  });
  document.getElementById("confirm-modal")?.addEventListener("click", () => {
    ui.modal = null;
    if (modal.kind === "three-dimensions") {
      sendGameAction("ACTIVATE_CHARACTER", {
        characterId: modal.characterId,
        abilityId: modal.abilityId,
        dimensions: modal.selected
      });
    } else {
      sendGameAction("ACTIVATE_CHARACTER", {
        characterId: modal.characterId,
        abilityId: modal.abilityId,
        targetMemberIds: modal.selected
      });
    }
  });
  document.querySelectorAll("[data-review-target]").forEach(button => {
    button.onclick = () => {
      ui.modal = null;
      sendGameAction("REVIEW_VOTE", {
        targetMemberId: button.dataset.reviewTarget,
        vote: button.dataset.vote
      });
    };
  });
}

}

    <h4>事件牌</h4>
    <div class="modal-desc">${EVENT_CARDS.map(card => `<p><strong>${escapeHtml(card.name)}</strong>：${escapeHtml(card.description)}</p>`).join("")}</div>
    <h4>技能牌</h4>
    <div class="modal-desc">${SKILL_CARDS.map(card => `<p><strong>${escapeHtml(card.name)}</strong>：${escapeHtml(card.description)}</p>`).join("")}</div>

<script>
(function loadOptionalLibraries() {
  const lucideScript = document.createElement("script");
  lucideScript.src = "https://cdn.jsdelivr.net/npm/lucide@0.468.0/dist/umd/lucide.min.js";
  lucideScript.onload = function () { if (typeof initIcons === "function") initIcons(); };
  document.head.appendChild(lucideScript);

  const sources = [
    "./peerjs.min.js",
    "https://cdn.jsdelivr.net/npm/peerjs@1.5.4/dist/peerjs.min.js",
    "https://cdn.bootcdn.net/ajax/libs/peerjs/1.5.4/peerjs.min.js",
    "https://cdnjs.cloudflare.com/ajax/libs/peerjs/1.5.4/peerjs.min.js"
  ];
  let index = 0;
  function next() {
    if (typeof window.Peer !== "undefined") {
      window.dispatchEvent(new Event("peerjs-ready"));
      return;
    }
    if (index >= sources.length) {
      window.__peerjsFailed = true;
      window.dispatchEvent(new Event("peerjs-failed"));
      return;
    }
    const script = document.createElement("script");
    script.src = sources[index++];
    script.onload = next;
    script.onerror = next;
    document.head.appendChild(script);
  }
  next();
})();

function waitForPeerJS(timeout = 16000) {
  if (typeof window.Peer !== "undefined") return Promise.resolve();
  return new Promise((resolve, reject) => {
    const timer = setTimeout(() => {
      cleanup();
      reject(new Error("PeerJS 加载超时"));
    }, timeout);
    const ready = () => { cleanup(); resolve(); };
    const failed = () => { cleanup(); reject(new Error("PeerJS 库加载失败")); };
    const cleanup = () => {
      clearTimeout(timer);
      window.removeEventListener("peerjs-ready", ready);
      window.removeEventListener("peerjs-failed", failed);
    };
    window.addEventListener("peerjs-ready", ready, { once: true });
    window.addEventListener("peerjs-failed", failed, { once: true });
  });
}

class PeerTransport {
  constructor(roomCode) {
    this.roomCode = roomCode;
    this.peer = null;
    this.myPeerId = "";
    this.isHost = false;
    this.hostConnection = null;
    this.connections = new Map();
    this.onMessage = null;
    this.onPeerLeft = null;
    this.onHostLost = null;
    this.closed = false;
  }

  peerOptions() {
    return {
      debug: 0,
      config: {
        iceServers: [
          { urls: "stun:stun.l.google.com:19302" },
          { urls: "stun:stun1.l.google.com:19302" },
          { urls: "stun:stun2.l.google.com:19302" },
          { urls: "stun:stun.miwifi.com:3478" },
          { urls: "stun:stun.chat.bilibili.com:3478" }
        ]
      }
    };
  }

  hostPeerId() {
    return `puishi-v100-${this.roomCode}-host`;
  }

  async startHost() {
    await waitForPeerJS();
    this.isHost = true;
    this.myPeerId = this.hostPeerId();
    this.peer = new Peer(this.myPeerId, this.peerOptions());
    const pendingConnections = [];
    let connectionHandler = null;
    this.peer.on("connection", connection => {
      if (connectionHandler) connectionHandler(connection);
      else pendingConnections.push(connection);
    });
    await this.waitForPeerOpen();
    connectionHandler = connection => this.attachConnection(connection);
    pendingConnections.splice(0).forEach(connectionHandler);
  }

  async startClient() {
    await waitForPeerJS();
    this.isHost = false;
    this.myPeerId = `puishi-v100-client-${cryptoRandom(10)}`;
    this.peer = new Peer(this.myPeerId, this.peerOptions());
    await this.waitForPeerOpen();
    const connection = this.peer.connect(this.hostPeerId(), { reliable: true, serialization: "json" });
    this.hostConnection = connection;
    this.attachConnection(connection);
    await this.waitForConnectionOpen(connection);
  }

  waitForPeerOpen() {
    return new Promise((resolve, reject) => {
      const timer = setTimeout(() => reject(new Error("PeerJS 连接超时")), 20000);
      this.peer.once("open", () => { clearTimeout(timer); resolve(); });
      this.peer.once("error", error => { clearTimeout(timer); reject(error); });
    });
  }

  waitForConnectionOpen(connection) {
    return new Promise((resolve, reject) => {
      if (connection.open) return resolve();
      const timer = setTimeout(() => reject(new Error("房间连接超时")), 16000);
      connection.once("open", () => { clearTimeout(timer); resolve(); });
      connection.once("error", error => { clearTimeout(timer); reject(error); });
    });
  }

  attachConnection(connection) {
    if (!this.connections.has(connection.peer)) {
      this.connections.set(connection.peer, { connection, playerId: null, name: "" });
    }
    connection.on("data", data => {
      let message = data;
      if (typeof data === "string") {
        try { message = JSON.parse(data); } catch (_) { return; }
      }
      const record = this.connections.get(connection.peer);
      if (message?.type === "JOIN" && record) {
        record.playerId = message.playerId;
        record.name = message.name;
      }
      this.onMessage?.(message, { peerId: connection.peer, playerId: record?.playerId || message?.playerId || null });
    });
    connection.on("close", () => {
      const record = this.connections.get(connection.peer);
      this.connections.delete(connection.peer);
      if (this.closed) return;
      if (this.isHost) this.onPeerLeft?.({ peerId: connection.peer, playerId: record?.playerId || null });
      else this.onHostLost?.();
    });
    connection.on("error", () => {});
  }

  bindPlayer(peerId, playerId, name) {
    const record = this.connections.get(peerId);
    if (!record) return;
    record.playerId = playerId;
    record.name = name;
  }

  send(connection, message) {
    if (!connection?.open) return false;
    try {
      connection.send(message);
      return true;
    } catch (_) {
      return false;
    }
  }

  sendToHost(message) {
    return this.send(this.hostConnection, message);
  }

  sendToPlayer(playerId, message) {
    for (const record of this.connections.values()) {
      if (record.playerId === playerId) return this.send(record.connection, message);
    }
    return false;
  }

  broadcast(message) {
    for (const record of this.connections.values()) this.send(record.connection, message);
  }

  close() {
    this.closed = true;
    for (const record of this.connections.values()) {
      try { record.connection.close(); } catch (_) {}
    }
    this.connections.clear();
    if (this.peer) {
      try { this.peer.destroy(); } catch (_) {}
    }
    this.peer = null;
    this.hostConnection = null;
  }
}
</script>
