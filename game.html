const app = document.getElementById("app");
const identityKey = "puishi-card-player-id-v1";
const savedId = sessionStorage.getItem(identityKey);
const playerId = savedId || ("p_" + cryptoRandom(10));
sessionStorage.setItem(identityKey, playerId);

const ui = {
  screen: "entry",
  busy: false,
  message: "",
  messageError: false,
  modal: null,
  toast: "",
  toastTimer: null,
  rulesOpen: false,
  pendingRequest: false,
  joinResolver: null,
  countdownStartTimer: null,
  countdownPaintTimer: null,
  migrationTimer: null,
  hostLostAt: 0,
  authorityBackup: null
};

const room = {
  connected: false,
  code: "",
  myId: playerId,
  myName: "",
  hostId: "",
  isHost: false,
  lifecycle: ROOM_STATE.WAITING,
  settings: { totalRounds: 10, maxPlayers: 8 },
  members: [],
  countdownEndsAt: 0,
  transport: null
};

let game = null;

function cryptoRandom(length) {
  const alphabet = "ABCDEFGHJKLMNPQRSTUVWXYZ23456789";
  const bytes = new Uint8Array(length);
  if (window.crypto && window.crypto.getRandomValues) window.crypto.getRandomValues(bytes);
  else for (let i = 0; i < length; i++) bytes[i] = Math.floor(Math.random() * 256);
  return Array.from(bytes, value => alphabet[value % alphabet.length]).join("");
}

function icon(name, size = 16) {
  return `<i data-lucide="${name}" style="width:${size}px;height:${size}px" aria-hidden="true"></i>`;
}

function initIcons() {
  if (window.lucide) window.lucide.createIcons({ attrs: { "stroke-width": 1.8 } });
}

function escapeHtml(value) {
  return String(value ?? "").replace(/[&<>"']/g, char => ({
    "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#039;"
  })[char]);
}

function clone(value) {
  return value == null ? value : JSON.parse(JSON.stringify(value));
}

function shuffle(items) {
  for (let i = items.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [items[i], items[j]] = [items[j], items[i]];
  }
  return items;
}

function totalScore(player) {
  return DIMENSIONS.reduce((sum, dim) => sum + player.scores[dim], 0) + player.reputation;
}

function roomPlayers() {
  return room.members.filter(member => !member.spectator);
}

function myMember() {
  return room.members.find(member => member.id === room.myId) || null;
}

function myGamePlayer() {
  return game?.players.find(player => player.memberId === room.myId) || null;
}

function currentPlayer() {
  return game?.players[game.currentPlayerIndex] || null;
}

function isMyTurn() {
  return Boolean(game && currentPlayer()?.memberId === room.myId && game.phase !== GAME_PHASE.SETTLEMENT);
}

function isSpectator() {
  return Boolean(myMember()?.spectator || (game && !myGamePlayer()));
}

function setMessage(text, error = false) {
  ui.message = text;
  ui.messageError = error;
  render();
}

function showToast(text) {
  ui.toast = text;
  clearTimeout(ui.toastTimer);
  ui.toastTimer = setTimeout(() => {
    ui.toast = "";
    render();
  }, 2400);
}

function appendLog(text, type = "normal") {
  if (!game) return;
  game.log.push({ round: game.round || 0, text, type });
  if (game.log.length > 120) game.log.shift();
}

function createDeck() {
  const deck = [];
  SKILL_CARDS.forEach(card => {
    for (let i = 0; i < card.copies; i++) {
      deck.push({ type: "skill", cardId: card.id, uid: `s_${cryptoRandom(8)}` });
    }
  });
  EVENT_CARDS.forEach(card => {
    for (let i = 0; i < card.copies; i++) {
      deck.push({ type: "event", cardId: card.id, uid: `e_${cryptoRandom(8)}` });
    }
  });
  return shuffle(deck);
}

function createGameState(members, totalRounds) {
  const activeMembers = members.filter(member => !member.spectator && member.connected);
  return {
    version: VERSION,
    phase: GAME_PHASE.DRAFT,
    totalRounds,
    round: 0,
    currentPlayerIndex: 0,
    draftDone: [],
    turn: {
      hasDrawn: false,
      skillCardsPlayed: 0,
      characterSkillUsed: false,
      usedCharacterIds: [],
      number: 0
    },
    players: activeMembers.map(member => ({
      memberId: member.id,
      name: member.name,
      hand: [],
      handCount: 0,
      characters: [],
      funds: 12,
      scores: { selection: 0, config: 0, abstract: 0, concrete: 0, innovation: 0 },
      reputation: 0,
      disableSkillTurns: 0,
      extraTurns: 0,
      firstRoundSkillUsed: false,
      connected: true,
      disconnectedAt: 0,
      aiControlled: false
    })),
    deck: createDeck(),
    discard: [],
    log: [],
    ranking: [],
    sequence: 0,
    createdAt: Date.now()
  };
}

function characterDefinition(id) {
  return CHARACTERS.find(character => character.id === id);
}

function skillDefinition(id) {
  return SKILL_CARDS.find(card => card.id === id);
}

function eventDefinition(id) {
  return EVENT_CARDS.find(card => card.id === id);
}

function refillDeckIfNeeded() {
  if (game.deck.length || !game.discard.length) return;
  game.deck = shuffle(game.discard.splice(0));
  appendLog("抽牌堆已空，弃牌堆重新洗入抽牌堆。", "event");
}

function changeScore(player, dimension, amount) {
  player.scores[dimension] += amount;
}

function resolveEvent(playerIndex, card) {
  const player = game.players[playerIndex];
  const event = eventDefinition(card.cardId);
  if (!player || !event) return;
  if (event.id === "trending") {
    const dimension = DIMENSIONS[Math.floor(Math.random() * DIMENSIONS.length)];
    const amount = Math.random() < .5 ? -2 : 2;
    changeScore(player, dimension, amount);
    appendLog(`${player.name} 触发「${event.name}」：${DIMENSION_LABELS[dimension]}${amount > 0 ? "+" : ""}${amount}。`, "event");
  } else if (event.id === "editor") {
    const minValue = Math.min(...DIMENSIONS.map(dim => player.scores[dim]));
    const candidates = DIMENSIONS.filter(dim => player.scores[dim] === minValue);
    const dimension = candidates[Math.floor(Math.random() * candidates.length)];
    changeScore(player, dimension, 3);
    appendLog(`${player.name} 触发「${event.name}」：最低项${DIMENSION_LABELS[dimension]}+3。`, "event");
  } else if (event.id === "mute-wave") {
    player.disableSkillTurns = Math.max(player.disableSkillTurns, 1);
    appendLog(`${player.name} 触发「${event.name}」：本回合角色技能被禁用。`, "event");
  } else if (event.id === "deadline") {
    const maxValue = Math.max(...DIMENSIONS.map(dim => player.scores[dim]));
    const candidates = DIMENSIONS.filter(dim => player.scores[dim] === maxValue);
    const dimension = candidates[Math.floor(Math.random() * candidates.length)];
    changeScore(player, dimension, -2);
    appendLog(`${player.name} 触发「${event.name}」：最高项${DIMENSION_LABELS[dimension]}-2。`, "event");
  } else if (event.id === "meeting") {
    DIMENSIONS.forEach(dim => changeScore(player, dim, 1));
    appendLog(`${player.name} 触发「${event.name}」：五维数据全部+1。`, "event");
  }
  game.deck.push(card);
  shuffle(game.deck);
}

function drawCard(playerIndex) {
  refillDeckIfNeeded();
  const player = game.players[playerIndex];
  const card = game.deck.pop();
  if (!player || !card) {
    appendLog("牌堆和弃牌堆均为空，本次未摸到牌。", "event");
    return { kind: "empty" };
  }
  if (card.type === "event") {
    const event = eventDefinition(card.cardId);
    resolveEvent(playerIndex, card);
    return { kind: "event", name: event?.name || "事件牌" };
  }
  player.hand.push(card);
  player.handCount = player.hand.length;
  const skill = skillDefinition(card.cardId);
  appendLog(`${player.name} 摸到技能牌「${skill.name}」。`);
  return { kind: "skill", name: skill.name };
}

function beginTurn() {
  const player = currentPlayer();
  if (!player) return;
  player.characters.forEach(character => {
    if (character.cooldownLeft > 0) character.cooldownLeft--;
  });
  game.turn = {
    hasDrawn: false,
    skillCardsPlayed: 0,
    characterSkillUsed: false,
    usedCharacterIds: [],
    number: game.turn.number + 1
  };
  appendLog(`轮到 ${player.name} 行动。`);
  scheduleAIIfNeeded();
}

function buyCharacter(playerIndex, characterId) {
  const player = game.players[playerIndex];
  const character = characterDefinition(characterId);
  if (!character) return fail("角色不存在");
  if (player.characters.some(item => item.id === characterId)) return fail("不能重复购置同一角色");
  const price = RARITY[character.rarity].price;
  if (player.funds < price) return fail("购置点数不足");
  player.funds -= price;
  player.characters.push({ id: character.id, cooldownLeft: 0, permanentlyDisabled: false });
  appendLog(`${player.name} 购置了「${character.name}」，剩余${player.funds}点。`, "effect");
  return ok();
}

function finishDraft(playerIndex) {
  const player = game.players[playerIndex];
  if (!player.characters.length) return fail("至少购置1名角色后才能完成购置");
  if (game.draftDone.includes(player.memberId)) return fail("你已完成购置");
  game.draftDone.push(player.memberId);
  appendLog(`${player.name} 完成角色购置。`);
  if (game.draftDone.length === game.players.length) {
    game.phase = GAME_PHASE.TURN;
    game.round = 1;
    game.currentPlayerIndex = 0;
    appendLog("购置阶段结束。第1轮开始，每位玩家必须发动1次角色技能。", "event");
    beginTurn();
  } else {
    game.currentPlayerIndex = (game.currentPlayerIndex + 1) % game.players.length;
  }
  return ok();
}

function canActivateCharacter(player, instance) {
  if (!game.turn.hasDrawn) return fail("请先摸牌");
  if (instance.permanentlyDisabled) return fail("该角色技能已永久失效");
  if (game.turn.usedCharacterIds.includes(instance.id)) return fail("该角色本回合已经发动过技能");
  const firstRoundOverride = game.round === 1 && !player.firstRoundSkillUsed;
  if (!firstRoundOverride && player.disableSkillTurns > 0) return fail("本回合角色技能被禁用");
  if (instance.cooldownLeft > 0) return fail(`技能冷却剩余${instance.cooldownLeft}回合`);
  return ok();
}

function activateCharacter(playerIndex, characterId, payload = {}) {
  const player = game.players[playerIndex];
  const instance = player.characters.find(character => character.id === characterId);
  const definition = characterDefinition(characterId);
  if (!instance || !definition) return fail("未拥有该角色");
  const allowed = canActivateCharacter(player, instance);
  if (!allowed.ok) return allowed;
  if (definition.id === "sulfur" && !["abstract", "concrete"].includes(payload.dimension)) {
    return fail("请选择动效维度");
  }

  if (game.round === 1 && !player.firstRoundSkillUsed) {
    player.scores.selection = definition.selection;
    player.firstRoundSkillUsed = true;
    appendLog(`${player.name} 以「${definition.name}」确定初始选曲品味为${definition.selection}。`, "effect");
  }

  if (definition.id === "ftayo") {
    let chosen = DIMENSIONS[0];
    DIMENSIONS.forEach(dim => {
      if (player.scores[dim] < player.scores[chosen]) chosen = dim;
    });
    const highest = Math.max(...game.players.map(target => target.scores[chosen]));
    player.scores[chosen] = highest;
    appendLog(`${player.name} 发动「升格」：${DIMENSION_LABELS[chosen]}提升至${highest}。`, "effect");
  } else if (definition.id === "summercube") {
    player.scores.config--;
    player.scores.concrete += 5;
    appendLog(`${player.name} 发动「配置转具象」：配置-1，具象+5。`, "effect");
  } else if (definition.id === "sulfur") {
    player.scores[payload.dimension] += 4;
    appendLog(`${player.name} 发动「动效分配」：${DIMENSION_LABELS[payload.dimension]}+4。`, "effect");
  } else if (definition.id === "jinye") {
    const amount = Math.random() < .2 ? -2 : 4;
    player.scores.abstract += amount;
    appendLog(`${player.name} 发动「Testify」：抽象动效${amount > 0 ? "+" : ""}${amount}。`, "effect");
  } else if (definition.id === "ruishi") {
    const highest = Math.max(...DIMENSIONS.map(dim => player.scores[dim]));
    player.scores.config = Math.max(player.scores.config, highest);
    player.scores.abstract = Math.max(player.scores.abstract, highest);
    appendLog(`${player.name} 发动「补短板」：配置和抽象提升至${highest}。`, "effect");
  } else if (definition.id === "air") {
    player.scores.innovation += 3;
    player.reputation += 1;
    appendLog(`${player.name} 发动「新鲜空气」：创新+3，声望+1。`, "effect");
  } else if (definition.id === "kuro") {
    player.scores.config += 2;
    player.scores.concrete += 1;
    appendLog(`${player.name} 发动「精细校准」：配置+2，具象+1。`, "effect");
  } else if (definition.id === "dagezi") {
    const lowest = Math.min(...DIMENSIONS.map(dim => player.scores[dim]));
    DIMENSIONS.forEach(dim => { player.scores[dim] = lowest; });
    player.reputation += 2;
    appendLog(`${player.name} 发动「评议之灵」：五维归至${lowest}，声望+2。`, "effect");
  }
  instance.cooldownLeft = definition.cooldown;
  game.turn.characterSkillUsed = true;
  game.turn.usedCharacterIds.push(instance.id);
  return ok();
}

function executeSkillCard(playerIndex, cardUid, payload = {}) {
  const player = game.players[playerIndex];
  const cardIndex = player.hand.findIndex(card => card.uid === cardUid);
  if (cardIndex < 0) return fail("手牌不存在");
  const card = player.hand[cardIndex];
  const definition = skillDefinition(card.cardId);
  const ownTurn = game.currentPlayerIndex === playerIndex;
  if (!definition) return fail("卡牌数据不存在");
  if (definition.timing === "turn" && !ownTurn) return fail("该牌只能在自己的回合打出");
  if (definition.timing === "response" && ownTurn) return fail("该牌只能在他人回合响应");
  if (ownTurn && !game.turn.hasDrawn) return fail("请先摸牌");
  if (ownTurn && game.turn.skillCardsPlayed >= 3) return fail("每回合最多打出3张技能牌");

  let target = null;
  if (definition.target === "opponent" || definition.target === "any") {
    target = game.players.find(candidate => candidate.memberId === payload.targetMemberId);
    if (!target) return fail("目标不存在");
    if (definition.target === "opponent" && target.memberId === player.memberId) return fail("必须选择对手");
  }
  if (definition.target === "motion" && !["abstract", "concrete"].includes(payload.dimension)) {
    return fail("请选择动效维度");
  }

  if (definition.id === "polish") player.scores.config += 3;
  if (definition.id === "inspire") player.scores.innovation += 3;
  if (definition.id === "motion") player.scores[payload.dimension] += 2;
  if (definition.id === "critique") target.scores.selection -= 2;
  if (definition.id === "mute") target.disableSkillTurns = Math.max(target.disableSkillTurns, 1);
  if (definition.id === "reputation") target.reputation += 2;
  if (definition.id === "quickfix") player.scores.config += 1;
  if (definition.id === "overtime") {
    player.scores.innovation += 1;
    player.extraTurns += 1;
  }

  const effectText = {
    polish: "配置水平+3",
    inspire: "创新程度+3",
    motion: `${DIMENSION_LABELS[payload.dimension]}+2`,
    critique: `${target?.name}的选曲品味-2`,
    mute: `${target?.name}下回合禁用角色技能`,
    reputation: `${target?.name}声望+2`,
    quickfix: "配置水平+1",
    overtime: "创新程度+1并获得额外回合"
  }[definition.id];
  appendLog(`${player.name} 打出「${definition.name}」：${effectText}。`, "effect");
  player.hand.splice(cardIndex, 1);
  player.handCount = player.hand.length;
  game.discard.push(card);
  if (ownTurn) game.turn.skillCardsPlayed++;
  return ok();
}

function endTurn(playerIndex) {
  const player = game.players[playerIndex];
  if (!game.turn.hasDrawn) return fail("必须先完成摸牌");
  if (game.round === 1 && !player.firstRoundSkillUsed) {
    return fail("第1轮必须发动至少1次角色技能");
  }
  if (player.disableSkillTurns > 0) player.disableSkillTurns--;
  if (player.extraTurns > 0) {
    player.extraTurns--;
    appendLog(`${player.name} 开始额外回合。`, "effect");
    beginTurn();
    return ok();
  }
  game.currentPlayerIndex++;
  if (game.currentPlayerIndex >= game.players.length) {
    game.currentPlayerIndex = 0;
    game.round++;
    if (game.round > game.totalRounds) {
      settleGame();
      return ok();
    }
    appendLog(`第${game.round}轮开始。`, "event");
  }
  beginTurn();
  return ok();
}

function settleGame() {
  game.phase = GAME_PHASE.SETTLEMENT;
  game.ranking = game.players
    .map(player => ({ memberId: player.memberId, name: player.name, score: totalScore(player), scores: clone(player.scores), reputation: player.reputation }))
    .sort((a, b) => b.score - a.score);
  room.lifecycle = ROOM_STATE.SETTLEMENT;
  appendLog("全部回合结束，进入结算。", "event");
}

function ok(extra = {}) { return { ok: true, ...extra }; }
function fail(reason) { return { ok: false, reason }; }

function validateActor(memberId) {
  const index = game?.players.findIndex(player => player.memberId === memberId) ?? -1;
  if (index < 0) return { index, error: fail("观战者不能操作") };
  return { index, error: null };
}

function hostDispatch(memberId, action, payload = {}) {
  if (!room.isHost || !game || room.lifecycle !== ROOM_STATE.PLAYING) return fail("游戏当前不可操作");
  const actor = validateActor(memberId);
  if (actor.error) return actor.error;
  const playerIndex = actor.index;
  const ownTurn = game.currentPlayerIndex === playerIndex;
  let result = fail("未知操作");

  if (action === "DRAFT_BUY") {
    if (game.phase !== GAME_PHASE.DRAFT || !ownTurn) return fail("还没轮到你购置");
    result = buyCharacter(playerIndex, payload.characterId);
  } else if (action === "DRAFT_DONE") {
    if (game.phase !== GAME_PHASE.DRAFT || !ownTurn) return fail("还没轮到你购置");
    result = finishDraft(playerIndex);
  } else if (action === "DRAW") {
    if (game.phase !== GAME_PHASE.TURN || !ownTurn) return fail("现在不能摸牌");
    if (game.turn.hasDrawn) return fail("本回合已经摸过牌");
    game.turn.hasDrawn = true;
    result = ok({ draw: drawCard(playerIndex) });
  } else if (action === "PLAY_CARD") {
    if (game.phase !== GAME_PHASE.TURN) return fail("现在不能打出技能牌");
    result = executeSkillCard(playerIndex, payload.cardUid, payload);
  } else if (action === "ACTIVATE_CHARACTER") {
    if (game.phase !== GAME_PHASE.TURN || !ownTurn) return fail("只能在自己的回合发动角色技能");
    result = activateCharacter(playerIndex, payload.characterId, payload);
  } else if (action === "END_TURN") {
    if (game.phase !== GAME_PHASE.TURN || !ownTurn) return fail("现在不能结束回合");
    result = endTurn(playerIndex);
  }

  if (result.ok) {
    game.sequence++;
    syncAll();
  }
  return result;
}

function publicGameFor(memberId) {
  if (!game) return null;
  const publicGame = clone(game);
  publicGame.players.forEach(player => {
    player.handCount = player.hand.length;
    if (player.memberId !== memberId) player.hand = [];
  });
  return publicGame;
}

function publicRoom() {
  return {
    code: room.code,
    hostId: room.hostId,
    lifecycle: room.lifecycle,
    settings: clone(room.settings),
    members: clone(room.members),
    countdownEndsAt: room.countdownEndsAt
  };
}

function applyRoomSnapshot(snapshot) {
  if (!snapshot) return;
  room.code = snapshot.code;
  room.hostId = snapshot.hostId;
  room.isHost = room.myId === snapshot.hostId;
  room.lifecycle = snapshot.lifecycle;
  room.settings = snapshot.settings;
  room.members = snapshot.members;
  room.countdownEndsAt = snapshot.countdownEndsAt || 0;
  room.connected = true;
  ui.hostLostAt = 0;
  ui.message = "";
  ui.messageError = false;
  ui.screen = room.lifecycle === ROOM_STATE.WAITING || room.lifecycle === ROOM_STATE.COUNTDOWN ? "lobby" : "game";
}

function syncAll() {
  if (!room.isHost) {
    render();
    return;
  }
  room.members.forEach(member => {
    if (member.id === room.myId || !member.connected) return;
    room.transport?.sendToPlayer(member.id, {
      type: "SYNC",
      room: publicRoom(),
      game: publicGameFor(member.id),
      authorityBackup: game
    });
  });
  render();
}

function sendWelcome(memberId) {
  room.transport?.sendToPlayer(memberId, {
    type: "WELCOME",
    room: publicRoom(),
    game: publicGameFor(memberId),
    authorityBackup: game
  });
}

function broadcastLobby() {
  if (!room.isHost) return;
  room.transport?.broadcast({ type: "ROOM_SYNC", room: publicRoom() });
  render();
}

function handleJoin(message, meta) {
  if (!room.isHost || message.roomCode !== room.code) return;
  const safeName = String(message.name || "玩家").trim().slice(0, 16) || "玩家";
  room.transport.bindPlayer(meta.peerId, message.playerId, safeName);
  let member = room.members.find(item => item.id === message.playerId);
  if (member) {
    member.connected = true;
    member.disconnectedAt = 0;
    member.name = safeName;
    member.peerId = meta.peerId;
  } else {
    const activeCount = room.members.filter(item => !item.spectator).length;
    const spectator = room.lifecycle === ROOM_STATE.PLAYING ||
      room.lifecycle === ROOM_STATE.SETTLEMENT ||
      activeCount >= room.settings.maxPlayers;
    member = {
      id: message.playerId,
      name: safeName,
      isHost: false,
      ready: false,
      connected: true,
      spectator,
      peerId: meta.peerId
    };
    room.members.push(member);
    if (room.lifecycle === ROOM_STATE.COUNTDOWN) cancelCountdown("有新玩家加入，倒计时已取消。");
  }
  if (game) {
    const player = game.players.find(item => item.memberId === member.id);
    if (player) {
      player.connected = true;
      player.disconnectedAt = 0;
      player.aiControlled = false;
      member.spectator = false;
    }
  }
  sendWelcome(member.id);
  if (room.lifecycle === ROOM_STATE.WAITING || room.lifecycle === ROOM_STATE.COUNTDOWN) broadcastLobby();
  else syncAll();
}

function handleNetworkMessage(message, meta = {}) {
  if (!message || !message.type) return;
  if (message.type === "JOIN") {
    handleJoin(message, meta);
    return;
  }
  if (message.type === "WELCOME") {
    applyRoomSnapshot(message.room);
    game = message.game;
    ui.authorityBackup = message.authorityBackup;
    if (ui.joinResolver) {
      ui.joinResolver(ok());
      ui.joinResolver = null;
    }
    render();
    return;
  }
  if (message.type === "REJECT") {
    if (ui.joinResolver) {
      ui.joinResolver(fail(message.reason || "无法加入房间"));
      ui.joinResolver = null;
    }
    return;
  }
  if (message.type === "ROOM_SYNC") {
    applyRoomSnapshot(message.room);
    render();
    return;
  }
  if (message.type === "SYNC") {
    applyRoomSnapshot(message.room);
    game = message.game;
    ui.authorityBackup = message.authorityBackup;
    ui.pendingRequest = false;
    render();
    return;
  }
  if (message.type === "ROOM_ACTION" && room.isHost) {
    handleRoomAction(meta.playerId, message.action, message.payload || {});
    return;
  }
  if (message.type === "GAME_ACTION" && room.isHost) {
    const result = hostDispatch(meta.playerId, message.action, message.payload || {});
    if (!result.ok) room.transport.sendToPlayer(meta.playerId, { type: "ACTION_ERROR", reason: result.reason });
    else if (result.draw?.kind === "event") room.transport.sendToPlayer(meta.playerId, { type: "DRAW_NOTICE", text: `摸到事件牌「${result.draw.name}」，已立即结算。` });
    return;
  }
  if (message.type === "ACTION_ERROR") {
    ui.pendingRequest = false;
    showToast(message.reason || "操作失败");
    render();
    return;
  }
  if (message.type === "DRAW_NOTICE") {
    showToast(message.text);
    return;
  }
  if (message.type === "HOST_MOVING") {
    scheduleGracefulMigration(message.nextHostId);
    return;
  }
  if (message.type === "PROMOTE") {
    promoteToHost(message.room, message.gameBackup);
  }
}

function handleRoomAction(memberId, action, payload) {
  if (!room.isHost) return;
  const member = room.members.find(item => item.id === memberId);
  if (!member) return;
  if (action === "TOGGLE_READY" && room.lifecycle === ROOM_STATE.WAITING && !member.spectator) {
    member.ready = !member.ready;
    broadcastLobby();
  } else if (action === "UPDATE_ROUNDS" && memberId === room.hostId && room.lifecycle === ROOM_STATE.WAITING) {
    const rounds = Number(payload.totalRounds);
    if ([6, 8, 10, 12, 15].includes(rounds)) {
      room.settings.totalRounds = rounds;
      broadcastLobby();
    }
  } else if (action === "START" && memberId === room.hostId) {
    startCountdown();
  } else if (action === "BACK_TO_LOBBY" && memberId === room.hostId && room.lifecycle === ROOM_STATE.SETTLEMENT) {
    resetToLobby();
  } else if (action === "LEAVE") {
    markMemberDisconnected(memberId, true);
  }
}

function sendRoomAction(action, payload = {}) {
  if (room.isHost) handleRoomAction(room.myId, action, payload);
  else room.transport?.sendToHost({ type: "ROOM_ACTION", action, payload });
}

function sendGameAction(action, payload = {}) {
  if (ui.pendingRequest) return;
  if (room.isHost) {
    const result = hostDispatch(room.myId, action, payload);
    if (!result.ok) showToast(result.reason);
    else if (result.draw?.kind === "event") showToast(`摸到事件牌「${result.draw.name}」，已立即结算。`);
    render();
    return;
  }
  ui.pendingRequest = true;
  room.transport?.sendToHost({ type: "GAME_ACTION", action, payload });
  render();
}

function startCountdown() {
  const players = roomPlayers();
  if (room.lifecycle !== ROOM_STATE.WAITING) return;
  if (players.length < 2) return showToast("至少需要2名玩家");
  if (players.some(member => !member.connected)) return showToast("存在掉线玩家");
  if (players.some(member => member.id !== room.hostId && !member.ready)) return showToast("仍有玩家未准备");
  room.lifecycle = ROOM_STATE.COUNTDOWN;
  room.countdownEndsAt = Date.now() + 3000;
  broadcastLobby();
  clearTimeout(ui.countdownStartTimer);
  ui.countdownStartTimer = setTimeout(() => {
    if (room.lifecycle !== ROOM_STATE.COUNTDOWN) return;
    const currentPlayers = roomPlayers();
    if (currentPlayers.length < 2 || currentPlayers.some(member => !member.connected)) {
      cancelCountdown("人数不足，倒计时已取消。");
      return;
    }
    game = createGameState(currentPlayers, room.settings.totalRounds);
    room.lifecycle = ROOM_STATE.PLAYING;
    room.countdownEndsAt = 0;
    appendLog(`游戏开始，共${game.totalRounds}轮。每位玩家拥有12点购置点数。`, "event");
    syncAll();
  }, 3050);
}

function cancelCountdown(reason = "") {
  clearTimeout(ui.countdownStartTimer);
  clearTimeout(ui.countdownPaintTimer);
  room.lifecycle = ROOM_STATE.WAITING;
  room.countdownEndsAt = 0;
  if (reason) ui.message = reason;
  broadcastLobby();
}

function resetToLobby() {
  game = null;
  room.lifecycle = ROOM_STATE.WAITING;
  room.countdownEndsAt = 0;
  const connected = room.members
    .filter(member => member.connected)
    .sort((a, b) => Number(b.id === room.hostId) - Number(a.id === room.hostId));
  room.members = connected.map((member, index) => ({
    ...member,
    spectator: index >= room.settings.maxPlayers,
    ready: member.id === room.hostId
  }));
  broadcastLobby();
}

function markMemberDisconnected(memberId, voluntary = false) {
  const member = room.members.find(item => item.id === memberId);
  if (!member || member.id === room.hostId) return;
  if (voluntary && (room.lifecycle === ROOM_STATE.WAITING || member.spectator)) {
    room.members = room.members.filter(item => item.id !== memberId);
    if (game) syncAll();
    else broadcastLobby();
    return;
  }
  member.connected = false;
  member.ready = false;
  member.disconnectedAt = Date.now();
  const player = game?.players.find(item => item.memberId === memberId);
  if (player) {
    player.connected = false;
    player.disconnectedAt = Date.now();
  }
  if (room.lifecycle === ROOM_STATE.COUNTDOWN) cancelCountdown("玩家离开，倒计时已取消。");
  else if (game) syncAll();
  else broadcastLobby();
  if (player) {
    setTimeout(() => {
      const current = game?.players.find(item => item.memberId === memberId);
      if (!current || current.connected) return;
      current.aiControlled = true;
      appendLog(`${current.name} 断线超过90秒，已转为自动托管。`, "event");
      scheduleAIIfNeeded();
      syncAll();
    }, 90000);
  }
}

function scheduleAIIfNeeded() {
  if (!room.isHost || !game || game.phase !== GAME_PHASE.TURN) return;
  const player = currentPlayer();
  if (!player?.aiControlled) return;
  setTimeout(() => {
    if (!room.isHost || currentPlayer()?.memberId !== player.memberId) return;
    if (!game.turn.hasDrawn) {
      game.turn.hasDrawn = true;
      drawCard(game.currentPlayerIndex);
    }
    if (game.round === 1 && !player.firstRoundSkillUsed && player.characters[0]) {
      activateCharacter(game.currentPlayerIndex, player.characters[0].id, { dimension: "abstract" });
    }
    endTurn(game.currentPlayerIndex);
    game.sequence++;
    syncAll();
  }, 900);
}

async function createRoom(name) {
  ui.busy = true;
  ui.message = "正在创建跨网络房间...";
  ui.messageError = false;
  render();
  const code = cryptoRandom(5);
  try {
    const transport = new PeerTransport(code);
    installTransport(transport);
    await transport.startHost();
    room.connected = true;
    room.code = code;
    room.myName = name;
    room.hostId = room.myId;
    room.isHost = true;
    room.lifecycle = ROOM_STATE.WAITING;
    room.settings = { totalRounds: 10, maxPlayers: 8 };
    room.members = [{
      id: room.myId,
      name,
      isHost: true,
      ready: true,
      connected: true,
      spectator: false,
      peerId: transport.myPeerId
    }];
    room.transport = transport;
    ui.screen = "lobby";
    ui.message = "";
  } catch (error) {
    room.transport?.close();
    room.transport = null;
    ui.message = friendlyConnectionError(error);
    ui.messageError = true;
  } finally {
    ui.busy = false;
    render();
  }
}

async function joinRoom(name, code, reconnect = false) {
  if (!reconnect) {
    ui.busy = true;
    ui.message = `正在加入房间 ${code}...`;
    ui.messageError = false;
    render();
  }
  try {
    const transport = new PeerTransport(code);
    installTransport(transport);
    await transport.startClient();
    room.transport = transport;
    room.code = code;
    room.myName = name;
    const joined = new Promise(resolve => {
      ui.joinResolver = resolve;
      setTimeout(() => {
        if (ui.joinResolver) {
          ui.joinResolver(fail("房间无响应"));
          ui.joinResolver = null;
        }
      }, 12000);
    });
    transport.sendToHost({ type: "JOIN", roomCode: code, playerId: room.myId, name, reconnect });
    const result = await joined;
    if (!result.ok) throw new Error(result.reason);
    room.connected = true;
    ui.message = "";
    ui.messageError = false;
  } catch (error) {
    room.transport?.close();
    room.transport = null;
    room.connected = false;
    if (!reconnect) {
      ui.screen = "entry";
      ui.message = friendlyConnectionError(error);
      ui.messageError = true;
    } else {
      ui.message = "重连失败，请返回首页后重新加入。";
      ui.messageError = true;
    }
  } finally {
    ui.busy = false;
    render();
  }
}

function installTransport(transport) {
  room.transport = transport;
  transport.onMessage = handleNetworkMessage;
  transport.onPeerLeft = meta => {
    if (room.isHost && meta.playerId) markMemberDisconnected(meta.playerId);
  };
  transport.onHostLost = () => handleUnexpectedHostLoss();
}

function friendlyConnectionError(error) {
  const message = String(error?.message || error || "连接失败");
  if (message.includes("unavailable-id")) return "该房间码已被占用，请重试。";
  if (message.includes("peer-unavailable")) return "房间不存在或房主尚未就绪。";
  if (message.includes("PeerJS")) return "联机组件加载失败，请检查网络后刷新。";
  if (message.includes("timeout") || message.includes("超时") || message.includes("无响应")) return "连接超时，请确认房间码和网络状态。";
  return message;
}

function handleUnexpectedHostLoss() {
  if (room.isHost || !room.connected) return;
  ui.hostLostAt = Date.now();
  ui.message = "房主连接中断，30秒后尝试转移房主。";
  render();
  clearTimeout(ui.migrationTimer);
  const candidates = room.members.filter(member => member.id !== room.hostId && member.connected && !member.spectator);
  const nextHost = candidates[0];
  if (!nextHost) return;
  const delay = nextHost.id === room.myId ? 30000 : 33500;
  ui.migrationTimer = setTimeout(() => {
    if (nextHost.id === room.myId) {
      const snapshot = publicRoom();
      snapshot.hostId = room.myId;
      snapshot.members = snapshot.members.map(member => ({
        ...member,
        isHost: member.id === room.myId,
        connected: member.id === room.hostId ? false : member.connected
      }));
      promoteToHost(snapshot, ui.authorityBackup);
    } else {
      reconnectToCurrentHost();
    }
  }, delay);
}

function scheduleGracefulMigration(nextHostId) {
  clearTimeout(ui.migrationTimer);
  ui.message = "房主正在转移，稍后自动重连。";
  render();
  if (nextHostId !== room.myId) ui.migrationTimer = setTimeout(reconnectToCurrentHost, 1800);
}

async function promoteToHost(roomSnapshot, gameBackup) {
  try {
    room.transport?.close();
    await new Promise(resolve => setTimeout(resolve, 700));
    applyRoomSnapshot(roomSnapshot);
    room.hostId = room.myId;
    room.isHost = true;
    room.members = room.members.map(member => ({ ...member, isHost: member.id === room.myId }));
    game = gameBackup || game;
    const transport = new PeerTransport(room.code);
    installTransport(transport);
    await transport.startHost();
    room.transport = transport;
    room.connected = true;
    ui.message = "";
    if (game) {
      const previousHost = game.players.find(player => player.memberId !== room.myId && !room.members.find(member => member.id === player.memberId)?.connected);
      if (previousHost) {
        previousHost.connected = false;
        previousHost.disconnectedAt = Date.now();
      }
    }
    syncAll();
  } catch (error) {
    room.isHost = false;
    ui.message = "房主转移失败，正在尝试恢复连接。";
    render();
    setTimeout(reconnectToCurrentHost, 1200);
  }
}

function reconnectToCurrentHost() {
  room.transport?.close();
  joinRoom(room.myName, room.code, true);
}

function leaveRoom() {
  if (!room.connected) return resetClient();
  if (room.isHost) {
    if (room.lifecycle === ROOM_STATE.COUNTDOWN) {
      clearTimeout(ui.countdownStartTimer);
      room.lifecycle = ROOM_STATE.WAITING;
      room.countdownEndsAt = 0;
    }
    const next = room.members.find(member => member.id !== room.myId && member.connected && !member.spectator);
    if (next) {
      const snapshot = publicRoom();
      snapshot.hostId = next.id;
      snapshot.members = snapshot.members.map(member => ({
        ...member,
        isHost: member.id === next.id,
        connected: member.id === room.myId ? false : member.connected
      }));
      room.transport.sendToPlayer(next.id, { type: "PROMOTE", room: snapshot, gameBackup: game });
      room.transport.broadcast({ type: "HOST_MOVING", nextHostId: next.id });
      setTimeout(resetClient, 350);
      return;
    }
  } else {
    room.transport?.sendToHost({ type: "ROOM_ACTION", action: "LEAVE", payload: {} });
  }
  resetClient();
}

function resetClient() {
  clearTimeout(ui.countdownStartTimer);
  clearTimeout(ui.countdownPaintTimer);
  clearTimeout(ui.migrationTimer);
  room.transport?.close();
  room.connected = false;
  room.code = "";
  room.hostId = "";
  room.isHost = false;
  room.lifecycle = ROOM_STATE.WAITING;
  room.members = [];
  room.transport = null;
  game = null;
  ui.screen = "entry";
  ui.modal = null;
  ui.pendingRequest = false;
  ui.message = "";
  render();
}

function render() {
  if (ui.screen === "entry" || !room.connected) renderEntry();
  else if (room.lifecycle === ROOM_STATE.WAITING || room.lifecycle === ROOM_STATE.COUNTDOWN) renderLobby();
  else if (room.lifecycle === ROOM_STATE.SETTLEMENT || game?.phase === GAME_PHASE.SETTLEMENT) renderSettlement();
  else renderGame();
  if (ui.toast) app.insertAdjacentHTML("beforeend", `<div class="toast" role="status">${escapeHtml(ui.toast)}</div>`);
  if (ui.rulesOpen) renderRulesModal();
  if (ui.modal) renderActionModal();
  if (ui.hostLostAt && !room.isHost && room.connected) {
    app.insertAdjacentHTML("beforeend", `<div class="connection-warning">${escapeHtml(ui.message || "连接中断，正在恢复。")}</div>`);
  }
  initIcons();
}

function renderEntry() {
  app.innerHTML = `
    <div class="entry-shell">
      <div class="brand">
        <div class="brand-mark">${icon("music-2", 26)}</div>
        <div><h1>谱师卡牌</h1><div class="version">${VERSION}</div></div>
      </div>
      <section class="entry-form">
        <div class="mode-line">${icon("radio-tower", 18)} 跨网络 P2P 房间</div>
        <div class="field">
          <label for="player-name">玩家名称</label>
          <input class="input" id="player-name" maxlength="16" autocomplete="nickname" placeholder="输入你的名称" value="${escapeHtml(room.myName)}">
        </div>
        <button class="btn primary full" id="create-room" ${ui.busy ? "disabled" : ""}>${icon("plus", 16)} 创建房间</button>
        <div class="divider">或加入房间</div>
        <div class="join-row">
          <input class="input room-code-input" id="join-code" maxlength="5" placeholder="房间码" autocomplete="off">
          <button class="btn" id="join-room" ${ui.busy ? "disabled" : ""}>${icon("log-in", 16)} 加入</button>
        </div>
        <div class="status-message ${ui.messageError ? "error" : ""}" role="status">${escapeHtml(ui.message)}</div>
        <div class="brief">支持2至8人。房间由创建者设备负责结算，使用 PeerJS 公共信令建立 WebRTC 连接。游戏中加入的成员自动进入观战。</div>
      </section>
    </div>`;
  const nameInput = document.getElementById("player-name");
  document.getElementById("create-room").onclick = () => {
    const name = nameInput.value.trim();
    if (!name) return setMessage("请输入玩家名称。", true);
    room.myName = name;
    createRoom(name);
  };
  document.getElementById("join-room").onclick = () => {
    const name = nameInput.value.trim();
    const code = document.getElementById("join-code").value.trim().toUpperCase();
    if (!name) return setMessage("请输入玩家名称。", true);
    if (!/^[A-Z2-9]{5}$/.test(code)) return setMessage("请输入5位房间码。", true);
    room.myName = name;
    joinRoom(name, code);
  };
  document.getElementById("join-code").onkeydown = event => {
    if (event.key === "Enter") document.getElementById("join-room").click();
  };
}

function topbar(title, extra = "") {
  return `
    <header class="topbar">
      <div class="topbar-title">${escapeHtml(title)}</div>
      <span class="version version-inline">${VERSION}</span>
      <span class="room-pill">${room.code}</span>
      ${extra}
      <span class="spacer"></span>
      <button class="btn icon-only small" id="rules-button" title="查看规则">${icon("book-open", 16)}</button>
      <button class="btn icon-only small danger" id="leave-button" title="离开房间">${icon("log-out", 16)}</button>
    </header>`;
}

function bindTopbar() {
  document.getElementById("rules-button").onclick = () => { ui.rulesOpen = true; render(); };
  document.getElementById("leave-button").onclick = leaveRoom;
}

function renderLobby() {
  const readyPlayers = roomPlayers();
  const canStart = room.isHost &&
    readyPlayers.length >= 2 &&
    readyPlayers.every(member => member.connected) &&
    readyPlayers.every(member => member.id === room.hostId || member.ready);
  app.innerHTML = `
    ${topbar("房间大厅", `<span class="state-pill">${room.lifecycle}</span>`)}
    <div class="room-layout">
      <div>
        <section class="section">
          <div class="section-note">房间码</div>
          <div class="lobby-code">${room.code}</div>
          <div class="lobby-sub">将房间码发给其他玩家，跨网络也可加入。</div>
          <div class="lobby-actions">
            <button class="btn" id="copy-code">${icon("copy", 15)} 复制房间码</button>
            ${room.isHost
              ? `<button class="btn primary" id="start-game" ${canStart ? "" : "disabled"}>${icon("play", 15)} 开始游戏</button>`
              : `<button class="btn primary" id="ready-button" ${myMember()?.spectator ? "disabled" : ""}>${myMember()?.ready ? icon("x", 15) + " 取消准备" : icon("check", 15) + " 准备"}</button>`}
          </div>
          <div class="status-message ${ui.messageError ? "error" : ""}">${escapeHtml(ui.message)}</div>
        </section>
        <section class="section">
          <div class="section-head"><h2>玩家列表</h2><span class="section-note">${readyPlayers.length}/8 名玩家</span></div>
          <div class="member-list">${room.members.map(renderMemberRow).join("")}</div>
        </section>
      </div>
      <aside>
        <section class="section">
          <div class="section-head"><h2>房间设置</h2>${room.isHost ? '<span class="tag host">房主可改</span>' : ""}</div>
          <div class="setting-row">
            <div class="setting-label">总回合数<span>所有玩家各行动一次记为1轮</span></div>
            <div class="segment" id="round-segment">
              ${[6, 8, 10, 12, 15].map(value => `<button data-round="${value}" class="${room.settings.totalRounds === value ? "active" : ""}" ${room.isHost ? "" : "disabled"}>${value}</button>`).join("")}
            </div>
          </div>
          <div class="setting-row">
            <div class="setting-label">初始购置点数<span>购置角色后进入第1轮</span></div>
            <strong>12</strong>
          </div>
          <div class="setting-row">
            <div class="setting-label">连接方式<span>静态部署可用，无局域网模式</span></div>
            <strong>WebRTC</strong>
          </div>
        </section>
        <div class="notice">需要至少2名玩家，且所有非房主玩家准备后才能开始。游戏开始后新成员只能观战。</div>
      </aside>
    </div>
    ${room.lifecycle === ROOM_STATE.COUNTDOWN ? renderCountdown() : ""}`;
  bindTopbar();
  document.getElementById("copy-code").onclick = async () => {
    try {
      await navigator.clipboard.writeText(room.code);
      showToast("房间码已复制");
    } catch (_) {
      showToast(`房间码：${room.code}`);
    }
  };
  if (room.isHost) {
    document.getElementById("start-game").onclick = () => sendRoomAction("START");
    document.querySelectorAll("[data-round]").forEach(button => {
      button.onclick = () => sendRoomAction("UPDATE_ROUNDS", { totalRounds: Number(button.dataset.round) });
    });
  } else {
    document.getElementById("ready-button").onclick = () => sendRoomAction("TOGGLE_READY");
  }
  if (room.lifecycle === ROOM_STATE.COUNTDOWN) scheduleCountdownPaint();
}

function renderMemberRow(member) {
  const labels = [
    member.isHost ? '<span class="tag host">房主</span>' : "",
    member.spectator ? '<span class="tag spectator">观战</span>' : "",
    !member.spectator && member.ready ? '<span class="tag ready">已准备</span>' : "",
    !member.connected ? '<span class="tag bad">掉线</span>' : "",
    member.id === room.myId ? '<span class="tag">你</span>' : ""
  ].join("");
  return `<div class="member-row">
    <span class="member-dot ${member.connected ? "" : "offline"}"></span>
    <span class="member-name">${escapeHtml(member.name)}</span>
    ${labels}
  </div>`;
}

function renderCountdown() {
  const seconds = Math.max(1, Math.ceil((room.countdownEndsAt - Date.now()) / 1000));
  return `<div class="countdown"><div class="countdown-inner"><div class="countdown-number" id="countdown-number">${seconds}</div><div class="countdown-text">游戏即将开始</div></div></div>`;
}

function scheduleCountdownPaint() {
  clearTimeout(ui.countdownPaintTimer);
  const tick = () => {
    if (room.lifecycle !== ROOM_STATE.COUNTDOWN || room.isHost) return;
    const element = document.getElementById("countdown-number");
    if (element) element.textContent = Math.max(1, Math.ceil((room.countdownEndsAt - Date.now()) / 1000));
    ui.countdownPaintTimer = setTimeout(tick, 250);
  };
  tick();
}

function renderGame() {
  const me = myGamePlayer();
  const current = currentPlayer();
  const draft = game.phase === GAME_PHASE.DRAFT;
  const phaseLabel = draft ? "购置阶段" : `第${game.round}/${game.totalRounds}轮`;
  app.innerHTML = `
    ${topbar("谱师卡牌", `<span class="state-pill">${phaseLabel}</span>
      <div class="turn-line">当前：<strong>${escapeHtml(current?.name || "")}</strong>${draft ? "购置角色" : "进行回合"}</div>`)}
    ${isSpectator() ? `<div class="spectator-banner">${icon("eye", 15)} 观战模式：你可以查看公开数据，但不能查看手牌或执行操作。</div>` : ""}
    <div class="game-layout">
      <aside class="side-column">
        <section class="section">
          <div class="section-head"><h2>玩家</h2><span class="section-note">${game.players.length}人</span></div>
          ${game.players.map((player, index) => renderPlayerMini(player, index)).join("")}
        </section>
        <section class="section">
          <div class="section-head"><h2>操作记录</h2><span class="section-note">主机结算</span></div>
          <div class="log-list">${game.log.slice().reverse().map(renderLog).join("")}</div>
        </section>
      </aside>
      <div class="main-column">
        ${renderDimensionPanel(me)}
        ${draft ? renderDraft(me) : renderTurn(me)}
      </div>
    </div>`;
  bindTopbar();
  if (draft) bindDraft(me);
  else bindTurn(me);
}

function renderDimensionPanel(player) {
  if (!player) return "";
  return `<div class="dimension-panel">
    ${DIMENSIONS.map(dim => `<div class="dimension"><div class="dimension-label">${DIMENSION_LABELS[dim]}</div><div class="dimension-value">${player.scores[dim]}</div></div>`).join("")}
    <div class="dimension reputation"><div class="dimension-label">声望 / 总分</div><div class="dimension-value">${player.reputation} <span class="dimension-total">· ${totalScore(player)}</span></div></div>
  </div>`;
}

function renderPlayerMini(player, index) {
  const active = index === game.currentPlayerIndex;
  const statuses = [
    player.disableSkillTurns > 0 ? `<span class="tag bad">禁技${player.disableSkillTurns}</span>` : "",
    player.extraTurns > 0 ? `<span class="tag good">额外${player.extraTurns}</span>` : "",
    player.aiControlled ? '<span class="tag spectator">托管</span>' : "",
    !player.connected ? '<span class="tag bad">掉线</span>' : ""
  ].join("");
  return `<div class="player-mini ${active ? "active" : ""} ${player.memberId === room.myId ? "me" : ""}">
    <div class="player-mini-head"><span class="player-mini-name">${escapeHtml(player.name)}</span>${active ? '<span class="tag good">当前</span>' : ""}${statuses}</div>
    <div class="mini-dims">${DIMENSIONS.map(dim => `<span class="mini-dim">${DIMENSION_LABELS[dim].slice(0, 2)}<b>${player.scores[dim]}</b></span>`).join("")}</div>
  </div>`;
}

function renderLog(entry) {
  return `<div class="log-entry ${entry.type}"><span class="log-round">${entry.round ? `R${entry.round}` : "准备"}</span><span class="log-text">${escapeHtml(entry.text)}</span></div>`;
}

function renderDraft(me) {
  const active = isMyTurn() && !isSpectator();
  return `
    <div class="phase-banner">${icon("shopping-basket", 19)}<div><strong>${active ? "轮到你购置角色" : `等待 ${escapeHtml(currentPlayer()?.name)} 购置`}</strong><span>每名玩家拥有12点，不可重复购置同一角色；至少购置1名角色。</span></div></div>
    <section class="section">
      <div class="section-head"><h2>公共角色卡池</h2><span class="shop-balance">剩余 ${me?.funds ?? "-"} 点</span></div>
      <div class="character-grid">${CHARACTERS.map(character => renderShopCard(character, me, active)).join("")}</div>
    </section>
    <div class="actionbar">
      <span class="action-hint">${active ? "确认完成后将轮到下一名玩家。" : "非当前购置玩家不能操作。"}</span>
      ${active ? `<button class="btn primary" id="draft-done" ${me?.characters.length ? "" : "disabled"}>${icon("check", 15)} 完成购置</button>` : ""}
    </div>`;
}

function renderShopCard(character, me, active) {
  const price = RARITY[character.rarity].price;
  const owned = me?.characters.some(item => item.id === character.id);
  const affordable = Boolean(active && me && me.funds >= price && !owned);
  return `<article class="game-card character">
    <div class="card-top"><span class="card-kind">角色</span><span class="rarity">${character.rarity}</span></div>
    <div class="card-glyph">${icon(character.glyph, 28)}</div>
    <div class="card-name">${escapeHtml(character.name)}</div>
    <div class="card-desc"><strong>${escapeHtml(character.ability)}</strong><br>${escapeHtml(character.description)}</div>
    <div class="card-meta">初始选曲 ${character.selection} · CD ${character.cooldown}</div>
    <div class="card-action">${owned
      ? '<div class="owned-mark">已购置</div>'
      : `<button class="btn ${affordable ? "coral" : ""}" data-buy="${character.id}" ${affordable ? "" : "disabled"}>${icon("coins", 14)} ${price}点购置</button>`}</div>
  </article>`;
}

function bindDraft(me) {
  document.querySelectorAll("[data-buy]").forEach(button => {
    button.onclick = () => sendGameAction("DRAFT_BUY", { characterId: button.dataset.buy });
  });
  const done = document.getElementById("draft-done");
  if (done) done.onclick = () => sendGameAction("DRAFT_DONE");
}

function renderTurn(me) {
  const ownTurn = isMyTurn() && !isSpectator();
  const mustUseCharacter = ownTurn && game.round === 1 && !me?.firstRoundSkillUsed;
  const hand = me?.hand || [];
  const responseCards = !ownTurn && hand.filter(card => skillDefinition(card.cardId)?.timing === "response");
  let instruction = `等待 ${escapeHtml(currentPlayer()?.name)} 完成回合`;
  if (ownTurn && !game.turn.hasDrawn) instruction = "先从公共牌堆摸1张牌";
  else if (mustUseCharacter) instruction = "第1轮必须发动1次角色技能";
  else if (ownTurn) instruction = "可打出至多3张技能牌、发动角色技能或结束回合";
  else if (responseCards.length) instruction = "你有可在他人回合使用的即时技能牌";
  return `
    <div class="phase-banner">${icon(mustUseCharacter ? "circle-alert" : "route", 19)}<div><strong>${instruction}</strong><span>牌堆 ${game.deck.length} · 弃牌 ${game.discard.length} · 本回合技能牌 ${game.turn.skillCardsPlayed}/3</span></div></div>
    <section class="section">
      <div class="section-head"><h2>手牌</h2><span class="section-note">${me ? `${me.handCount}张` : "不可见"}</span></div>
      ${hand.length ? `<div class="card-row">${hand.map(card => renderSkillCard(card, me, ownTurn)).join("")}</div>` : '<div class="empty">暂无技能牌。事件牌摸到后会立即触发，不会进入这里。</div>'}
    </section>
    <section class="section">
      <div class="section-head"><h2>角色技能</h2><span class="section-note">${me?.disableSkillTurns > 0 ? `禁用剩余${me.disableSkillTurns}回合` : "按角色独立冷却"}</span></div>
      ${me?.characters.length ? `<div class="ability-grid">${me.characters.map(instance => renderAbility(instance, me, ownTurn)).join("")}</div>` : '<div class="empty">未购置角色</div>'}
    </section>
    <div class="actionbar">
      <span class="action-hint">${instruction}</span>
      ${ownTurn && !game.turn.hasDrawn ? `<button class="btn primary" id="draw-card" ${ui.pendingRequest ? "disabled" : ""}>${icon("hand", 15)} 摸1张牌</button>` : ""}
      ${ownTurn ? `<button class="btn coral" id="end-turn" ${(!game.turn.hasDrawn || mustUseCharacter || ui.pendingRequest) ? "disabled" : ""}>${icon("skip-forward", 15)} 结束回合</button>` : ""}
    </div>`;
}

function renderSkillCard(card, me, ownTurn) {
  const definition = skillDefinition(card.cardId);
  const canUse = !ui.pendingRequest &&
    ((ownTurn && game.turn.hasDrawn && definition.timing === "turn" && game.turn.skillCardsPlayed < 3) ||
     (!ownTurn && definition.timing === "response"));
  return `<article class="game-card skill">
    <div class="card-top"><span class="card-kind">技能牌</span><span class="rarity">${definition.timing === "response" ? "即时" : "己方"}</span></div>
    <div class="card-glyph">${icon(definition.glyph, 28)}</div>
    <div class="card-name">${escapeHtml(definition.name)}</div>
    <div class="card-desc">${escapeHtml(definition.description)}</div>
    <div class="card-meta">${definition.timing === "response" ? "他人回合可响应" : "自己的回合使用"}</div>
    <div class="card-action"><button class="btn" data-play-card="${card.uid}" ${canUse ? "" : "disabled"}>${icon("play", 13)} 使用</button></div>
  </article>`;
}

function renderAbility(instance, me, ownTurn) {
  const definition = characterDefinition(instance.id);
  const firstRoundOverride = game.round === 1 && !me.firstRoundSkillUsed;
  const disabledByStatus = me.disableSkillTurns > 0 && !firstRoundOverride;
  const usedThisTurn = game.turn.usedCharacterIds.includes(instance.id);
  const canUse = ownTurn &&
    game.turn.hasDrawn &&
    !ui.pendingRequest &&
    !instance.permanentlyDisabled &&
    !usedThisTurn &&
    instance.cooldownLeft === 0 &&
    !disabledByStatus;
  let status = "可发动";
  if (!game.turn.hasDrawn) status = "摸牌后可用";
  if (usedThisTurn) status = "本回合已发动";
  if (disabledByStatus) status = "本回合禁用";
  if (instance.cooldownLeft > 0) status = `冷却 ${instance.cooldownLeft}`;
  if (instance.permanentlyDisabled) status = "永久失效";
  if (firstRoundOverride && me.disableSkillTurns > 0) status = "强制规则覆盖禁用";
  return `<article class="ability-item">
    <div class="ability-head"><div><div class="ability-name">${escapeHtml(definition.ability)}</div><div class="ability-owner">${escapeHtml(definition.name)}</div></div><span class="tag ${canUse ? "good" : ""}">${status}</span></div>
    <div class="ability-desc">${escapeHtml(definition.description)}</div>
    <button class="btn" data-ability="${definition.id}" ${canUse ? "" : "disabled"}>${icon("sparkles", 13)} 发动技能</button>
  </article>`;
}

function bindTurn(me) {
  document.getElementById("draw-card")?.addEventListener("click", () => sendGameAction("DRAW"));
  document.getElementById("end-turn")?.addEventListener("click", () => sendGameAction("END_TURN"));
  document.querySelectorAll("[data-play-card]").forEach(button => {
    button.onclick = () => openCardAction(button.dataset.playCard);
  });
  document.querySelectorAll("[data-ability]").forEach(button => {
    button.onclick = () => openAbilityAction(button.dataset.ability);
  });
}

function openCardAction(cardUid) {
  const me = myGamePlayer();
  const card = me?.hand.find(item => item.uid === cardUid);
  const definition = skillDefinition(card?.cardId);
  if (!card || !definition) return;
  if (definition.target === "self") return sendGameAction("PLAY_CARD", { cardUid });
  if (definition.target === "motion") {
    ui.modal = { kind: "motion-card", cardUid, title: definition.name, description: definition.description };
  } else {
    const targets = game.players.filter(player => definition.target === "any" || player.memberId !== me.memberId);
    ui.modal = { kind: "target-card", cardUid, title: definition.name, description: definition.description, targets };
  }
  render();
}

function openAbilityAction(characterId) {
  const definition = characterDefinition(characterId);
  if (definition?.choice === "motion") {
    ui.modal = { kind: "motion-ability", characterId, title: definition.ability, description: definition.description };
    render();
  } else {
    sendGameAction("ACTIVATE_CHARACTER", { characterId });
  }
}

function renderActionModal() {
  const modal = ui.modal;
  let choices = "";
  if (modal.kind === "target-card") {
    choices = `<div class="target-list">${modal.targets.map(target => `<button class="target-btn" data-target="${target.memberId}"><span>${escapeHtml(target.name)}</span><span class="target-score">${totalScore(target)}分</span></button>`).join("")}</div>`;
  } else {
    choices = `<div class="target-list">
      <button class="target-btn" data-dimension="abstract"><span>抽象动效</span><span class="target-score">选择</span></button>
      <button class="target-btn" data-dimension="concrete"><span>具象动效</span><span class="target-score">选择</span></button>
    </div>`;
  }
  app.insertAdjacentHTML("beforeend", `<div class="modal"><div class="modal-box">
    <div class="modal-head"><h3>${escapeHtml(modal.title)}</h3><button class="btn icon-only small" id="close-modal" title="关闭">${icon("x", 15)}</button></div>
    <div class="modal-desc">${escapeHtml(modal.description)}</div>${choices}
  </div></div>`);
  document.getElementById("close-modal").onclick = () => { ui.modal = null; render(); };
  document.querySelectorAll("[data-target]").forEach(button => {
    button.onclick = () => {
      const cardUid = modal.cardUid;
      const targetMemberId = button.dataset.target;
      ui.modal = null;
      sendGameAction("PLAY_CARD", { cardUid, targetMemberId });
    };
  });
  document.querySelectorAll("[data-dimension]").forEach(button => {
    button.onclick = () => {
      const dimension = button.dataset.dimension;
      ui.modal = null;
      if (modal.kind === "motion-card") sendGameAction("PLAY_CARD", { cardUid: modal.cardUid, dimension });
      else sendGameAction("ACTIVATE_CHARACTER", { characterId: modal.characterId, dimension });
    };
  });
}

function renderSettlement() {
  const ranking = game?.ranking || [];
  const topScore = ranking[0]?.score;
  const winners = ranking.filter(item => item.score === topScore).map(item => item.name);
  app.innerHTML = `
    ${topbar("结算", `<span class="state-pill">SETTLEMENT</span>`)}
    <div class="settlement">
      <div class="winner"><div class="winner-label">${winners.length > 1 ? "并列冠军" : "冠军"}</div><div class="winner-name">${escapeHtml(winners.join("、"))}</div></div>
      <div class="ranking">${ranking.map((item, index) => `<div class="rank-row">
        <div class="rank-pos">${index + 1}</div>
        <div><div class="rank-name">${escapeHtml(item.name)}</div><div class="rank-detail">五维 ${DIMENSIONS.reduce((sum, dim) => sum + item.scores[dim], 0)} · 声望 ${item.reputation}</div></div>
        <div class="rank-score">${item.score}</div>
      </div>`).join("")}</div>
      ${room.isHost
        ? `<button class="btn primary full" id="back-lobby">${icon("rotate-ccw", 15)} 返回房间大厅</button>`
        : '<div class="notice">等待房主返回房间大厅。</div>'}
    </div>`;
  bindTopbar();
  document.getElementById("back-lobby")?.addEventListener("click", () => sendRoomAction("BACK_TO_LOBBY"));
}

function renderRulesModal() {
  app.insertAdjacentHTML("beforeend", `<div class="modal"><div class="modal-box rules-dialog">
    <div class="modal-head"><h3>规则摘要</h3><button class="btn icon-only small" id="close-rules" title="关闭">${icon("x", 15)}</button></div>
    <ol>
      <li><strong>购置：</strong>每人12点，按S/A+/A/B+/B/C支付6/5/4/3/2/1点，不可重复购置同一角色。</li>
      <li><strong>回合：</strong>先摸1张牌，再打出至多3张技能牌并选择是否发动角色技能。</li>
      <li><strong>第1轮：</strong>每位玩家必须发动至少1次角色技能，以该角色数值确定初始选曲品味。</li>
      <li><strong>事件牌：</strong>摸到后不进入手牌，立即强制结算，并直接洗回公共牌堆。</li>
      <li><strong>结算：</strong>总分为五个维度分数之和加声望，最高者获胜，同分并列。</li>
      <li><strong>冲突优先级：</strong>${RULE_PRIORITY.join(" > ")}。</li>
    </ol>
  </div></div>`);
  document.getElementById("close-rules").onclick = () => { ui.rulesOpen = false; render(); };
}

render();
</script>

<script>
(function loadOptionalLibraries() {
  const lucideScript = document.createElement("script");
  lucideScript.src = "https://cdn.jsdelivr.net/npm/lucide@0.468.0/dist/umd/lucide.min.js";
  lucideScript.onload = function () { if (typeof initIcons === "function") initIcons(); };
  document.head.appendChild(lucideScript);

  const sources = [
    "./peerjs.min.js",
    "https://cdn.jsdelivr.net/npm/peerjs@1.5.4/dist/peerjs.min.js",
    "https://cdn.bootcdn.net/ajax/libs/peerjs/1.5.4/peerjs.min.js",
    "https://cdnjs.cloudflare.com/ajax/libs/peerjs/1.5.4/peerjs.min.js"
  ];
  let index = 0;
  function next() {
    if (typeof window.Peer !== "undefined") {
      window.dispatchEvent(new Event("peerjs-ready"));
      return;
    }
    if (index >= sources.length) {
      window.__peerjsFailed = true;
      window.dispatchEvent(new Event("peerjs-failed"));
      return;
    }
    const script = document.createElement("script");
    script.src = sources[index++];
    script.onload = next;
    script.onerror = next;
    document.head.appendChild(script);
  }
  next();
})();

function waitForPeerJS(timeout = 16000) {
  if (typeof window.Peer !== "undefined") return Promise.resolve();
  return new Promise((resolve, reject) => {
    const timer = setTimeout(() => {
      cleanup();
      reject(new Error("PeerJS 加载超时"));
    }, timeout);
    const ready = () => { cleanup(); resolve(); };
    const failed = () => { cleanup(); reject(new Error("PeerJS 库加载失败")); };
    const cleanup = () => {
      clearTimeout(timer);
      window.removeEventListener("peerjs-ready", ready);
      window.removeEventListener("peerjs-failed", failed);
    };
    window.addEventListener("peerjs-ready", ready, { once: true });
    window.addEventListener("peerjs-failed", failed, { once: true });
  });
}

class PeerTransport {
  constructor(roomCode) {
    this.roomCode = roomCode;
    this.peer = null;
    this.myPeerId = "";
    this.isHost = false;
    this.hostConnection = null;
    this.connections = new Map();
    this.onMessage = null;
    this.onPeerLeft = null;
    this.onHostLost = null;
    this.closed = false;
  }

  peerOptions() {
    return {
      debug: 0,
      config: {
        iceServers: [
          { urls: "stun:stun.l.google.com:19302" },
          { urls: "stun:stun1.l.google.com:19302" },
          { urls: "stun:stun2.l.google.com:19302" },
          { urls: "stun:stun.miwifi.com:3478" },
          { urls: "stun:stun.chat.bilibili.com:3478" }
        ]
      }
    };
  }

  hostPeerId() {
    return `puishi-v100-${this.roomCode}-host`;
  }

  async startHost() {
    await waitForPeerJS();
    this.isHost = true;
    this.myPeerId = this.hostPeerId();
    this.peer = new Peer(this.myPeerId, this.peerOptions());
    const pendingConnections = [];
    let connectionHandler = null;
    this.peer.on("connection", connection => {
      if (connectionHandler) connectionHandler(connection);
      else pendingConnections.push(connection);
    });
    await this.waitForPeerOpen();
    connectionHandler = connection => this.attachConnection(connection);
    pendingConnections.splice(0).forEach(connectionHandler);
  }

  async startClient() {
    await waitForPeerJS();
    this.isHost = false;
    this.myPeerId = `puishi-v100-client-${cryptoRandom(10)}`;
    this.peer = new Peer(this.myPeerId, this.peerOptions());
    await this.waitForPeerOpen();
    const connection = this.peer.connect(this.hostPeerId(), { reliable: true, serialization: "json" });
    this.hostConnection = connection;
    this.attachConnection(connection);
    await this.waitForConnectionOpen(connection);
  }

  waitForPeerOpen() {
    return new Promise((resolve, reject) => {
      const timer = setTimeout(() => reject(new Error("PeerJS 连接超时")), 20000);
      this.peer.once("open", () => { clearTimeout(timer); resolve(); });
      this.peer.once("error", error => { clearTimeout(timer); reject(error); });
    });
  }

  waitForConnectionOpen(connection) {
    return new Promise((resolve, reject) => {
      if (connection.open) return resolve();
      const timer = setTimeout(() => reject(new Error("房间连接超时")), 16000);
      connection.once("open", () => { clearTimeout(timer); resolve(); });
      connection.once("error", error => { clearTimeout(timer); reject(error); });
    });
  }

  attachConnection(connection) {
    if (!this.connections.has(connection.peer)) {
      this.connections.set(connection.peer, { connection, playerId: null, name: "" });
    }
    connection.on("data", data => {
      let message = data;
      if (typeof data === "string") {
        try { message = JSON.parse(data); } catch (_) { return; }
      }
      const record = this.connections.get(connection.peer);
      if (message?.type === "JOIN" && record) {
        record.playerId = message.playerId;
        record.name = message.name;
      }
      this.onMessage?.(message, { peerId: connection.peer, playerId: record?.playerId || message?.playerId || null });
    });
    connection.on("close", () => {
      const record = this.connections.get(connection.peer);
      this.connections.delete(connection.peer);
      if (this.closed) return;
      if (this.isHost) this.onPeerLeft?.({ peerId: connection.peer, playerId: record?.playerId || null });
      else this.onHostLost?.();
    });
    connection.on("error", () => {});
  }

  bindPlayer(peerId, playerId, name) {
    const record = this.connections.get(peerId);
    if (!record) return;
    record.playerId = playerId;
    record.name = name;
  }

  send(connection, message) {
    if (!connection?.open) return false;
    try {
      connection.send(message);
      return true;
    } catch (_) {
      return false;
    }
  }

  sendToHost(message) {
    return this.send(this.hostConnection, message);
  }

  sendToPlayer(playerId, message) {
    for (const record of this.connections.values()) {
      if (record.playerId === playerId) return this.send(record.connection, message);
    }
    return false;
  }

  broadcast(message) {
    for (const record of this.connections.values()) this.send(record.connection, message);
  }

  close() {
    this.closed = true;
    for (const record of this.connections.values()) {
      try { record.connection.close(); } catch (_) {}
    }
    this.connections.clear();
    if (this.peer) {
      try { this.peer.destroy(); } catch (_) {}
    }
    this.peer = null;
    this.hostConnection = null;
  }
}
</script>
