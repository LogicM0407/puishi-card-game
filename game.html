<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#0f0a1e">
<title>谱师卡牌</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  :root {
    --bg: #0f0a1e; --bg2: #1a1033; --panel: #221647; --panel2: #2d1d5c;
    --accent: #ff66cc; --accent2: #66e0ff; --gold: #ffd54a;
    --good: #6ee7a8; --bad: #ff6b6b;
    --text: #f0e8ff; --muted: #9a8cc4; --border: #4a2f8a;
    --s: 8px;
  }
  html, body { font-family: "Segoe UI","PingFang SC","Microsoft YaHei",sans-serif; background: radial-gradient(ellipse at top, var(--bg2), var(--bg)); color: var(--text); min-height: 100vh; font-size: 14px; }
  body { padding: env(safe-area-inset-top) 0 env(safe-area-inset-bottom); }
  h1 { font-size: 22px; background: linear-gradient(90deg,var(--accent),var(--accent2)); -webkit-background-clip: text; background-clip: text; color: transparent; }
  h2 { font-size: 15px; color: var(--accent2); margin-bottom: 6px; display:flex; align-items:center; justify-content:space-between; cursor:pointer; }
  h2 .chev { transition:transform .2s; font-size:12px; color:var(--muted); }
  h2.collapsed .chev { transform:rotate(-90deg); }
  .muted { color: var(--muted); font-size: 12px; }
  .wrap { max-width: 1280px; margin: 0 auto; padding: 10px; }
  .setup { max-width: 560px; margin: 24px auto; background: var(--panel); border: 1px solid var(--border); border-radius: 16px; padding: 22px; }
  .setup h1 { text-align: center; margin-bottom: 4px; }
  .setup .sub { text-align: center; color: var(--muted); margin-bottom: 18px; font-size: 13px; }
  .tabs { display:flex; gap:6px; margin-bottom:16px; background:var(--bg2); padding:4px; border-radius:10px; }
  .tabs button { flex:1; padding:10px; background:transparent; border:none; color:var(--muted); border-radius:8px; cursor:pointer; font-size:13px; font-weight:600; transition:.2s; }
  .tabs button.active { background:var(--panel2); color:var(--text); box-shadow:0 1px 3px rgba(0,0,0,.3); }
  .field { margin-bottom: 14px; }
  .field label { display: block; margin-bottom: 5px; color: var(--accent2); font-size: 12.5px; }
  .seg { display: flex; gap: 6px; }
  .seg button, .seg input {
    flex: 1; padding: 10px 8px; background: var(--panel2); border: 1px solid var(--border);
    color: var(--text); border-radius: 8px; cursor: pointer; font-size: 13px; transition: .15s;
  }
  .seg input { flex:2; cursor:text; outline:none; font-family:inherit; }
  .seg input:focus { border-color:var(--accent); }
  .seg button.active { background: linear-gradient(135deg,var(--accent),var(--accent2)); border-color: transparent; color: #fff; font-weight: 700; }
  .seg button:hover { border-color: var(--accent); }
  .btn-primary {
    width: 100%; padding: 13px; margin-top: 6px; font-size: 15px; font-weight: 700;
    background: linear-gradient(135deg,var(--accent),var(--accent2)); color: #fff;
    border: none; border-radius: 10px; cursor: pointer; transition: .15s;
  }
  .btn-primary:disabled { filter: grayscale(.5) brightness(.7); cursor: not-allowed; }
  .btn-primary:active { transform: scale(.98); }
  .rules { background: var(--bg2); border-radius: 10px; padding: 12px; margin-top: 14px; font-size: 12px; line-height: 1.65; color: var(--muted); }
  .rules b { color: var(--text); }
  .room-info { background:var(--bg2); border-radius:10px; padding:12px; margin-bottom:12px; }
  .room-info .code { font-size:22px; font-weight:800; text-align:center; letter-spacing:8px; color:var(--gold); padding:6px 0; font-family: "Consolas", monospace; }
  .room-info .label { text-align:center; font-size:11px; color:var(--muted); }
  .room-players { margin:8px 0; }
  .room-players .rp { display:flex; justify-content:space-between; align-items:center; padding:8px 10px; background:var(--panel2); border-radius:8px; margin-bottom:4px; font-size:13px; }
  .room-players .rp .host { background:var(--gold); color:#000; font-size:10px; padding:1px 5px; border-radius:4px; margin-left:4px; font-weight:700; }
  .topbar { display:flex; align-items:center; gap:8px; background:var(--panel); border:1px solid var(--border); border-radius:12px; padding:8px 12px; margin-bottom:10px; flex-wrap:wrap; position:sticky; top:0; z-index:20; backdrop-filter: blur(8px); }
  .topbar .round { font-weight:700; color:var(--gold); font-size:13px; }
  .topbar .cur { font-size:12.5px; }
  .topbar .cur b { color:var(--accent); }
  .topbar .deck { color:var(--muted); font-size:12px; }
  .topbar .room-tag { font-size:11px; background:var(--accent2); color:#000; padding:2px 6px; border-radius:5px; font-weight:700; }
  .topbar .funds { font-size:12px; color:var(--gold); font-weight:700; }
  .spacer { flex: 1; }
  .btn {
    padding: 7px 12px; background: var(--panel2); border: 1px solid var(--border); color: var(--text);
    border-radius: 7px; cursor: pointer; font-size: 12px; transition: .15s; white-space:nowrap;
  }
  .btn:hover:not(:disabled) { border-color: var(--accent); }
  .btn:disabled { opacity: .4; cursor: not-allowed; }
  .btn-accent { background: linear-gradient(135deg,var(--accent),#b347d9); border-color: transparent; color: #fff; font-weight: 700; }
  .btn-good { background: linear-gradient(135deg,#2eb87a,#1d8a5a); border-color: transparent; color: #fff; }
  .btn-bad { background: linear-gradient(135deg,#e25555,#b33838); border-color: transparent; color: #fff; }
  .btn-sm { padding:5px 10px; font-size:11px; }
  .layout { display: grid; grid-template-columns: 260px 1fr; gap: 10px; }
  .side { display: flex; flex-direction: column; gap: 8px; }
  .main { display: flex; flex-direction: column; gap: 10px; }
  .panel { background: var(--panel); border: 1px solid var(--border); border-radius: 12px; padding: 11px; }
  .collapsible-content { transition: max-height .3s ease, opacity .2s ease; overflow: hidden; }
  .collapsible-content.collapsed { max-height: 0 !important; opacity:0; padding-top:0; padding-bottom:0; }
  .player-card { background: var(--panel); border: 1px solid var(--border); border-radius: 10px; padding: 9px; }
  .player-card.active { border-color: var(--accent); box-shadow: 0 0 0 2px rgba(255,102,204,.2); }
  .player-card.you { outline:1px dashed var(--gold); }
  .player-card .pn { font-weight: 700; font-size:13px; display:flex; justify-content:space-between; align-items:center; margin-bottom:5px; }
  .player-card .pn .tag { font-size:10px; padding:1px 6px; border-radius:5px; background:var(--accent); color:#fff; }
  .player-card.you .pn::before { content:"你"; background:var(--gold); color:#000; font-size:9px; padding:1px 5px; border-radius:4px; font-weight:700; margin-right:4px; }
  .dims { display:grid; grid-template-columns: auto 1fr auto; gap:2px 6px; align-items:center; font-size:11px; }
  .dims .lbl { color:var(--muted); min-width:48px; }
  .bar { height:5px; background:var(--bg2); border-radius:3px; overflow:hidden; }
  .bar > i { display:block; height:100%; background:linear-gradient(90deg,var(--accent2),var(--accent)); }
  .dims .val { color:var(--gold); font-weight:700; min-width:22px; text-align:right; font-size:11px; }
  .mini-status { font-size:10px; color:var(--muted); margin-top:5px; line-height:1.6; }
  .mini-status .badge { display:inline-block; padding:1px 5px; border-radius:4px; background:var(--panel2); margin-right:3px; }
  .badge.good { background:#1d8a5a; color:#fff; }
  .badge.bad { background:#b33838; color:#fff; }
  .badge.gold { background:var(--gold); color:#000; font-weight:700; }
  .mychart { display:grid; grid-template-columns:repeat(5,1fr); gap:6px; }
  .dim-box { background:var(--panel2); border-radius:7px; padding:6px 4px; text-align:center; }
  .dim-box .nm { font-size:10px; color:var(--muted); }
  .dim-box .num { font-size:18px; font-weight:700; color:var(--gold); line-height:1.2; }
  .dim-box .w { font-size:9px; color:var(--muted); }
  .hand-scroll {
    display:flex; gap:8px; overflow-x:auto; overflow-y:hidden;
    -webkit-overflow-scrolling:touch; padding-bottom:4px;
    scroll-snap-type:x mandatory;
  }
  .hand-scroll::-webkit-scrollbar { height:6px; }
  .hand-scroll::-webkit-scrollbar-thumb { background:var(--accent); border-radius:3px; }
  .card {
    background:linear-gradient(160deg,var(--panel2),var(--panel)); border:1px solid var(--border);
    border-radius:9px; padding:8px; transition:.15s; position:relative; flex:0 0 150px;
    min-height:170px; display:flex; flex-direction:column; scroll-snap-align:start;
  }
  .card.character { border-top:3px solid var(--accent); }
  .card.event { border-top:3px solid var(--gold); }
  .card.skill { border-top:3px solid var(--accent2); }
  .card.back { background:linear-gradient(135deg,var(--panel),var(--panel2)); display:flex; align-items:center; justify-content:center; min-height:180px; }
  .card.back .backsym { font-size:28px; color:var(--accent); opacity:.7; font-weight:900; }
  .card .ctype { font-size:9px; color:var(--muted); text-transform:uppercase; letter-spacing:1px; }
  .card .cname { font-weight:700; font-size:13px; margin:2px 0 3px; color:var(--accent2); }
  .card.event .cname { color:var(--gold); }
  .card.skill .cname { color:var(--accent2); }
  .card .cdesc { font-size:10px; color:var(--muted); line-height:1.35; flex:1; }
  .card .stats { display:grid; grid-template-columns:1fr auto; gap:1px 5px; font-size:9.5px; margin-top:5px; }
  .card .stats .s-lbl { color:var(--muted); }
  .card .stats .s-val { color:var(--gold); font-weight:700; }
  .card .playbtn { margin-top:5px; font-size:11.5px; padding:5px; background:var(--accent); color:#fff; border:none; border-radius:5px; cursor:pointer; font-weight:700; width:100%; }
  .card.event .playbtn { background:var(--gold); color:#000; }
  .card.skill .playbtn { background:var(--accent2); color:#000; }
  .card .playbtn:disabled { filter: grayscale(.7) brightness(.6); cursor:not-allowed; }
  .card.owned::after { content:"已拥有"; position:absolute; top:6px; right:6px; font-size:8.5px; background:var(--good); color:#000; padding:1px 4px; border-radius:4px; }
  .card .rarity { position:absolute; top:6px; left:6px; font-size:9px; padding:1px 5px; border-radius:4px; font-weight:700; }
  .rarity.S { background:linear-gradient(135deg,#ffd54a,#ff88cc); color:#000; }
  .rarity.A { background:linear-gradient(135deg,#a48cff,#66e0ff); color:#000; }
  .rarity.B { background:linear-gradient(135deg,#6ee7a8,#66e0ff); color:#000; }
  .rarity.C { background:var(--panel2); color:var(--muted); }
  .card .price { position:absolute; top:6px; right:6px; font-size:10px; background:var(--gold); color:#000; padding:1px 6px; border-radius:4px; font-weight:700; }
  .abilities { display:flex; flex-wrap:wrap; gap:6px; }
  .ability {
    background:var(--panel2); border:1px solid var(--border); border-radius:7px; padding:7px 10px;
    font-size:11.5px; flex:1 1 220px; transition:.15s;
  }
  .ability.disabled { opacity:.5; }
  .ability.ready { border-color:var(--good); }
  .ability .an { font-weight:700; color:var(--accent2); font-size:12px; }
  .ability .ameta { font-size:10px; color:var(--muted); margin-top:2px; line-height:1.4; }
  .ability .ready-tag { color:var(--good); font-weight:700; }
  .ability .ability-btn { margin-top:5px; width:100%; font-size:11px; padding:5px; background:linear-gradient(135deg,var(--accent2),#3a9ed0); color:#fff; border:none; border-radius:5px; cursor:pointer; font-weight:700; }
  .ability.ready .ability-btn { background:linear-gradient(135deg,var(--good),#2eb87a); }
  .ability.disabled .ability-btn { background:var(--panel2); color:var(--muted); cursor:not-allowed; }
  .log { max-height:140px; overflow-y:auto; font-size:11.5px; line-height:1.55; color:var(--muted); -webkit-overflow-scrolling:touch; }
  .log .li { padding:2px 0; border-bottom:1px solid rgba(255,255,255,.04); }
  .log .li.me { color:var(--accent2); }
  .log .li.sys { color:var(--gold); }
  .overlay { position:fixed; inset:0; background:rgba(8,4,20,.97); display:flex; align-items:center; justify-content:center; z-index:50; flex-direction:column; padding:20px; }
  .overlay .big { font-size:24px; font-weight:700; background:linear-gradient(90deg,var(--accent),var(--accent2)); -webkit-background-clip:text; background-clip:text; color:transparent; margin-bottom:8px; text-align:center; }
  .overlay .hint { color:var(--muted); margin-bottom:22px; text-align:center; font-size:13px; }
  .overlay .ovbtn { padding:14px 32px; font-size:16px; font-weight:700; background:linear-gradient(135deg,var(--accent),var(--accent2)); color:#fff; border:none; border-radius:10px; cursor:pointer; }
  .waitbanner {
    position:fixed; left:0; right:0; top:50%; transform:translateY(-50%); z-index:40;
    background:rgba(34,22,71,.95); backdrop-filter:blur(8px); border-top:2px solid var(--accent); border-bottom:2px solid var(--accent);
    padding:16px; text-align:center; pointer-events:none;
  }
  .waitbanner .big { font-size:16px; color:var(--accent); font-weight:700; }
  .waitbanner .sm { font-size:12px; color:var(--muted); margin-top:4px; }
  .modal { position:fixed; inset:0; background:rgba(0,0,0,.75); display:flex; align-items:center; justify-content:center; z-index:60; padding:12px; }
  .modal .box { background:var(--panel); border:1px solid var(--border); border-radius:12px; padding:18px; max-width:440px; width:100%; max-height:85vh; overflow-y:auto; }
  .modal .box h3 { color:var(--accent2); margin-bottom:6px; font-size:15px; }
  .modal .box p { color:var(--muted); margin-bottom:12px; font-size:12.5px; line-height:1.6; }
  .modal .targets { display:flex; flex-direction:column; gap:6px; }
  .modal .tgt { padding:10px; background:var(--panel2); border:1px solid var(--border); border-radius:7px; cursor:pointer; transition:.15s; }
  .modal .tgt:hover { border-color:var(--accent); }
  .modal .tgt .tn { font-weight:700; font-size:13px; }
  .modal .tgt .ts { font-size:10.5px; color:var(--muted); }
  .modal .choices { display:flex; gap:6px; margin-top:10px; flex-wrap:wrap; }
  .modal .choices .btn { flex:1; min-width:80px; }
  .ranking { display:flex; flex-direction:column; gap:6px; margin:12px 0; }
  .rank-row { display:flex; align-items:center; gap:10px; padding:10px; background:var(--panel2); border-radius:9px; border:1px solid var(--border); }
  .rank-row.first { border-color:var(--gold); background:linear-gradient(135deg,rgba(255,213,74,.15),var(--panel2)); }
  .rank-row .pos { font-size:20px; font-weight:700; color:var(--gold); width:28px; }
  .rank-row.you { outline:1px dashed var(--accent2); }
  .rank-row .pn { flex:1; font-weight:700; font-size:13px; }
  .rank-row .sc { font-size:18px; font-weight:700; color:var(--accent); }
  .detail-grid { display:grid; grid-template-columns:auto 1fr auto auto; gap:5px 8px; font-size:11px; margin-top:8px; }
  .actionbar { position:sticky; bottom:0; z-index:15; display:flex; gap:6px; justify-content:flex-end; padding:10px 6px; background:linear-gradient(180deg,transparent,var(--bg) 40%); }
  .shop-grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(150px,1fr)); gap:8px; }
  .shop-card { position:relative; }
  .shop-summary { background:var(--bg2); border-radius:8px; padding:8px; font-size:11px; color:var(--muted); margin-bottom:8px; }
  .spectator-banner { background:rgba(255,213,74,.1); border:1px solid var(--gold); color:var(--gold); padding:10px; border-radius:8px; text-align:center; font-size:12px; margin-bottom:10px; }
  @media (max-width: 640px) {
    body { font-size:13px; padding-top:4px; }
    .wrap { padding:6px; }
    .topbar { gap:5px; padding:7px 9px; font-size:12px; border-radius:10px; margin-bottom:7px; }
    .topbar .round { font-size:12px; }
    .topbar .btn { padding:6px 10px; font-size:11.5px; }
    .topbar .deck { display:none; }
    .topbar .cur { order:3; width:100%; padding-top:3px; border-top:1px dashed var(--border); margin-top:3px; }
    .layout { grid-template-columns:1fr; gap:7px; }
    .side { order:2; gap:6px; }
    .main { order:1; gap:7px; }
    .panel { padding:9px; border-radius:10px; }
    .opponents-panel h2 { font-size:14px; }
    .player-card { padding:7px 9px; border-radius:8px; }
    .player-card .pn { font-size:12.5px; }
    .dims { font-size:10.5px; gap:2px 5px; }
    .dims .lbl { min-width:42px; font-size:10px; }
    .dims .val { font-size:10.5px; }
    .bar { height:4px; }
    .mychart { grid-template-columns:repeat(5,1fr); gap:4px; }
    .dim-box { padding:5px 2px; border-radius:6px; }
    .dim-box .nm { font-size:9px; }
    .dim-box .num { font-size:15px; }
    .dim-box .w { display:none; }
    .hand-scroll { gap:6px; }
    .card { flex:0 0 128px; min-height:170px; padding:7px; }
    .card .cname { font-size:12px; }
    .card .cdesc { font-size:9.5px; }
    .card .stats { font-size:9px; }
    .card .playbtn { padding:5px; font-size:11px; }
    .abilities { gap:5px; }
    .ability { flex:1 1 100%; padding:6px 8px; }
    .ability .an { font-size:11.5px; }
    .ability .ameta { font-size:9.5px; }
    .log { max-height:90px; }
    .rules { font-size:11px; line-height:1.55; padding:10px; }
    .setup { margin:10px auto; padding:16px; border-radius:14px; }
    .setup h1 { font-size:20px; }
    .room-info .code { font-size:20px; letter-spacing:6px; }
    .actionbar { padding:8px 4px; }
    .btn-primary { padding:12px; font-size:14px; }
    .overlay .big { font-size:20px; }
    .overlay .ovbtn { padding:12px 28px; font-size:15px; }
  }
  @media (max-width: 380px) {
    .card { flex:0 0 110px; min-height:175px; }
    .dims .lbl { min-width:38px; font-size:9.5px; }
  }
</style>
</head>
<body>
<div class="wrap" id="app"></div>

<script>
/* ============================================================
   谱师卡牌 v3 · 新策划：卡牌购买/6角色/事件+技能/评分/观战
   联机: WebRTC P2P + 局域网 WebSocket/BroadcastChannel（保留）
   ============================================================ */

// ---------- 角色卡牌数据 ----------
const RARITY = {
  S: { label:'S级', price:5, cls:'S' },
  APlus: { label:'A+级', price:4, cls:'A' },
  A: { label:'A级', price:3, cls:'A' },
  B: { label:'B级', price:2, cls:'B' },
  C: { label:'C级', price:1, cls:'C' },
};

const CHARACTERS = [
  {
    id:'ftayo', name:'Ftayo', rarity:'S',
    stats:{config:8,abstract:10,concrete:10,innovation:10,selection:10,effort:12},
    ability:{
      name:'Ascension to Heaven',
      desc:'谱面质量提升至全场最高。每5回合发动1次，最多3次，只能在回合≤总回合×0.7时发动。',
      cooldown:5, maxUses:3, roundLimit:0.7
    }
  },
  {
    id:'summercube', name:'Summercube', rarity:'APlus',
    stats:{config:5,abstract:10,concrete:10,innovation:8,selection:8,effort:10},
    ability:{
      name:'配置转具象',
      desc:'每3回合发动1次，1点配置换5点具象动画。',
      cooldown:3
    }
  },
  {
    id:'sulfur', name:'SulfurDXD', rarity:'APlus',
    stats:{config:7,abstract:10,concrete:10,innovation:8,selection:8,effort:10},
    ability:{
      name:'动效分配',
      desc:'每3回合发动1次，自行分配4点动效水平（具象或抽象）。',
      cooldown:3
    }
  },
  {
    id:'jinye', name:'金叶', rarity:'A',
    stats:{config:6,abstract:9,concrete:8,innovation:6,selection:6,effort:9},
    ability:{
      name:'Testify',
      desc:'每2回合发动1次，抽象表演+4点。20%概率触发Testify AT17，抽象-2点。',
      cooldown:2
    }
  },
  {
    id:'ruishi', name:'瑞矢级别大', rarity:'A',
    stats:{config:9,abstract:8,concrete:8,innovation:5,selection:8,effort:9},
    ability:{
      name:'补短板',
      desc:'每2回合发动1次，抽象与配置提升至自身最高一项。',
      cooldown:2
    }
  },
  {
    id:'dagezi', name:'大鸽子喵喵喵', rarity:'C',
    stats:{config:3,abstract:3,concrete:3,innovation:3,selection:3,effort:3},
    ability:{
      name:'评议之灵',
      desc:'每回合发动，所有维度降至最低，但获得玩家声誉（每次+1点，5点封顶）。',
      cooldown:1
    }
  }
];

// ---------- 事件牌（强制触发） ----------
const EVENT_CARDS = [
  { id:'mianji', name:'面基', desc:'80%概率所有维度+1；20%概率3回合不能发动角色技能。' },
  { id:'zhaoan', name:'招安', desc:'最强角色被招安，获得5点声誉，但该角色永久禁用技能。' },
  { id:'tuikeng', name:'退坑', desc:'所有点数定格（不再变化）。' },
];

// ---------- 技能牌（可选择打出） ----------
const SKILL_CARDS = [
  { id:'pingyi', name:'评议', desc:'成为评议2回合，每回合可给1名玩家送绿票/红票。' },
  { id:'yuegao', name:'约稿', desc:'选曲变为全场平均数，额外获得1张技能牌，[剩余×0.7]回合后锁定。' },
  { id:'yinshui', name:'饮水', desc:'指定玩家下回合不能发动技能。' },
  { id:'fge', name:'F鸽', desc:'故事板谱面，结算时+5分。' },
];

const DIM_NAMES = ['selection','config','concrete','abstract','innovation'];
const DIM_LABELS = {selection:'选曲品味',config:'配置水平',concrete:'具象动效',abstract:'抽象动效',innovation:'创新程度'};
const DIM_WEIGHTS = {selection:0.05,config:0.40,concrete:0.20,abstract:0.20,innovation:0.15};

// ---------- UI 状态 ----------
const ui = {
  mode: 'local',
  room: { code:null, isHost:false, myId:null, playerCount:2, channel:null, members:[] },
  collapsed: { opponents:false, chart:false, abilities:false, log:false },
  transport: {
    mode: 'auto',
    wsBase: null,
    status: 'idle',
    lastError: null,
    retryCount: 0,
    netMode: 'lan',
    webrtc: null,
  },
};

// ---------- 游戏状态 ----------
let state = null;

function createInitialState(numPlayers, totalRounds, playerNames){
  return {
    phase:'setup',       // setup | shop | first_turn | turn | handoff | gameover | spectating
    numPlayers,
    totalRounds,
    currentRound:0,      // 0 = 购买阶段；1..N 为正式回合
    currentPlayerIdx:0,
    turnStart:false,
    hasDrawn:false,
    firstCharPlayed:false, // 第一轮是否已打出角色牌
    players:playerNames.map((n,i)=>({
      id:i, name:n||`玩家${i+1}`,
      hand:[],           // 手牌：事件牌/技能牌
      charsOwned:[],     // 已购买的角色卡实例
      chart:{selection:0,config:0,concrete:0,abstract:0,innovation:0},
      funds:10,
      reputation:0,
      storyboard:false,
      scoreFrozen:false, // 退坑 or 约稿锁定
      lockInTurns:0,
      noSkillTurns:0,
      reviewerTurns:0,
      extraDrawNext:0,
      effortTotal:0,
      skipBuy:false,     // 首轮是否已购买
    })),
    deck:[],
    discard:[],
    log:[],
    pendingModal:null,
    seq:0,
    // 观战相关
    startedAt:0,
  };
}

// ---------- 工具函数 ----------
function shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}

function drawFromDeck(){
  if(!state.deck.length){
    if(!state.discard.length) return null;
    state.deck = shuffle(state.discard.splice(0));
    log('牌堆耗尽，弃牌堆已洗回。','sys');
  }
  return state.deck.pop();
}

function log(msg, cls=''){state.log.push({msg,cls}); if(state.log.length>100) state.log.shift();}

function currentPlayer(){return state.players[state.currentPlayerIdx];}

function computeScore(p){
  if(p.scoreFrozen && !p._frozenScore){
    let s = 0;
    DIM_NAMES.forEach(d => s += p.chart[d] * DIM_WEIGHTS[d]);
    s += p.reputation;
    s += p.effortTotal * 0.5;
    if(p.storyboard) s += 5;
    p._frozenScore = s;
  }
  if(p.scoreFrozen) return p._frozenScore;
  let s = 0;
  DIM_NAMES.forEach(d => s += p.chart[d] * DIM_WEIGHTS[d]);
  s += p.reputation;
  s += p.effortTotal * 0.5;
  if(p.storyboard) s += 5;
  return s;
}

function buyCharacter(playerIdx, charId){
  const p = state.players[playerIdx];
  const ch = CHARACTERS.find(c => c.id === charId);
  if(!ch) return {ok:false, reason:'卡牌不存在'};
  const price = RARITY[ch.rarity].price;
  if(p.funds < price) return {ok:false, reason:'资金不足'};
  p.funds -= price;
  p.charsOwned.push({
    id:ch.id, name:ch.name, rarity:ch.rarity,
    cooldownLeft:0, usesLeft: ch.ability.maxUses || -1,
    recruited:false, ability:ch.ability, stats:ch.stats,
  });
  log(`${p.name} 购买了 ${ch.name}（-${price}点）。`,'me');
  return {ok:true};
}

function getCardPrice(charId){
  const ch = CHARACTERS.find(c=>c.id===charId);
  if(!ch) return 0;
  return RARITY[ch.rarity].price;
}

function drawSkillCard(){
  const pool = [...EVENT_CARDS, ...SKILL_CARDS];
  const pick = pool[Math.floor(Math.random()*pool.length)];
  return {...pick, uid: Math.random().toString(36).slice(2)};
}

// 给玩家发放初始3张牌
function dealInitialHand(p){
  p.hand = [];
  for(let i=0;i<3;i++) p.hand.push(drawSkillCard());
}

// ---------- 游戏流程 ----------
function startGame(numPlayers, totalRounds, names){
  state = createInitialState(numPlayers, totalRounds, names);
  state.phase = 'shop';
  state.startedAt = Date.now();
  state.players.forEach(p => dealInitialHand(p));
  log(`游戏开始！共${totalRounds}回合，${numPlayers}名玩家。初始资金 10 点。`,'sys');
  if(ui.mode==='room' && ui.room.isHost){
    roomBroadcast({type:'host_start_game', state:JSON.stringify(state)});
  }
}

// ---------- 购买阶段 ----------
function finishShopPhase(){
  populateCharHandsAfterShop();
  state.currentRound = 1;
  state.phase = 'first_turn';
  state.currentPlayerIdx = 0;
  state.turnStart = false;
  state.hasDrawn = false;
  state.firstCharPlayed = false;
  log('购买阶段结束。进入第 1 回合：必须打出 1 张角色牌。','sys');
}

// ---------- 摸牌 ----------
function doDraw(extra){
  if(state.hasDrawn && !extra) return {ok:false};
  const p = currentPlayer();
  // 事件/技能牌从统一池抽取
  const card = drawSkillCard();
  p.hand.push(card);
  if(!extra) state.hasDrawn = true;
  log(`${p.name} 摸到一张 ${card.name}。`, 'me');
  return {ok:true};
}

// ---------- 回合开始 ----------
function beginTurnInternal(idx){
  state.phase = 'turn';
  state.turnStart = true;
  state.hasDrawn = false;
  const p = state.players[idx];
  // 应用每回合减少的状态
  if(p.extraDrawNext>0){ p.extraDrawNext--; doDraw(true); }
  if(p.lockInTurns>0){
    p.lockInTurns--;
    if(p.lockInTurns===0 && !p.scoreFrozen){
      p.scoreFrozen = true;
      log(`${p.name} 的约稿谱面已永久锁定（退坑）。`,'sys');
    }
  }
  // 大鸽子每回合自动发动
  p.charsOwned.forEach(c => {
    if(c.id==='dagezi' && !c.recruited && c.cooldownLeft<=0 && (c.usesLeft!==0)){
      // 自动触发
      autoActivateDagezi(idx, c);
    }
  });
}

function autoActivateDagezi(idx, ch){
  const p = state.players[idx];
  const mn = Math.min(...DIM_NAMES.map(d=>p.chart[d]));
  DIM_NAMES.forEach(d => p.chart[d] = mn);
  if(p.reputation < 5){
    p.reputation += 1;
    log(`${p.name} 的「评议之灵」自动发动：所有维度降至 ${mn}，+1 声誉（=${p.reputation}）。`,'me');
  } else {
    log(`${p.name} 的「评议之灵」：声誉已满 5，仅降维。`,'sys');
  }
  ch.cooldownLeft = ch.ability.cooldown;
  if(ch.usesLeft>0) ch.usesLeft--;
}

// ---------- 打出角色牌 ----------
function playCharacter(idx, charId){
  const p = state.players[idx];
  const charInst = p.charsOwned.find(c => c.id === charId);
  if(!charInst) return {ok:false, reason:'未拥有该角色'};
  if(charInst.recruited) return {ok:false, reason:'该角色已被招安'};
  if(p.scoreFrozen){ log('谱面已锁定（退坑），无法打出角色牌。','sys'); return {ok:false}; }
  const ch = CHARACTERS.find(c=>c.id===charId);

  // 累加到谱面
  p.chart.config += ch.stats.config;
  p.chart.concrete += ch.stats.concrete;
  p.chart.abstract += ch.stats.abstract;
  p.chart.innovation += ch.stats.innovation;
  // 第1回合用角色牌的选曲决定选曲品味
  if(state.currentRound===1 && !state.firstCharPlayed){
    p.chart.selection += ch.stats.selection;
    state.firstCharPlayed = true;
  } else {
    p.chart.selection += Math.floor(ch.stats.selection / 2);
  }
  p.effortTotal += ch.stats.effort;
  // 记录已解锁（如果已存在该角色实例，继续累加但不重复解锁技能）
  const existing = p.charsOwned.find(c => c.id === charId && c !== charInst);
  log(`${p.name} 打出角色牌「${ch.name}」，累加属性。`,'me');
  return {ok:true};
}

// ---------- 打出事件/技能牌 ----------
function playCard(idx, handIdx, extra){
  const p = state.players[idx];
  const card = p.hand[handIdx];
  if(!card) return {ok:false};
  if(card.type === 'character') return playCharacter(idx, card.id);

  if(card.id === 'mianji'){
    if(p.scoreFrozen){ log('谱面已锁定。','sys'); return {ok:false}; }
    const luck = Math.random();
    if(luck < 0.8){
      DIM_NAMES.forEach(d => p.chart[d] += 1);
      log(`${p.name} 面基：所有维度+1。`,'me');
    } else {
      p.noSkillTurns = Math.max(p.noSkillTurns, 3);
      log(`${p.name} 面基：3回合无法发动技能！`,'sys');
    }
    p.hand.splice(handIdx,1);
    state.discard.push(card);
    return {ok:true};
  }

  if(card.id === 'zhaoan'){
    if(p.charsOwned.length===0){ log('你没有角色牌可被招安。','sys'); return {ok:false}; }
    let best = null, bestSum = -1;
    p.charsOwned.forEach(c => {
      if(c.recruited) return;
      const s = c.stats.config + c.stats.abstract + c.stats.concrete + c.stats.innovation + c.stats.selection;
      if(s > bestSum){ bestSum = s; best = c; }
    });
    if(!best){ log('没有可被招安的角色。','sys'); return {ok:false}; }
    best.recruited = true;
    p.reputation += 5;
    p.hand.splice(handIdx,1);
    state.discard.push(card);
    log(`${p.name} 触发招安：「${best.name}」被招安，获得5点声誉，其技能永久失效。`,'me');
    return {ok:true};
  }

  if(card.id === 'tuikeng'){
    p.scoreFrozen = true;
    p.hand.splice(handIdx,1);
    state.discard.push(card);
    log(`${p.name} 退坑！谱面点数定格，不再变化。`,'sys');
    return {ok:true};
  }

  if(card.id === 'pingyi'){
    if(p.scoreFrozen){ log('谱面已锁定。','sys'); return {ok:false}; }
    p.reviewerTurns = 2;
    p.hand.splice(handIdx,1);
    state.discard.push(card);
    log(`${p.name} 成为评议（2回合），每回合可送绿票/红票。`,'me');
    return {ok:true};
  }

  if(card.id === 'yuegao'){
    if(p.scoreFrozen){ log('谱面已锁定。','sys'); return {ok:false}; }
    const avgSel = state.players.reduce((s,x)=>s+x.chart.selection,0)/state.players.length;
    p.chart.selection = Math.round(avgSel);
    // 剩余回合 × 0.7
    const remaining = state.totalRounds - state.currentRound;
    p.lockInTurns = Math.max(1, Math.floor(remaining * 0.7));
    const sc = drawSkillCard();
    p.hand.push(sc);
    p.hand.splice(handIdx,1);
    state.discard.push(card);
    log(`${p.name} 触发约稿：选曲=${Math.round(avgSel)}（平均），额外摸1技能牌，${p.lockInTurns}回合后锁定。`,'me');
    return {ok:true};
  }

  if(card.id === 'yinshui'){
    if(extra && extra.targetIdx !== undefined){
      const t = state.players[extra.targetIdx];
      if(!t) return {ok:false};
      t.noSkillTurns = Math.max(t.noSkillTurns, 1);
      log(`${p.name} 对 ${t.name} 使用饮水：下回合无法发动技能。`,'me');
      p.hand.splice(handIdx,1);
      state.discard.push(card);
      return {ok:true};
    }
    return {ok:false, needModal:{type:'target', card, handIdx, title:'饮水 - 选择目标', hint:'使目标下回合不可发动技能', action:'play_yinshui', playerIdx:idx}};
  }

  if(card.id === 'fge'){
    p.storyboard = true;
    p.hand.splice(handIdx,1);
    state.discard.push(card);
    log(`${p.name} 触发F鸽：故事板谱面，结算+5分。`,'me');
    return {ok:true};
  }

  return {ok:false};
}

// ---------- 评议 ----------
function useReview(idx, targetIdx, ticket){
  const p = state.players[idx];
  if(p.reviewerTurns<=0) return {ok:false};
  const t = state.players[targetIdx];
  if(!t) return {ok:false};
  if(ticket==='red'){
    if(!t.scoreFrozen) t.chart.config += 10;
    t.noSkillTurns = Math.max(t.noSkillTurns, 3);
    log(`${p.name} 评议 ${t.name}：红票（配置+10，3回合禁技能）。`,'me');
  } else {
    t.extraDrawNext += 1;
    log(`${p.name} 评议 ${t.name}：绿票（下回合额外摸1张牌）。`,'me');
  }
  p.reviewerTurns -= 1;
  return {ok:true};
}

// ---------- 发动角色技能 ----------
function activateAbility(idx, charId, extra){
  const p = state.players[idx];
  const ch = p.charsOwned.find(c => c.id === charId);
  if(!ch) return {ok:false};
  if(ch.recruited){ log(`${ch.name} 已被招安，技能失效。`,'sys'); return {ok:false}; }
  if(p.noSkillTurns>0){ log(`禁用技能（剩${p.noSkillTurns}回合）。`,'sys'); return {ok:false}; }
  if(ch.cooldownLeft>0){ log(`${ch.name} 冷却 ${ch.cooldownLeft} 回合。`,'sys'); return {ok:false}; }
  if(ch.usesLeft===0){ log(`${ch.name} 次数用尽。`,'sys'); return {ok:false}; }
  if(p.scoreFrozen){ log('谱面已锁定。','sys'); return {ok:false}; }

  // Round limit for Ftayo
  if(ch.ability.roundLimit){
    if(state.currentRound > Math.floor(state.totalRounds * ch.ability.roundLimit)){
      log(`${ch.name} 仅可在回合≤总回合×${ch.ability.roundLimit}时发动。`,'sys');
      return {ok:false};
    }
  }

  switch(ch.id){
    case 'ftayo': {
      DIM_NAMES.forEach(d=>{
        const mx = Math.max(...state.players.map(x=>x.chart[d]));
        if(mx > p.chart[d]) p.chart[d] = mx;
      });
      log(`${p.name} 发动「Ascension to Heaven」：谱面质量提升至全场最高！`,'me');
      break;
    }
    case 'summercube': {
      if(p.chart.config < 1){ log('配置水平不足1点。','sys'); return {ok:false}; }
      p.chart.config -= 1;
      p.chart.concrete += 5;
      log(`${p.name} 发动「配置转具象」：-1配置，+5具象。`,'me');
      break;
    }
    case 'sulfur': {
      if(extra===undefined || extra.toConcrete===undefined){
        return {ok:false, needModal:{type:'sulfur', charId, title:'动效分配 - 分配4点', action:'sulfur', playerIdx:idx}};
      }
      if(extra.toConcrete) p.chart.concrete += 4; else p.chart.abstract += 4;
      log(`${p.name} 发动「动效分配」：+4${extra.toConcrete?'具象':'抽象'}。`,'me');
      break;
    }
    case 'jinye': {
      if(Math.random() < 0.2){
        p.chart.abstract -= 2;
        log(`${p.name} 触发 Testify AT17：抽象-2！`,'sys');
      } else {
        p.chart.abstract += 4;
        log(`${p.name} 发动「Testify」：+4抽象。`,'me');
      }
      break;
    }
    case 'ruishi': {
      const mx = Math.max(...DIM_NAMES.map(d=>p.chart[d]));
      p.chart.abstract = Math.max(p.chart.abstract, mx);
      p.chart.config = Math.max(p.chart.config, mx);
      log(`${p.name} 发动「补短板」：抽象与配置提升至 ${mx}。`,'me');
      break;
    }
    case 'dagezi': {
      // 手动发动（每回合自动已处理，这里允许主动再发一次也可）
      autoActivateDagezi(idx, ch);
      break;
    }
  }
  ch.cooldownLeft = ch.ability.cooldown;
  if(ch.usesLeft>0) ch.usesLeft--;
  return {ok:true};
}

// ---------- 结束回合 ----------
function endTurnInternal(idx){
  const p = state.players[idx];
  // 第一轮必须打出1张角色牌
  if(state.currentRound===1 && !state.firstCharPlayed){
    log('第1回合必须打出一张角色牌！','sys'); return {ok:false};
  }
  if(!state.hasDrawn) doDraw();
  // 冷却与状态递减
  p.charsOwned.forEach(c => { if(c.cooldownLeft>0) c.cooldownLeft--; });
  if(p.noSkillTurns>0) p.noSkillTurns--;

  state.currentPlayerIdx = (state.currentPlayerIdx + 1) % state.numPlayers;
  if(state.currentPlayerIdx === 0){
    state.currentRound += 1;
    if(state.currentRound > state.totalRounds){ endGameInternal(); return {ok:true}; }
  }
  state.phase = (ui.mode==='local') ? 'handoff' : 'turn';
  state.turnStart = false;
  return {ok:true};
}

// ---------- 游戏结束 ----------
function endGameInternal(){
  state.phase = 'gameover';
  const ranked = state.players.map((p,i)=>({name:p.name, score:computeScore(p), idx:i, p})).sort((a,b)=>b.score-a.score);
  state.ranking = ranked;
  log('游戏结束！谱面综合评分已结算。','sys');
}

// ---------- 动作分发 ----------
function playerIndexBySender(byWho){
  if(byWho>=0) return byWho;
  if(ui.mode==='room'){
    const idx = ui.room.members.findIndex(m=>m.id===ui.room.myId);
    return byWho===-1 ? idx : ((idx+1)%state.numPlayers);
  }
  return state.currentPlayerIdx;
}

function canActAs(byWho, idx){
  if(state.phase !== 'turn' && state.phase !== 'first_turn' && state.phase !== 'shop' && state.phase !== 'handoff') return false;
  if(byWho === -1) return state.currentPlayerIdx === idx;
  if(byWho >= 0) return state.currentPlayerIdx === byWho;
  return false;
}

function dispatchAction(action, byWho, payload){
  if(!state) return {ok:false, reason:'no state'};
  const curIdx = state.currentPlayerIdx;

  switch(action){
    case 'shop_buy': {
      const idx = (byWho===-1)?curIdx:byWho;
      const p = state.players[idx];
      if(state.phase !== 'shop') return {ok:false};
      const r = buyCharacter(idx, payload.charId);
      if(r.ok) render();
      return r;
    }
    case 'shop_finish': {
      if(state.phase !== 'shop') return {ok:false};
      finishShopPhase();
      return {ok:true};
    }
    case 'draw': {
      if(state.phase!=='turn') return {ok:false};
      if(state.hasDrawn) return {ok:false, reason:'已摸牌'};
      const idx = (byWho===-1)?curIdx:byWho;
      if(!canActAs(byWho, idx)) return {ok:false, reason:'不是你的回合'};
      doDraw(false);
      return {ok:true};
    }
    case 'play_card': {
      const idx = (byWho===-1)?curIdx:byWho;
      if(state.phase!=='turn' && state.phase!=='first_turn') return {ok:false};
      if(!canActAs(byWho, idx)) return {ok:false, reason:'不是你的回合'};
      const p = state.players[idx];
      if(payload.byChar){
        return playCharacter(idx, payload.charId);
      }
      const card = p.hand[payload.handIdx];
      if(!card) return {ok:false};
      return playCard(idx, payload.handIdx, payload.extra);
    }
    case 'activate_ability': {
      const idx = (byWho===-1)?curIdx:byWho;
      if(state.phase!=='turn') return {ok:false};
      if(!canActAs(byWho, idx)) return {ok:false, reason:'不是你的回合'};
      return activateAbility(idx, payload.charId, payload.extra);
    }
    case 'use_review': {
      const idx = (byWho===-1)?curIdx:byWho;
      if(state.phase!=='turn') return {ok:false};
      if(!canActAs(byWho, idx)) return {ok:false, reason:'不是你的回合'};
      return useReview(idx, payload.targetIdx, payload.ticket);
    }
    case 'end_turn': {
      const idx = (byWho===-1)?curIdx:byWho;
      if(state.phase!=='turn' && state.phase!=='first_turn') return {ok:false};
      if(!canActAs(byWho, idx)) return {ok:false, reason:'不是你的回合'};
      return endTurnInternal(idx);
    }
    case 'begin_turn': {
      const idx = (byWho===-1)?curIdx:byWho;
      if(state.currentPlayerIdx !== idx) return {ok:false};
      beginTurnInternal(idx);
      return {ok:true};
    }
  }
  return {ok:false, reason:'unknown action'};
}

// ---------- 联机保留（原封不动） ----------
function resolveTransportMode(){
  const qs = new URLSearchParams(window.location.search || '');
  const hashQs = new URLSearchParams(window.location.hash.replace(/^#/,''));
  const raw = qs.get('ws') ?? hashQs.get('ws') ?? qs.get('transport') ?? null;
  const serverAddr = qs.get('server') || hashQs.get('server') || null;
  const bcOnly = qs.has('bc') || qs.get('transport') === 'bc' || raw === 'bc' || raw === '0';
  if (bcOnly) return { mode:'bc', wsBase:null };
  if (serverAddr) {
    let base = serverAddr;
    if (!/^wss?:\/\//i.test(base)) base = (window.location.protocol==='https:' ? 'wss://' : 'ws://') + base;
    return { mode:'ws', wsBase: base };
  }
  if (window.location.protocol === 'file:') return { mode:'bc', wsBase:null };
  const proto = (window.location.protocol==='https:') ? 'wss:' : 'ws:';
  const host = window.location.host;
  const defaultWsBase = `${proto}//${host}`;
  if (raw === null) return { mode:'ws', wsBase: defaultWsBase };
  let base = raw;
  if (raw === '1' || raw === 'auto' || raw === '' || raw === 'ws') base = defaultWsBase;
  if (base && !/^wss?:\/\//i.test(base)) base = `ws://${base}`;
  if (!base) return { mode:'bc', wsBase:null };
  return { mode:'ws', wsBase: base };
}

function createRoomChannel(code){
  let tm = resolveTransportMode();
  if (tm.mode === 'ws' && !tm.wsBase) { tm = { mode:'bc', wsBase:null }; }
  ui.transport.mode = tm.mode;
  ui.transport.wsBase = tm.wsBase;
  ui.transport.status = 'connecting';
  ui.transport.lastError = null;
  if (tm.mode === 'bc') {
    try {
      const bc = new BroadcastChannel(`puishi-card-${code}`);
      ui.transport.status = 'connected';
      return bc;
    } catch (e) { ui.transport.status='error'; ui.transport.lastError=e&&e.message; throw e; }
  }
  const wsBase = tm.wsBase || '';
  const url = (wsBase.replace(/\/$/, '')) + `/ws`;
  const ws = new WebSocket(url);
  let userHandler = null;
  let closed = false;
  let connectionTimeout = null;
  connectionTimeout = setTimeout(()=>{
    if(ws.readyState!==1){ ui.transport.status='error'; ui.transport.lastError='连接超时，请确认服务器已启动'; try{ws.close();}catch(_){} try{if(typeof onTransportStatusChange==='function')onTransportStatusChange();}catch(_){} }
  },10000);
  ws.addEventListener('open',()=>{
    if(connectionTimeout){clearTimeout(connectionTimeout);connectionTimeout=null;}
    ui.transport.status='connected'; ui.transport.retryCount=0;
    try{if(typeof onTransportStatusChange==='function')onTransportStatusChange();}catch(_){}
  });
  ws.addEventListener('error',()=>{
    if(connectionTimeout){clearTimeout(connectionTimeout);connectionTimeout=null;}
    ui.transport.status='error'; ui.transport.lastError='WebSocket 连接错误';
    try{if(typeof onTransportStatusChange==='function')onTransportStatusChange();}catch(_){}
  });
  ws.addEventListener('close',()=>{
    if(connectionTimeout){clearTimeout(connectionTimeout);connectionTimeout=null;}
    ui.transport.status = closed ? 'closed' : 'disconnected';
    try{if(typeof onTransportStatusChange==='function')onTransportStatusChange();}catch(_){}
  });
  ws.addEventListener('message',(ev)=>{
    if(!userHandler) return;
    try{const obj=JSON.parse(typeof ev.data==='string'?ev.data:''); userHandler({data:obj});}catch(_){}
  });
  const wrapper = {
    _url: url, _ws: ws,
    postMessage(msgObj){
      if(ws.readyState===0){
        return new Promise((resolve,reject)=>{
          const send=()=>{ if(ws.readyState===1){ws.send(JSON.stringify(msgObj));resolve();} else reject(new Error('WebSocket 连接失败')); };
          ws.addEventListener('open',send,{once:true}); ws.addEventListener('error',()=>reject(new Error('WebSocket 连接失败')),{once:true});
          setTimeout(()=>reject(new Error('发送超时')),5000);
        });
      } else if(ws.readyState===1){ ws.send(JSON.stringify(msgObj)); return Promise.resolve(); }
      else { ui.transport.status='error'; ui.transport.lastError='WebSocket 已断开'; return Promise.reject(new Error(ui.transport.lastError)); }
    },
    close(){ closed=true; if(connectionTimeout){clearTimeout(connectionTimeout);connectionTimeout=null;} try{ws.close();}catch(_){} },
    get onmessage(){return userHandler;},
    set onmessage(fn){ userHandler=fn; }
  };
  return wrapper;
}

function genRoomCode(){ return Math.random().toString(36).slice(2,7).toUpperCase(); }

function roomConnect(code, myName, intention){
  intention = intention || 'create';
  code = (code||'').toUpperCase().trim();
  const netMode = ui.transport.netMode || 'lan';
  if (netMode === 'webrtc') return roomConnectWebRTC(code, myName, intention);
  else return roomConnectLAN(code, myName, intention);
}

function roomConnectWebRTC(code, myName, intention) {
  return new Promise((resolve, reject) => {
    try {
      const myId = 'p_' + Math.random().toString(36).slice(2,8);
      ui.room.myId = myId;
      ui.room.code = code;
      ui.room.playerCount = ui.setupCache?.numPlayers || 2;
      const isHost = intention === 'create';
      const transport = new WebRTCTransport(code, isHost);
      ui.transport.webrtc = ui.transport.webrtc || {};
      ui.transport.webrtc.instance = transport;
      const pendingMessages = [];
      let realHandler = null;
      transport.userHandler = ({ data }) => {
        if (realHandler) realHandler({ data });
        else pendingMessages.push({ data });
      };
      ui.room.channel = {
        _webrtc: transport,
        postMessage(msg){ transport.broadcast(msg); },
        close(){ transport.close(); },
        get onmessage(){ return realHandler; },
        set onmessage(fn){
          realHandler = fn;
          while (pendingMessages.length > 0){ const msg = pendingMessages.shift(); fn(msg); }
        }
      };
      transport.connect().then(()=>{
        if(isHost){
          ui.room.isHost = true;
          ui.room.myName = myName;
          ui.room.members = [{id:myId, name:myName, ready:false, isHost:true}];
          resolve({joined:true, isHost:true, created:true});
        } else {
          return transport.joinAsClient('puishi-'+code+'-host', myName).then(()=>{
            ui.room.isHost = false;
            ui.room.myName = myName;
            resolve({joined:true, isHost:false});
          });
        }
      }).catch(err => { resolve({joined:false, reason: err.message || '连接失败'}); });
      setTimeout(()=>{
        if(ui.transport.webrtc.instance === transport && transport.status !== 'connected'){
          resolve({joined:false, reason:'WebRTC 连接超时(20秒)'});
        }
      },20000);
    } catch (err) { reject(err); }
  });
}

function roomConnectLAN(code, myName, intention){
  return new Promise((resolve, reject) => {
    try {
      const channel = createRoomChannel(code);
      ui.room.channel = channel;
      ui.room.code = code;
      ui.room.myId = 'p_' + Math.random().toString(36).slice(2,8);
      ui.room.playerCount = ui.setupCache?.numPlayers || 2;
      let done=false, electedHost=false, joinSent=false;
      let tOverall=null, tElect=null;
      if(channel._ws){
        const onWsErr = ()=>{
          const hint = intention==='join' ? 'WebSocket 连不上：确认服务器已启动' : 'WebSocket 连不上：请 npm start 启动服务器';
          finish({joined:false, reason:(ui.transport.lastError?ui.transport.lastError+' — ':'')+hint});
        };
        channel._ws.addEventListener('error', onWsErr);
        channel._ws.addEventListener('close', ()=>{ if(!done && ui.transport.status!=='connected') onWsErr(); });
      }
      const finish = (result)=>{
        if(done) return;
        done=true;
        if(tOverall){clearTimeout(tOverall);tOverall=null;}
        if(tElect){clearTimeout(tElect);tElect=null;}
        resolve(result);
      };
      const helloSettings = ()=>({
        numPlayers: ui.setupCache?.numPlayers || ui.room.playerCount || 2,
        totalRounds: ui.setupCache?.totalRounds || state?.totalRounds || 10
      });
      channel.onmessage = (e)=>{
        const m = e.data; if(!m||!m.type) return; if(m.roomCode && m.roomCode!==code) return;
        if(m.type==='presence'){
          if(electedHost || ui.room.isHost){
            channel.postMessage({type:'hello', roomCode:code, fromId:ui.room.myId, members:ui.room.members, settings:helloSettings()});
          }
          return;
        }
        if(m.type==='hello'){
          if(electedHost) return;
          if(m.fromId===ui.room.myId) return;
          if(tElect){clearTimeout(tElect);tElect=null;}
          ui.room.isHost = false;
          if(m.settings) updateLocalRoomSettings(m.settings);
          if(!joinSent){ joinSent=true; channel.postMessage({type:'join', roomCode:code, playerId:ui.room.myId, name:myName}); }
          const weIn = Array.isArray(m.members) && m.members.some(x=>x.id===ui.room.myId);
          if(weIn){ ui.room.members = m.members.slice(); finish({joined:true, isHost:false}); }
          return;
        }
        if(m.type==='join' && (electedHost||ui.room.isHost)){
          const capacity = (state&&state.numPlayers)||(ui.setupCache&&ui.setupCache.numPlayers)||ui.room.playerCount||2;
          if(!ui.room.members) ui.room.members=[];
          const exists = ui.room.members.find(x=>x.id===m.playerId);
          if(!exists && ui.room.members.length>=capacity){
            channel.postMessage({type:'kick', toId:m.playerId, fromId:ui.room.myId, reason:'房间已满('+capacity+'人)'}); return;
          }
          if(!exists) ui.room.members.push({id:m.playerId, name:m.name, ready:false, isHost:false});
          channel.postMessage({type:'hello', roomCode:code, fromId:ui.room.myId, members:ui.room.members, settings:helloSettings()});
          return;
        }
        if(m.type==='kick' && m.toId===ui.room.myId){
          finish({joined:false, reason:'被踢出: '+(m.reason||'')});
          try{channel.close();}catch(_){} ui.room.channel=null; return;
        }
      };
      tOverall = setTimeout(()=>{ if(!done){ finish({joined:false, reason:intention==='join'?'房间不存在或主机无响应(超时5s)':'加入超时(5秒无响应)'}); } }, 5000);
      tElect = setTimeout(()=>{ if(done) return; if(intention==='create' && !joinSent){ electedHost=true; ui.room.isHost=true; ui.room.members=[{id:ui.room.myId, name:myName, ready:false, isHost:true}]; finish({joined:true, isHost:true, created:true}); } }, 1200);
      channel.postMessage({type:'presence', roomCode:code});
      setTimeout(()=>{ if(!done) channel.postMessage({type:'presence', roomCode:code}); }, 180);
    } catch (err) { reject(err); }
  });
}

function roomBroadcast(msg){ if(ui.room.channel) ui.room.channel.postMessage({...msg, roomCode:ui.room.code, fromId:ui.room.myId}); }
function roomClose(){ if(ui.room.channel){try{ui.room.channel.close();}catch(e){}} ui.room.channel=null; ui.room.code=null; ui.room.isHost=false; ui.room.members=[]; }
function roomCapacity(){ return (state&&state.numPlayers)||(ui.setupCache&&ui.setupCache.numPlayers)||ui.room.playerCount||2; }
function roomTotalRounds(){ return (state&&state.totalRounds)||(ui.setupCache&&ui.setupCache.totalRounds)||10; }
function syncPlayerCountFromCache(){ if(ui.setupCache&&ui.setupCache.numPlayers) ui.room.playerCount=ui.setupCache.numPlayers; }

function installRoomHandlers(){
  if(!ui.room.channel) return;
  ui.room.channel.onmessage = (e)=>{
    const m = e.data; if(!m||!m.type) return;
    const isWebRTC = ui.room.channel._webrtc;
    if(isWebRTC){ if(m.roomCode && m.roomCode!==ui.room.code) return; }
    else { if(m.roomCode!==ui.room.code) return; }
    const fromMe = m.fromId===ui.room.myId;
    switch(m.type){
      case 'webrtc_member_update': ui.room.members=m.members||[]; render(); break;
      case 'webrtc_join':
        if(ui.room.isHost){
          syncPlayerCountFromCache();
          const cap=roomCapacity();
          const exists=ui.room.members.find(x=>x.id===m.playerId);
          if(!exists && ui.room.members.length>=cap){ roomBroadcast({type:'kick', toId:m.playerId, reason:'房间已满('+cap+'人)'}); render(); break; }
          if(!exists) ui.room.members.push({id:m.playerId, name:m.name, ready:false, isHost:false});
          roomBroadcast({type:'hello', members:ui.room.members, settings:{numPlayers:roomCapacity(),totalRounds:roomTotalRounds()}});
          render();
        }
        break;
      case 'presence':
        if(ui.room.isHost){ syncPlayerCountFromCache(); roomBroadcast({type:'hello', members:ui.room.members, settings:{numPlayers:roomCapacity(),totalRounds:roomTotalRounds()}}); }
        break;
      case 'hello':
        if(!ui.room.isHost){ ui.room.members=m.members; if(state===null){ updateLocalRoomSettings(m.settings||{}); if(m.settings&&m.settings.numPlayers) ui.room.playerCount=m.settings.numPlayers; } }
        render(); break;
      case 'join':
        if(ui.room.isHost){
          syncPlayerCountFromCache();
          const cap=roomCapacity();
          const exists=ui.room.members.find(x=>x.id===m.playerId);
          if(!exists && ui.room.members.length>=cap){ roomBroadcast({type:'kick', toId:m.playerId, reason:'房间已满('+cap+'人)'}); render(); break; }
          if(!exists) ui.room.members.push({id:m.playerId, name:m.name, ready:false, isHost:false});
          roomBroadcast({type:'hello', members:ui.room.members, settings:{numPlayers:roomCapacity(),totalRounds:roomTotalRounds()}});
          render();
        }
        break;
      case 'update_settings':
        if(!fromMe && state===null){ updateLocalRoomSettings(m.settings); if(m.settings&&m.settings.numPlayers) ui.room.playerCount=m.settings.numPlayers; render(); }
        break;
      case 'kick':
        if(m.toId===ui.room.myId){ alert('被踢出房间: '+(m.reason||'')); roomClose(); state={phase:'setup'}; ui.mode='room'; render(); }
        break;
      case 'leave':
        if(ui.room.isHost){ ui.room.members=ui.room.members.filter(x=>x.id!==m.playerId); roomBroadcast({type:'hello', members:ui.room.members, settings:{numPlayers:roomCapacity(),totalRounds:roomTotalRounds()}}); render(); }
        break;
      case 'host_start_game':
        if(!fromMe){ state=JSON.parse(m.state); installRoomHandlers(); render(); }
        break;
      case 'spectate_notice':
        if(!fromMe){ ui.spectatorNotice = true; render(); }
        break;
      case 'action':
        if(ui.room.isHost && state && !fromMe){
          if(state.seq===undefined) state.seq=0;
          if((m.seq||0) <= (state.lastSeq||0)) return;
          state.lastSeq = m.seq||0;
          const playerIdx = ui.room.members.findIndex(mm=>mm.id===m.fromId);
          const result = dispatchAction(m.action, playerIdx<0?-2:playerIdx, m.payload);
          if(result.ok){ state.seq++; roomBroadcast({type:'state_snapshot', state:serializeStateForClients(), seq:state.seq}); if(state.phase==='gameover') render(); }
        }
        break;
      case 'state_snapshot':
        if(!fromMe){ const newState=JSON.parse(m.state); state=newState; if(state.seq!==undefined) installRoomHandlers(); render(); }
        break;
    }
  };
}

function updateLocalRoomSettings(settings){
  if(!settings) return;
  if(!state){
    if(!ui.setupCache) ui.setupCache={numPlayers:settings.numPlayers||2,totalRounds:settings.totalRounds||10,names:[]};
    else { ui.setupCache.numPlayers=settings.numPlayers||ui.setupCache.numPlayers; ui.setupCache.totalRounds=settings.totalRounds||ui.setupCache.totalRounds; }
  }
}

function serializeStateForClients(){ return JSON.stringify(state); }

function sendAction(action, payload){
  if(ui.mode==='room' && !ui.room.isHost){
    if(state.seq===undefined) state.seq=0;
    const nextSeq = state.seq+1;
    roomBroadcast({type:'action', action, payload, seq:nextSeq});
    dispatchAction(action, -1, payload);
    state.seq = nextSeq;
    render();
    return;
  }
  const r = dispatchAction(action, -1, payload);
  if(r.ok && ui.mode==='room' && ui.room.isHost){
    state.seq = (state.seq||0)+1;
    roomBroadcast({type:'state_snapshot', state:serializeStateForClients(), seq:state.seq});
  }
  if(r && r.needModal){ state.pendingModal = r.needModal; }
  render();
}

// ---------- UI 渲染 ----------
function myPlayerIndex(){
  if(ui.mode!=='room') return state ? state.currentPlayerIdx : 0;
  const i = ui.room.members.findIndex(m=>m.id===ui.room.myId);
  return i>=0 ? i : 0;
}

function isMyTurn(){
  if(!state) return false;
  return state.phase==='handoff' || state.phase==='first_turn' || (state.phase==='turn' && state.currentPlayerIdx===myPlayerIndex());
}

function isPlayerHandMine(pidx){
  if(ui.mode!=='room') return true;
  return pidx === myPlayerIndex();
}

function render(){
  const app = document.getElementById('app');
  if(!state || state.phase==='setup'){ renderSetup(app); return; }
  if(state.phase==='gameover'){ renderGameOver(app); return; }
  if(state.phase==='shop'){ renderShop(app); return; }
  if(state.phase==='handoff'){
    if(ui.mode==='local'){ renderHandoff(app); return; }
    renderGame(app, true); return;
  }
  renderGame(app, false);
}

  const statusEl = app.querySelector('#room-status');
  const setStatus = (txt, isErr)=>{ if(statusEl){ statusEl.textContent=txt||''; statusEl.style.color=isErr?'#ff6b6b':'#a48cff'; } };
  const lockBtns = (lock, btn1, btn2)=>{ [btn1,btn2].forEach(b=>{ if(b){ b.disabled=lock; b.style.opacity=lock?0.5:1; b.style.cursor=lock?'wait':'pointer'; } }); };
  const netModeLanBtn = app.querySelector('#net-mode-lan');
  const netModeWebrtcBtn = app.querySelector('#net-mode-webrtc');
  if(netModeLanBtn) netModeLanBtn.onclick = ()=>{ ui.transport.netMode='lan'; render(); };
  if(netModeWebrtcBtn) netModeWebrtcBtn.onclick = ()=>{ ui.transport.netMode='webrtc'; render(); };
  const createBtn = app.querySelector('#create-btn');
  const joinBtn = app.querySelector('#join-btn');
  createBtn.onclick = async ()=>{
    ui.setupCache.names[0] = myInput.value.trim();
    const name = ui.setupCache.names[0] || '玩家1';
    const code = genRoomCode();
    lockBtns(true, createBtn, joinBtn);
    setStatus('正在创建房间...');
    try{
      const r = await roomConnect(code, name, 'create');
      installRoomHandlers();
      if(r.joined){ render(); }
      else { lockBtns(false, createBtn, joinBtn); setStatus('✗ 创建失败: '+(r.reason||''), true); }
    } catch(e){ lockBtns(false, createBtn, joinBtn); setStatus('✗ 创建失败: '+e.message, true); }
  };
  joinBtn.onclick = async ()=>{
    ui.setupCache.names[0] = myInput.value.trim();
    const name = ui.setupCache.names[0] || '玩家1';
    const code = app.querySelector('#join-code-input').value.trim().toUpperCase();
    if(code.length<4){ setStatus('✗ 请输入房间码(至少4位)', true); return; }
    lockBtns(true, createBtn, joinBtn);
    setStatus(`正在加入房间 ${code} ...`);
    try{
      const r = await roomConnect(code, name, 'join');
      installRoomHandlers();
      if(r.joined){ render(); }
      else { lockBtns(false, createBtn, joinBtn); setStatus('✗ 加入失败: '+(r.reason||''), true); }
    } catch(e){ lockBtns(false, createBtn, joinBtn); setStatus('✗ 加入失败: '+e.message, true); }
  };
}

function bindSetupCommon(app){
  app.querySelectorAll('.tabs button[data-mode]').forEach(b=>{

  const bReady = app.querySelector('#ready-turn-btn'); if(bReady) bReady.onclick = ()=>sendAction('begin_turn');
  app.querySelectorAll('[data-char]').forEach(el=>el.onclick=()=>onActivateAbilityClick(el.dataset.char));

function renderPlayerInner(p, isMe, isActive, canShowFull){
  return `
    <div class="pn">${p.name} ${isActive?'<span class="tag">本回合</span>':''}</div>
    <div class="dims">
      ${DIM_NAMES.map(d=>`<span class="lbl">${DIM_LABELS[d]}</span><span class="bar"><i style="width:${Math.min(100,p.chart[d]*1.8)}%"></i></span><span class="val">${p.chart[d]}</span>`).join('')}
    </div>
    <div class="mini-status">综合 <b style="color:var(--gold)">${computeScore(p).toFixed(1)}</b> · 💰${p.funds} · 拥有角色 <b>${p.charsOwned.length}</b> ${renderStatus(p)}</div>
  `;

function renderStatus(p){
  let s='';
  if(p.reviewerTurns>0) s+=`<span class="badge gold">评议${p.reviewerTurns}</span>`;
  if(p.noSkillTurns>0) s+=`<span class="badge bad">禁技${p.noSkillTurns}</span>`;
  if(p.lockInTurns>0) s+=`<span class="badge">锁定${p.lockInTurns}</span>`;
  if(p.scoreFrozen) s+=`<span class="badge bad">已锁定</span>`;
  if(p.storyboard) s+=`<span class="badge gold">故事板</span>`;
  if(p.reputation>0) s+=`<span class="badge good">声望${p.reputation}</span>`;
  return s;
}

function renderGameCard(c, i, p, canAct){
  // 区分角色卡（已购买的角色）、事件牌、技能牌
  if(c._isChar){
    const owned = p.charsOwned.find(x=>x.id===c.id);
    return `
      <div class="card character ${owned?'owned':''}">
        <div class="ctype">角色牌</div>
        <div class="cname">${c.name}</div>
        <div class="cdesc">${c.stats.config}配置/${c.stats.abstract}抽象/${c.stats.concrete}具象/${c.stats.innovation}创新/${c.stats.selection}选曲/${c.stats.effort}爆肝</div>
        <div class="cdesc" style="color:var(--accent2);font-size:9.5px;"><b>${c.ability.name}</b>：${c.ability.desc}</div>
        <button class="playbtn" data-playcard="${i}" data-charcard="${c.id}" ${canAct?'':'disabled'}>打出</button>
      </div>`;
  }
  const isEvent = EVENT_CARDS.some(e=>e.id===c.id);
  return `
    <div class="card ${isEvent?'event':'skill'}">
      <div class="ctype">${isEvent?'事件(强制)':'技能(可选)'}</div>
      <div class="cname">${c.name}</div>
      <div class="cdesc">${c.desc}</div>
      <button class="playbtn" data-playcard="${i}" ${canAct?'':'disabled'}>${isEvent?'触发':'发动'}</button>
    </div>`;
}

function onPlayCardClick(handIdx){
  const p = state.players[state.currentPlayerIdx];
  const card = p.hand[handIdx];
  if(!card) return;
  if(card._isChar){
    const r = dispatchAction('play_card', -1, {byChar:true, charId:card.id});
    if(!r.ok && r.needModal){ state.pendingModal = r.needModal; }
    render();
    return;
  }
  if(card.id==='yinshui'){
    state.pendingModal = { type:'target', card, handIdx, title:'饮水 - 选择目标', hint:'使目标下回合不可发动技能', action:'play_yinshui', playerIdx:state.currentPlayerIdx };
    render(); return;
  }
  sendAction('play_card', { handIdx });
}

function onActivateAbilityClick(charId){
  const p = state.players[state.currentPlayerIdx];
  const ch = p.charsOwned.find(c=>c.id===charId);
  if(!ch) return;
  if(ch.id==='sulfur'){
    state.pendingModal = { type:'sulfur', charId, title:'动效分配 - 分配4点', action:'sulfur', playerIdx:state.currentPlayerIdx };
    render(); return;
  }
  sendAction('activate_ability', { charId });
}

function onUseReviewClick(){
  state.pendingModal = { type:'review', title:'评议 - 选择目标与票种', action:'review', playerIdx:state.currentPlayerIdx };
  render();
}

// ---------- 购买后将已购角色放入手牌 ----------
function populateCharHandsAfterShop(){
  state.players.forEach(p=>{
    const existingHand = p.hand.filter(c => !c._isChar);
    const charCards = p.charsOwned.map(oc => {
      const src = CHARACTERS.find(c=>c.id===oc.id);
      return {...src, type:'character', _isChar:true, uid:Math.random().toString(36).slice(2), ownedRef:oc};
    });
    p.hand = [...charCards, ...existingHand];
  });
}

// ---------- 模态框 ----------
function renderModal(app){
  const m = state.pendingModal;
  let inner = '';
  if(m.type==='target'){
    const targets = state.players.map((x,i)=>({...x,idx:i})).filter(x=>x.idx!==m.playerIdx);
    inner = `<h3>${m.title}</h3><p>${m.hint||''}</p><div class="targets">
      ${targets.map(t=>`<div class="tgt" data-tgt="${t.idx}"><div class="tn">${t.name}</div><div class="ts">综合 ${computeScore(t).toFixed(1)}</div></div>`).join('')}
    </div>`;
  } else if(m.type==='review'){
    const targets = state.players.map((x,i)=>({...x,idx:i})).filter(x=>x.idx!==m.playerIdx);
    inner = `<h3>${m.title}</h3><p>选择目标与票种。</p><div class="targets">
      ${targets.map(t=>`
        <div class="tgt">
          <div class="tn">${t.name} <span class="ts">综合 ${computeScore(t).toFixed(1)}</span></div>
          <div class="choices">
            <button class="btn btn-bad btn-sm" data-red="${t.idx}">红票: +10配置 / 3回合禁技</button>
            <button class="btn btn-good btn-sm" data-green="${t.idx}">绿票: 下回合+1摸牌</button>
          </div>
        </div>`).join('')}
    </div>`;
  } else if(m.type==='sulfur'){
    inner = `<h3>${m.title}</h3><p>将4点分配给具象或抽象。</p>
      <div class="choices">
        <button class="btn btn-good" data-sulfur="1">+4 具象表演</button>
        <button class="btn btn-accent" data-sulfur="0">+4 抽象表演</button>
      </div>`;
  }
  inner += `<button class="btn" id="cancel-modal" style="margin-top:10px;width:100%;">取消</button>`;
  app.insertAdjacentHTML('beforeend', `<div class="modal"><div class="box">${inner}</div></div>`);
  const modal = app.lastElementChild;
  modal.querySelectorAll('[data-tgt]').forEach(el=>el.onclick = ()=>{
    sendAction('play_card', { handIdx: m.handIdx, extra:{targetIdx:+el.dataset.tgt} });
    state.pendingModal = null; render();
  });
  modal.querySelectorAll('[data-red]').forEach(el=>el.onclick=()=>{
    sendAction('use_review', { targetIdx:+el.dataset.red, ticket:'red' });
    state.pendingModal=null; render();
  });
  modal.querySelectorAll('[data-green]').forEach(el=>el.onclick=()=>{
    sendAction('use_review', { targetIdx:+el.dataset.green, ticket:'green' });
    state.pendingModal=null; render();
  });
  modal.querySelectorAll('[data-sulfur]').forEach(el=>el.onclick=()=>{
    sendAction('activate_ability', { charId: m.charId, extra:{toConcrete: +el.dataset.sulfur===1} });
    state.pendingModal=null; render();
  });
  modal.querySelector('#cancel-modal').onclick = ()=>{ state.pendingModal=null; render(); };
}

// ---------- 结算 ----------
function renderGameOver(app){
  const r = state.ranking;
  const spectatorBanner = (ui.mode==='room' && ui.room.isHost && state.startedAt>0) ? '<div class="spectator-banner" style="max-width:600px;margin:10px auto;">🔎 观战模式：游戏已结束，欢迎加入下一局！</div>' : '';
  app.innerHTML = `
    <div class="setup" style="max-width:600px;">
      <h1 style="text-align:center;">谱师卡牌 · 结算</h1>
      <div class="sub" style="text-align:center;">共 ${state.totalRounds} 回合 · ${state.numPlayers} 名玩家</div>
      ${spectatorBanner}
      <div class="ranking">
        ${r.map((x,i)=>`
          <div class="rank-row ${i===0?'first':''} ${x.idx===myPlayerIndex()?'you':''}">
            <div class="pos">${i+1}</div>
            <div class="pn">${x.name}${i===0?' 🏆 冠军':''} ${x.idx===myPlayerIndex()?'<span class="badge gold" style="font-size:10px;padding:1px 6px;">你</span>':''}</div>
            <div class="sc">${x.score.toFixed(1)}</div>
          </div>`).join('')}
      </div>
      <div class="panel" style="margin:10px 0;">
        <h2>冠军谱面 - ${r[0].name}</h2>
        <div class="detail-grid">
          ${DIM_NAMES.map(d=>{const v=r[0].p.chart[d];return `<span class="lbl" style="color:var(--muted)">${DIM_LABELS[d]}</span><span class="bar"><i style="width:${Math.min(100,v*2)}%"></i></span><span class="val" style="color:var(--gold);font-weight:700;">${v}</span><span class="muted" style="font-size:10px;">×${DIM_WEIGHTS[d]} = ${(v*DIM_WEIGHTS[d]).toFixed(1)}</span>`;}).join('')}
        </div>
        <div class="mini-status" style="margin-top:8px;">声望 ${r[0].p.reputation}(+${r[0].p.reputation}) · 爆肝 ${r[0].p.effortTotal}(+${(r[0].p.effortTotal*0.5).toFixed(1)}) ${r[0].p.storyboard?'· 故事板+5':''}</div>
      </div>
      <button class="btn-primary" id="restart-btn">再来一局</button>
      ${ui.mode==='room' && ui.room.isHost ? `<div style="text-align:center;margin-top:8px;"><button class="btn btn-sm" id="back-lobby-btn">返回房间大厅</button></div>` : ''}
    </div>`;
  app.querySelector('#restart-btn').onclick = ()=>{
    const names = state.players.map(p=>p.name);
    ui.setupCache = { numPlayers: state.numPlayers, totalRounds: state.totalRounds, names: [...names, '',''] };
    state = { phase:'setup' };
    render();
  };
  const bl = app.querySelector('#back-lobby-btn');
  if(bl) bl.onclick = ()=>{ state = { phase:'setup' }; render(); };
}

// ---------- 初始化 ----------

<!-- PeerJS 库 -->
<script>
(function() {
  const cdnSources = [
    'https://cdn.jsdelivr.net/npm/peerjs@1.5.4/dist/peerjs.min.js',
    'https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js',
    'https://cdnjs.cloudflare.com/ajax/libs/peerjs/1.5.4/peerjs.min.js',
    'https://cdn.bootcdn.net/ajax/libs/peerjs/1.5.4/peerjs.min.js'
  ];
  let sourceIndex = 0;
  function tryLoadCDN() {
    if (sourceIndex >= cdnSources.length) {
      console.error('[WebRTC] 所有 CDN 均加载失败！');
      window.__peerjsLoaded = false;
      return;
    }
    const script = document.createElement('script');
    script.src = cdnSources[sourceIndex];
    script.onload = function() {
      if (typeof Peer !== 'undefined') {
        console.log('[WebRTC] PeerJS 加载成功');
        window.__peerjsLoaded = true;
      } else { sourceIndex++; tryLoadCDN(); }
    };
    script.onerror = function() { sourceIndex++; tryLoadCDN(); };
    document.head.appendChild(script);
  }
  tryLoadCDN();
})();

function waitForPeerJS(timeout){
  timeout = timeout || 10000;
  return new Promise((resolve, reject) => {
    const start = Date.now();
    const iv = setInterval(()=>{
      if(typeof Peer!=='undefined'){ clearInterval(iv); resolve(true); }
      else if(Date.now()-start > timeout){ clearInterval(iv); reject(new Error('PeerJS 加载超时')); }
    }, 100);
  });
}
window.waitForPeerJS = waitForPeerJS;
</script>

<script>
/* WebRTCTransport - 保留原有实现 */
class WebRTCTransport {
  constructor(roomCode, isHost){
    this.roomCode = roomCode;
    this.isHost = isHost;
    this.peer = null;
    this.connections = new Map();
    this.userHandler = null;
    this.status = 'idle';
    this.lastError = null;
    this.hostPeerId = null;
    this.myPeerId = null;
  }
  _getIceServers(){
    return [
      { urls:'stun:stun.l.google.com:19302' },
      { urls:'stun:stun1.l.google.com:19302' },
      { urls:'stun:stun2.l.google.com:19302' },
      { urls:'stun:stun3.l.google.com:19302' },
      { urls:'stun:stun.miwifi.com:3478' },
      { urls:'stun:stun.chat.bilibili.com:3478' },
      { urls:'stun:stun.services.mozilla.com' }
    ];
  }
  async connect(){
    this.status = 'connecting';
    this._updateStatus();
    try {
      if(typeof window.waitForPeerJS==='function'){ await window.waitForPeerJS(15000); }
    } catch(e){}
    if(typeof Peer==='undefined'){
      this.status='error'; this.lastError='PeerJS 库未加载'; this._updateStatus();
      throw new Error(this.lastError);
    }
    try {
      if(this.isHost){
        this.myPeerId = `puishi-${this.roomCode}-host`;
        this.peer = new Peer(this.myPeerId, { debug:1, config:{ iceServers:this._getIceServers() } });
        const pendingConnections = [];
        let connectionHandler = null;
        this.peer.on('connection', (conn)=>{
          if(connectionHandler) connectionHandler(conn);
          else pendingConnections.push(conn);
        });
        await new Promise((resolve, reject)=>{
          const t = setTimeout(()=>reject(new Error('PeerJS 连接超时(30秒)')),30000);
          this.peer.on('open', ()=>{ clearTimeout(t); this.status='connected'; this._updateStatus(); resolve(); });
          this.peer.on('error', (err)=>{ clearTimeout(t); this.status='error'; this.lastError=err.message; this._updateStatus(); reject(err); });
        });
        connectionHandler = (conn)=>this._handleConnection(conn);
        while(pendingConnections.length>0){ const c=pendingConnections.shift(); connectionHandler(c); }
      } else {
        this.myPeerId = `puishi-client-${this.roomCode}-${Math.random().toString(36).slice(2,8)}`;
        this.peer = new Peer(this.myPeerId, { debug:1, config:{ iceServers:this._getIceServers() } });
        await new Promise((resolve, reject)=>{
          const t = setTimeout(()=>reject(new Error('PeerJS 连接超时(30秒)')),30000);
          this.peer.on('open', ()=>{ clearTimeout(t); this.status='connected'; this._updateStatus(); resolve(); });
          this.peer.on('error', (err)=>{
            if(err.type==='unavailable-id'||err.type==='peer-unavailable') this.lastError='房间不存在或主机未就绪';
            else if(err.type==='network'||err.type==='disconnected') this.lastError='网络连接失败';
            else this.lastError=err.message;
            this.status='error'; this._updateStatus(); reject(err);
          });
        });
      }
    } catch(err){ throw err; }
  }
  _handleConnection(conn){
    conn.on('open', ()=>{});
    conn.on('data', (data)=>{
      let parsed = data;
      if(typeof data==='string'){ try{ parsed=JSON.parse(data); }catch(e){ return; } }
      this._onData(conn, parsed);
    });
    conn.on('close', ()=>{
      this.connections.delete(conn.peer);
      this._broadcast({ type:'leave', roomCode:this.roomCode, playerId:(this.connections.get(conn.peer)?.playerId)||'unknown' });
    });
    conn.on('error', ()=>{});
  }
  async joinAsClient(hostPeerId, myName){
    this.status='connecting'; this._updateStatus();
    try {
      const conn = this.peer.connect(hostPeerId, { reliable:true });
      await new Promise((resolve, reject)=>{
        const t = setTimeout(()=>reject(new Error('连接主机超时(30秒)')),30000);
        conn.on('open', ()=>{ clearTimeout(t); resolve(); });
        conn.on('error', (err)=>{ clearTimeout(t); reject(err); });
      });
      this.connections.set(conn.peer, {conn, playerId:null, name:myName});
      this._handleConnection(conn);
      conn.send(JSON.stringify({ type:'join_webrtc', roomCode:this.roomCode, playerId:ui.room.myId, name:myName, peerId:this.myPeerId }));
      this.status='connected'; this._updateStatus();
    } catch(err){
      this.status='error'; throw new Error(err.message);
    }
  }
  _onData(conn, data){
    if(!data || !data.type) return;
    if(data.type==='join_webrtc'){
      const ex = this.connections.get(conn.peer);
      if(ex){ ex.playerId=data.playerId; ex.name=data.name; }
      else this.connections.set(conn.peer, {conn, playerId:data.playerId, name:data.name});
      const membersList = this._getMembersList();
      this._broadcast({ type:'webrtc_member_update', roomCode:this.roomCode, members:membersList, fromId:ui.room?.myId||this.myPeerId });
      if(this.userHandler) this.userHandler({ data:{ type:'webrtc_member_update', roomCode:this.roomCode, members:membersList } });
      if(conn.open){
        try{ conn.send(JSON.stringify({ type:'hello', roomCode:this.roomCode, fromId:ui.room?.myId||this.myPeerId, members:membersList, settings:{numPlayers:ui.setupCache?.numPlayers||2,totalRounds:ui.setupCache?.totalRounds||10} })); }catch(e){}
      }
    }
    if(data.fromId){
      const ex = this.connections.get(conn.peer);
      if(ex && !ex.playerId) ex.playerId = data.fromId;
    }
    if(this.userHandler && data.type!=='webrtc_member_update'){ this.userHandler({ data }); }
  }
  _getMembersList(){
    const members = Array.from(this.connections.values()).map(c=>({ id:c.playerId||c.conn.peer, name:c.name||'玩家', isHost:false }));
    if(ui.room?.isHost){ members.unshift({ id:ui.room.myId, name:ui.room.myName||'主机', isHost:true }); }
    return members;
  }
  broadcast(msgObj){ this._broadcast({ ...msgObj, roomCode:this.roomCode, fromId:ui.room?.myId||this.myPeerId }); }
  _broadcast(msg){
    const data = JSON.stringify(msg);
    for(const [peerId, {conn}] of this.connections){
      if(conn.open){ try{ conn.send(data); }catch(e){} }
    }
  }
  postMessage(msgObj){
    return new Promise((resolve, reject)=>{
      if(this.status!=='connected'){ reject(new Error('WebRTC 未连接')); return; }
      this.broadcast(msgObj); resolve();
    });
  }
  close(){
    for(const [peerId, {conn}] of this.connections){ try{conn.close();}catch(e){} }
    this.connections.clear();
    if(this.peer){ try{this.peer.destroy();}catch(e){} this.peer=null; }
    this.status='closed'; this._updateStatus();
  }
  _updateStatus(){ try{ if(typeof onTransportStatusChange==='function'){ ui.transport.status=this.status; ui.transport.lastError=this.lastError; onTransportStatusChange(); } }catch(e){} }
  get onmessage(){ return this.userHandler; }
  set onmessage(fn){ this.userHandler=fn; }
}

ui.transport.webrtc = {
  instance: null,
  mode: 'auto',
  hostPeerId: null,
  get status(){ return this.instance ? this.instance.status : 'idle'; }
};
</script>
