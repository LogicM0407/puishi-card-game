  if (game.round === 1) return fail("第1轮不能使用技能牌");
  if (player.reviewTurns <= 0) return fail("当前没有评议身份");
  if (player.reviewActionUsed) return fail("本回合已经进行过评议");
  if (isAllSkillBlocked(player)) return fail("本回合不能发动技能");
  const targetIndex = game.players.findIndex(candidate => candidate.memberId === payload.targetMemberId);
  const target = game.players[targetIndex];
  if (!target) return fail("目标不存在");
  if (payload.vote === "red") {
    applyScoreChange(targetIndex, "config", 10, {
      sourcePlayerIndex: playerIndex,
      fromSkillCard: true
    });
    target.disableAllSkillTurns = Math.max(target.disableAllSkillTurns, 3);
    appendLog(`${player.name} 向${target.name}送出红票：配置水平+10，连续3回合不可发动技能。`, "effect");
  } else if (payload.vote === "green") {
    target.extraDrawNextTurn++;
    appendLog(`${player.name} 向${target.name}送出绿票：下回合额外摸1张牌。`, "effect");
  } else {
    return fail("请选择红票或绿票");
  }
  player.reviewActionUsed = true;
  return ok();
}

function endTurn(playerIndex) {
  const player = game.players[playerIndex];
  if (game.round === 1) {
    if (!player.firstRoundSkillUsed) return fail("第1轮必须发动1次角色技能");
  } else if (!game.turn.hasDrawn) {
    return fail("必须先完成摸牌");
  }
  if (player.disableCharacterTurns > 0) player.disableCharacterTurns--;
  if (player.disableAllSkillTurns > 0) player.disableAllSkillTurns--;
  if (player.reviewTurns > 0) player.reviewTurns--;
  player.skillCardLimit = null;
  player.characters.forEach(character => {
    if (character.disabledTurns > 0) character.disabledTurns--;
  });
  if (player.pendingDisableCharacterTurns > 0) {
    player.disableCharacterTurns = Math.max(player.disableCharacterTurns, player.pendingDisableCharacterTurns);
    player.pendingDisableCharacterTurns = 0;
  }

  if (
    player.extraTurnCredits > 0 &&
    player.extraTurnEligibleAfter != null &&
    game.turn.number > player.extraTurnEligibleAfter
  ) {
    player.extraTurnCredits--;
    if (player.extraTurnCredits <= 0) player.extraTurnEligibleAfter = null;
    appendLog(`${player.name} 获得一个额外回合。`, "event");
    beginTurn();
    return ok();
  }

  if (game.turnDirection === -1) {
    if (game.currentPlayerIndex > 0) {
      game.currentPlayerIndex--;
    } else {
      game.turnDirection = 1;
      game.currentPlayerIndex = game.players.length > 1 ? 1 : 0;
      appendLog("凌日潮汐结束，恢复正常行动顺序。", "event");
    }
  } else {
    game.currentPlayerIndex++;
    if (game.currentPlayerIndex >= game.players.length) {
      game.currentPlayerIndex = 0;
      game.round++;
      if (game.round > game.totalRounds) {
        settleGame();
        return ok();
      }
      appendLog(`第${game.round}轮开始。`, "event");
    }
  }
  // 跳过下一回合（如「电脑被没收了」事件）
  if (currentPlayer().skipNextTurn) {
    currentPlayer().skipNextTurn = false;
    appendLog(`${currentPlayer().name} 的回合被跳过。`, "event");
    return endTurn(game.currentPlayerIndex);
  }
  beginTurn();
  return ok();
}

function settleGame() {
  const preliminary = game.players
    .map((player, index) => ({ index, score: totalScore(player) }))
    .sort((a, b) => b.score - a.score);
  preliminary.forEach((entry, rankIndex) => {
    const player = game.players[entry.index];
    if (!ownsCharacter(player, "dagezi") || rankIndex === 0) return;
    const gap = preliminary[rankIndex - 1].score - entry.score;
    const triggers = Math.floor(gap / 3);
    for (let i = 0; i < triggers; i++) {
      const opponents = game.players.map((_, index) => index).filter(index => index !== entry.index && !game.players[index].frozen);
      if (!opponents.length) break;
      const targetIndex = randomItem(opponents);
      game.players[targetIndex].settlementPenalty -= 2;
      appendLog(`${player.name} 的结算被动使${game.players[targetIndex].name}综合分-2。`, "effect");
    }
  });
  game.phase = GAME_PHASE.SETTLEMENT;
  game.ranking = game.players
    .map(player => ({
      memberId: player.memberId,
      name: player.name,
      score: totalScore(player),
      scores: clone(player.scores),
      reputation: player.reputation,
      storyboard: player.storyboard,
      settlementPenalty: player.settlementPenalty
    }))
    .sort((a, b) => b.score - a.score);
  room.lifecycle = ROOM_STATE.SETTLEMENT;
  appendLog("全部回合结束，进入结算。", "event");
}

function ok(extra = {}) { return { ok: true, ...extra }; }
function fail(reason) { return { ok: false, reason }; }

function validateActor(memberId) {
  const index = game?.players.findIndex(player => player.memberId === memberId) ?? -1;
  if (index < 0) return { index, error: fail("观战者不能操作") };
  return { index, error: null };
}

function hostDispatch(memberId, action, payload = {}, requestId = "", internalCall = false) {
  if (!room.isHost || !game || room.lifecycle !== ROOM_STATE.PLAYING) return fail("游戏当前不可操作");
  const actor = validateActor(memberId);
  if (actor.error) return actor.error;
  const playerIndex = actor.index;
  const player = game.players[playerIndex];
  // AI 托管的真人玩家不允许远端手动操作（内部 AI 执行时 internalCall 跳过此检查）
  if (!player.isBot && player.aiControlled && !internalCall) return fail("该玩家已由 AI 永久托管");
  const ownTurn = game.currentPlayerIndex === playerIndex;
  let result = fail("未知操作");

  if (game.pendingEvent && action !== "RESOLVE_EVENT") {
    return fail("请先完成当前事件牌结算");
  }
  if (action === "RESOLVE_EVENT") {
    result = resolvePendingEvent(memberId, payload);
  } else if (action === "DRAFT_BUY") {
    if (game.phase !== GAME_PHASE.DRAFT || !ownTurn) return fail("还没轮到你购置");
    result = buyCharacter(playerIndex, payload.characterId);
  } else if (action === "DRAFT_DONE") {
    if (game.phase !== GAME_PHASE.DRAFT || !ownTurn) return fail("还没轮到你购置");
    result = finishDraft(playerIndex);
  } else if (action === "DRAW") {
    if (game.phase !== GAME_PHASE.TURN || !ownTurn) return fail("现在不能摸牌");
    if (game.round === 1) return fail("第1轮不摸牌");
    if (game.turn.hasDrawn) return fail("本回合已经摸过牌");
    game.turn.hasDrawn = true;
    result = ok({ draw: drawCard(playerIndex) });
  } else if (action === "PLAY_CARD") {
    if (game.phase !== GAME_PHASE.TURN || !ownTurn) return fail("只能在自己的回合使用技能牌");
    result = executeSkillCard(playerIndex, payload.cardUid, payload);
  } else if (action === "ACTIVATE_CHARACTER") {
    if (game.phase !== GAME_PHASE.TURN || !ownTurn) return fail("只能在自己的回合发动角色技能");
    result = activateCharacter(playerIndex, payload.characterId, payload.abilityId, payload);
  } else if (action === "REVIEW_VOTE") {
    if (game.phase !== GAME_PHASE.TURN || !ownTurn) return fail("只能在自己的回合进行评议");
    result = executeReviewVote(playerIndex, payload);
  } else if (action === "RESTORE_CHARACTER") {
    if (game.phase !== GAME_PHASE.TURN || !ownTurn) return fail("只能在自己的回合恢复角色");
    const instance = player.characters.find(c => c.uid === payload.characterUid);
    if (!instance) return fail("未找到该角色");
    if (!instance.permanentlyDisabled && instance.disabledTurns <= 0) return fail("该角色技能未被禁用，无需恢复");
    if (player.reputation < 10) return fail("声望不足 10 点");
    const wasPermanent = instance.permanentlyDisabled;
    const origTurns = instance.disabledTurns;
    gainReputation(playerIndex, -10);
    instance.permanentlyDisabled = false;
    instance.disabledTurns = 0;
    const def = characterDefinition(instance.id);
    appendLog(`${player.name} 花费 10 点声望使「${def.name}」立即恢复可用状态（原状态：${wasPermanent ? "永久失效" : `禁用${origTurns}回合`}）。`, "effect");
    result = ok();
  } else if (action === "END_TURN") {
    if (game.phase !== GAME_PHASE.TURN || !ownTurn) return fail("现在不能结束回合");
    result = endTurn(playerIndex);
  }

  if (result.ok) {
    game.sequence++;
    if (player) player.lastActionAt = Date.now();
    syncAll(memberId, requestId, action, result);
  }
  return result;
}

function botTargetIndex(playerIndex) {
  const candidates = game.players
    .map((player, index) => ({ player, index }))
    .filter(entry => entry.index !== playerIndex);
  if (!candidates.length) return -1;
  const bot = game.players[playerIndex];
  if (bot.difficulty === "normal") {
    candidates.sort((a, b) => totalScore(b.player) - totalScore(a.player));
    return candidates[0].index;
  }
  return randomItem(candidates).index;
}

function botAbilityPayload(playerIndex, instance, ability) {
  if (ability.choice === "three-dimensions") {
    return { dimensions: shuffle([...CHANGEABLE_DIMENSIONS]).slice(0, 3) };
  }
  if (ability.choice === "two-dimensions") {
    return { dimensions: shuffle([...CHANGEABLE_DIMENSIONS]).slice(0, 2) };
  }
  if (ability.choice === "motion-distribution") {
    return { abstractPoints: Math.floor(Math.random() * 6) };
  }
  if (ability.choice === "up-to-two-targets") {
    const targets = game.players
      .filter((_, index) => index !== playerIndex)
      .sort((a, b) => totalScore(b) - totalScore(a))
      .slice(0, 2)
      .map(player => player.memberId);
    return { targetMemberIds: targets };
  }
  if (ability.choice === "opponent") {
    const targetIndex = botTargetIndex(playerIndex);
    return { targetMemberId: game.players[targetIndex]?.memberId };
  }
  return {};
}

function botCharacterChoice(playerIndex) {
  const player = game.players[playerIndex];
  const affordable = CHARACTERS.filter(character =>
    !player.characters.some(instance => instance.id === character.id) &&
    RARITY[character.rarity].price <= player.funds
  );
  if (!affordable.length) return null;
  if (player.difficulty === "simple") {
    const highestPrice = Math.max(...affordable.map(character => RARITY[character.rarity].price));
    return randomItem(affordable.filter(character => RARITY[character.rarity].price === highestPrice));
  }
  const strategyStats = {
    config: ["config", "stamina"],
    motion: ["abstract", "concrete"],
    innovation: ["innovation", "stamina"],
    selection: ["selection", "config"]
  }[player.aiStrategy] || ["config", "innovation"];
  return affordable.sort((a, b) => {
    const scoreA = strategyStats.reduce((sum, stat) => sum + a.stats[stat], 0);
    const scoreB = strategyStats.reduce((sum, stat) => sum + b.stats[stat], 0);
    return scoreB - scoreA || RARITY[b.rarity].price - RARITY[a.rarity].price;
  })[0];
}

function resolveBotEvent(playerIndex) {
  const pending = game.pendingEvent;
  const player = game.players[playerIndex];
  if (!pending || pending.responderMemberId !== player.memberId) return fail("没有待处理事件");
  let result;
  if (pending.stage === "choose") {
    const targetIndex = botTargetIndex(playerIndex);
    result = hostDispatch(player.memberId, "RESOLVE_EVENT", {
      ownCharacterUid: randomItem(player.characters)?.uid,
      targetMemberId: game.players[targetIndex]?.memberId
    }, "", true);
  } else {
    const targetCharacterUid = randomItem(player.characters)?.uid;
    if (pending.eventId === "maimai") {
      result = hostDispatch(player.memberId, "RESOLVE_EVENT", { targetCharacterUid }, "", true);
    } else {
      const decision = player.difficulty === "normal" || Math.random() < .65 ? "accept" : "refuse";
      result = hostDispatch(player.memberId, "RESOLVE_EVENT", { decision, targetCharacterUid }, "", true);
    }
  }
  // 若 hostDispatch 失败（如角色 uid 无效），不会触发 syncAll，需手动重试避免卡死
  if (!result.ok) {
    // choose 阶段失败：强制选择第一个可用目标重试一次；仍失败则放弃事件
    if (pending.stage === "choose") {
      const fallbackTarget = game.players.find((p, i) => i !== playerIndex);
      if (fallbackTarget) {
        const fallbackChar = player.characters[0];
        const retry = hostDispatch(player.memberId, "RESOLVE_EVENT", {
          ownCharacterUid: fallbackChar?.uid,
          targetMemberId: fallbackTarget.memberId
        }, "", true);
        if (retry.ok) return retry;
      }
    }
    // 仍失败：放弃当前事件，避免永久卡死
    appendLog(`${player.name} 无法处理事件「${eventDefinition(pending.eventId)?.name}」，事件被跳过。`, "event");
    game.pendingEvent = null;
    syncAll();
    scheduleBotAction();
    return ok();
  }
  return result;
}

function isAIActor(player) {
  return player?.isBot || player?.aiControlled;
}

function performBotAction() {
  ui.botTimer = null;
  if (!room.isHost || !game || room.lifecycle !== ROOM_STATE.PLAYING) return;
  const pendingIndex = game.pendingEvent
    ? game.players.findIndex(player => player.memberId === game.pendingEvent.responderMemberId && isAIActor(player))
    : -1;
  if (pendingIndex >= 0) {
    resolveBotEvent(pendingIndex);
    return;
  }
  if (game.pendingEvent) return;

  const playerIndex = game.currentPlayerIndex;
  const player = game.players[playerIndex];
  if (!isAIActor(player)) return;

  // 封装 hostDispatch：若操作失败则 fallback 到 END_TURN，防止 bot 永久卡死
  const dispatch = (action, payload = {}) => {
    const result = hostDispatch(player.memberId, action, payload, "", true);
    if (!result.ok && action !== "END_TURN" && action !== "DRAFT_DONE") {
      hostDispatch(player.memberId, "END_TURN", {}, "", true);
    }
  };

  if (game.phase === GAME_PHASE.DRAFT) {
    const choice = botCharacterChoice(playerIndex);
    dispatch(choice ? "DRAFT_BUY" : "DRAFT_DONE", choice ? { characterId: choice.id } : {});
    return;
  }

  if (game.round === 1) {
    if (!player.firstRoundSkillUsed) {
      const choice = player.characters
        .flatMap(instance => characterDefinition(instance.id).abilities.map(ability => ({ instance, ability })))
        .find(entry => canActivateCharacter(player, entry.instance, entry.ability).ok);
      if (choice) {
        dispatch("ACTIVATE_CHARACTER", {
          characterId: choice.instance.id,
          abilityId: choice.ability.id,
          ...botAbilityPayload(playerIndex, choice.instance, choice.ability)
        });
        return;
      }
    }
    dispatch("END_TURN");
    return;
  }

  if (!game.turn.hasDrawn) {
    dispatch("DRAW");
    return;
  }

  if (player.reviewTurns > 0 && !player.reviewActionUsed && !isAllSkillBlocked(player)) {
    const targetIndex = player.difficulty === "normal" ? botTargetIndex(playerIndex) : Math.floor(Math.random() * game.players.length);
    dispatch("REVIEW_VOTE", {
      targetMemberId: game.players[targetIndex].memberId,
      vote: player.difficulty === "normal" ? "red" : randomItem(["red", "green"])
    });
    return;
  }

  const abilityChoice = player.characters
    .flatMap(instance => characterDefinition(instance.id).abilities.map(ability => ({ instance, ability })))
    .find(entry => canActivateCharacter(player, entry.instance, entry.ability).ok);
  if (abilityChoice) {
    dispatch("ACTIVATE_CHARACTER", {
      characterId: abilityChoice.instance.id,
      abilityId: abilityChoice.ability.id,
      ...botAbilityPayload(playerIndex, abilityChoice.instance, abilityChoice.ability)
    });
    return;
  }

  const cardLimit = player.difficulty === "normal" ? 2 : 1;
  if (game.turn.skillCardsPlayed < cardLimit && !isAllSkillBlocked(player)) {
    const priorities = ["fge", "commission", "review", "drink"];
    const card = [...player.hand].sort((a, b) =>
      priorities.indexOf(a.cardId) - priorities.indexOf(b.cardId)
    )[0];
    if (card) {
      const payload = { cardUid: card.uid };
      if (skillDefinition(card.cardId)?.target === "opponent") {
        payload.targetMemberId = game.players[botTargetIndex(playerIndex)].memberId;
      }
      dispatch("PLAY_CARD", payload);
      return;
    }
  }
  dispatch("END_TURN");
}

function scheduleBotAction() {
  clearTimeout(ui.botTimer);
  ui.botTimer = null;
  if (!room.isHost || !game || room.lifecycle !== ROOM_STATE.PLAYING) return;
  const pendingResponder = game.pendingEvent
    ? game.players.find(player => player.memberId === game.pendingEvent.responderMemberId)
    : null;
  const actor = pendingResponder || currentPlayer();
  if (!isAIActor(actor)) return;
  const delay = actor.difficulty === "normal" ? 650 + Math.random() * 500 : 850 + Math.random() * 650;
  ui.botTimer = setTimeout(performBotAction, delay);
}

function publicGameFor(memberId) {
  if (!game) return null;
  const publicGame = clone(game);
  publicGame.players.forEach(player => {
    player.handCount = player.hand.length;
    if (player.memberId !== memberId) {
      player.hand = [];
    } else {
      player.connected = true;
    }
  });
  return publicGame;
}

function publicRoom() {
  return {
    code: room.code,
    hostId: room.hostId,
    lifecycle: room.lifecycle,
    settings: clone(room.settings),
    members: clone(room.members)
  };
}

function applyRoomSnapshot(snapshot) {
  if (!snapshot) return;
  room.code = snapshot.code;
  room.hostId = snapshot.hostId;
  room.isHost = room.myId === snapshot.hostId;
  room.lifecycle = snapshot.lifecycle;
  room.settings = snapshot.settings;
  room.members = snapshot.members;
  room.connected = true;
  ui.hostLostAt = 0;
  ui.message = "";
  ui.messageError = false;
  ui.screen = room.lifecycle === ROOM_STATE.WAITING ? "lobby" : "game";
}

function authorityBackupFor(memberId) {
  const successor = room.members.find(member =>
    member.id !== room.hostId &&
    member.connected &&
    !member.spectator
  );
  return successor?.id === memberId ? game : null;
}

const ACK_TIMEOUT_MS = 3000;
const ACK_MAX_RETRIES = 5;

function clearAckTimeout(memberId) {
  const entry = ui.pendingAcks.get(memberId);
  if (entry) {
    clearTimeout(entry.timer);
    ui.pendingAcks.delete(memberId);
  }
}

function sendSyncMessage(memberId, acknowledgedRequestId = "") {
  return room.transport?.sendToPlayer(memberId, {
    type: "CORE_MESSAGE",
    msgId: `msg_${cryptoRandom(8)}`,
    seqNum: game?.sequence ?? 0,
    senderId: "system",
    action: "RESYNC",
    timestamp: Date.now(),
    ok: true,
    reason: "",
    draw: null,
    room: publicRoom(),
    game: publicGameFor(memberId),
    authorityBackup: authorityBackupFor(memberId),
    ackRequestId: acknowledgedRequestId
  }) || false;
}

function scheduleAckRetry(memberId, sequence, retries = 0) {
  clearAckTimeout(memberId);
  const timer = setTimeout(() => {
    ui.pendingAcks.delete(memberId);
    if (!room.isHost || !game) return;
    const member = room.members.find(m => m.id === memberId);
    if (!member?.connected) return;
    if (retries >= ACK_MAX_RETRIES) {
      ui.pendingSyncMembers.add(memberId);
      scheduleHostResync();
      return;
    }
    const delivered = sendSyncMessage(memberId);
    if (delivered) {
      scheduleAckRetry(memberId, sequence, retries + 1);
    } else {
      ui.pendingSyncMembers.add(memberId);
      scheduleHostResync();
    }
  }, ACK_TIMEOUT_MS);
  ui.pendingAcks.set(memberId, { sequence, timer, retries });
}

function sendStateToPlayer(memberId, acknowledgedRequestId = "") {
  const delivered = sendSyncMessage(memberId, acknowledgedRequestId);
  if (!delivered) {
    ui.pendingSyncMembers.add(memberId);
    scheduleHostResync();
  } else {
    ui.pendingSyncMembers.delete(memberId);
    const sequence = game?.sequence ?? 0;
    scheduleAckRetry(memberId, sequence);
  }
  return delivered;
}

function scheduleHostResync() {
  if (!room.isHost || ui.hostResyncTimer) return;
  ui.hostResyncTimer = setTimeout(() => {
    ui.hostResyncTimer = null;
    if (!room.isHost || !game) return;
    const retry = [...ui.pendingSyncMembers];
    ui.pendingSyncMembers.clear();
    retry.forEach(memberId => {
      const member = room.members.find(m => m.id === memberId);
      if (member?.connected) {
        const ok = sendSyncMessage(memberId);
        if (ok) {
          scheduleAckRetry(memberId, game?.sequence ?? 0);
        } else {
          ui.pendingSyncMembers.add(memberId);
        }
      }
    });
    if (ui.pendingSyncMembers.size > 0) scheduleHostResync();
  }, 2000);
}

function scheduleHostPeriodicSync() {
  clearTimeout(ui.hostPeriodicTimer);
  ui.hostPeriodicTimer = null;
  if (!room.isHost || !game) return;
  ui.hostPeriodicTimer = setTimeout(() => {
    ui.hostPeriodicTimer = null;
    if (!room.isHost || !game) return;
    checkAIControl();
    if (shouldGenerateSnapshot()) generateSnapshot();
    const currentSeq = game.sequence ?? 0;
    room.members.forEach(member => {
      if (member.id === room.myId || !member.connected || member.isBot) return;
      const ackEntry = ui.pendingAcks.get(member.id);
      const lastAcked = ui.lastAckedSequence.get(member.id) ?? -1;
      const hasPendingAck = ackEntry && ackEntry.sequence >= currentSeq;
      if (lastAcked < currentSeq && !hasPendingAck) {
        sendStateToPlayer(member.id);
      }
    });
    scheduleHostPeriodicSync();
  }, 5000);
}

const DISCONNECT_AI_TIMEOUT_MS = 90000;
const INACTIVE_AI_TIMEOUT_MS = 120000;

function setAIControl(playerIndex, reason) {
  const player = game.players[playerIndex];
  if (player.isBot || player.aiControlled) return false;
  player.aiControlled = true;
  appendLog(`${player.name} ${reason}，由 AI 永久接管所有操作。`, "event");
  pushSystemChat(`${player.name} 已进入 AI 托管状态。`);
  return true;
}

function checkAIControl() {
  if (!game || game.phase === GAME_PHASE.SETTLEMENT) return;
  const now = Date.now();
  let changed = false;
  const wasCurrentAI = currentPlayer()?.aiControlled;
  game.players.forEach((player, playerIndex) => {
    if (player.isBot || player.aiControlled) return;
    // 1) 断线超过 90 秒 → AI 托管
    if (!player.connected && player.disconnectedAt && now - player.disconnectedAt >= DISCONNECT_AI_TIMEOUT_MS) {
      if (setAIControl(playerIndex, "断线超过 90 秒")) changed = true;
      return;
    }
    // 2) 轮到当前玩家且连续 120 秒未操作（即使未掉线）→ AI 托管（DRAFT 和 TURN 阶段）
    if (game.currentPlayerIndex === playerIndex &&
        (game.phase === GAME_PHASE.TURN || game.phase === GAME_PHASE.DRAFT)) {
      const lastAction = player.lastActionAt || player.disconnectedAt || now;
      if (now - lastAction >= INACTIVE_AI_TIMEOUT_MS) {
        if (setAIControl(playerIndex, "超过 120 秒未操作")) changed = true;
      }
    }
  });
  if (changed) {
    // 如果当前玩家刚被设为AI托管，立即启动AI行动
    const cur = currentPlayer();
    if (cur && cur.aiControlled && !wasCurrentAI) {
      scheduleBotAction();
    }
    syncAll();
  }
}

function storeCoreMessage(message) {
  if (!game.coreMessages) game.coreMessages = [];
  game.coreMessages.push(message);
  if (game.coreMessages.length > 200) game.coreMessages.shift();
}

function emitCoreMessage(memberId, action, result, requestId = "") {
  const msgId = `msg_${cryptoRandom(8)}`;
  const message = {
    msgId,
    seqNum: game.sequence,
    senderId: memberId || "system",
    action: action || "SYNC",
    timestamp: Date.now(),
    ok: result?.ok ?? true,
    reason: result?.reason || "",
    draw: result?.draw || null,
    ackRequestId: requestId
  };
  storeCoreMessage(message);
  return message;
}

function sendCoreMessageToPlayer(memberId, message, actorMemberId = "") {
  const personalized = {
    type: "CORE_MESSAGE",
    msgId: message.msgId,
    seqNum: message.seqNum,
    senderId: message.senderId,
    action: message.action,
    timestamp: message.timestamp,
    ok: message.ok,
    reason: message.reason,
    draw: message.draw,
    room: publicRoom(),
    game: publicGameFor(memberId),
    authorityBackup: authorityBackupFor(memberId),
    ackRequestId: memberId === actorMemberId ? message.ackRequestId : ""
  };
  return room.transport?.sendToPlayer(memberId, personalized) || false;
}

function broadcastCoreMessage(message, actorMemberId = "") {
  if (!room.isHost) { render(); return; }
  room.members.forEach(member => {
    if (member.id === room.myId || !member.connected || member.isBot) return;
    const delivered = sendCoreMessageToPlayer(member.id, message, actorMemberId);
    if (!delivered) {
      ui.pendingSyncMembers.add(member.id);
      scheduleHostResync();
    } else {
      ui.pendingSyncMembers.delete(member.id);
      scheduleAckRetry(member.id, message.seqNum);
    }
  });
  if (shouldGenerateSnapshot()) generateSnapshot();
  render();
  scheduleBotAction();
  scheduleHostPeriodicSync();
}

const SNAPSHOT_ROUND_INTERVAL = 5;
const SNAPSHOT_TIME_INTERVAL = 30000;

function shouldGenerateSnapshot() {
  if (!game) return false;
  if (game.round - (game.lastSnapshotRound || 0) >= SNAPSHOT_ROUND_INTERVAL) return true;
  if (Date.now() - (game.lastSnapshotAt || 0) >= SNAPSHOT_TIME_INTERVAL) return true;
  return false;
}

function generateSnapshot() {
  if (!game) return null;
  game.lastSnapshotSeqNum = game.sequence;
  game.lastSnapshotAt = Date.now();
  game.lastSnapshotRound = game.round;
  return {
    seqNum: game.sequence,
    round: game.round,
    timestamp: Date.now()
  };
}

function handleMissingMessagesRequest(memberId, fromSeq, toSeq) {
  if (!room.isHost || !game) return;
  if (game.coreMessages && game.coreMessages.length) {
    const missing = game.coreMessages.filter(msg =>
      msg.seqNum >= fromSeq && msg.seqNum <= toSeq
    );
    missing.forEach(msg => {
      room.transport?.sendToPlayer(memberId, {
        type: "CORE_MESSAGE",
        msgId: msg.msgId,
        seqNum: msg.seqNum,
        senderId: msg.senderId,
        action: msg.action,
        timestamp: msg.timestamp,
        ok: msg.ok,
        reason: msg.reason,
        draw: msg.draw,
        room: publicRoom(),
        game: publicGameFor(memberId),
        authorityBackup: authorityBackupFor(memberId),
        ackRequestId: ""
      });
    });
  }
  if (game.sequence > toSeq) {
    sendCoreMessageToPlayer(memberId, {
      msgId: `msg_${cryptoRandom(8)}`,
      seqNum: game.sequence,
      senderId: "system",
      action: "GAP_FILL",
      timestamp: Date.now(),
      ok: true,
      reason: "",
      draw: null,
      ackRequestId: ""
    }, memberId);
  }
}

function syncAll(actorMemberId = "", acknowledgedRequestId = "", action = "", result = null) {
  if (!room.isHost) {
    render();
    return;
  }
  if (!result) {
    game.sequence++;
    result = { ok: true };
  }
  const message = emitCoreMessage(actorMemberId || "system", action || "SYNC", result, acknowledgedRequestId);
  broadcastCoreMessage(message, actorMemberId);
}

function sendWelcome(memberId) {
  room.transport?.sendToPlayer(memberId, {
    type: "WELCOME",
    room: publicRoom(),
    game: publicGameFor(memberId),
    authorityBackup: authorityBackupFor(memberId),
    chatHistory: ui.chatMessages.slice(-CHAT_MAX_MESSAGES),
    coreMessages: game?.coreMessages?.slice(-50) || []
  });
}

function clearPendingGameAction(requestId = "") {
  if (requestId && ui.pendingAction?.requestId !== requestId) return;
  clearTimeout(ui.pendingActionTimer);
  ui.pendingActionTimer = null;
  ui.pendingAction = null;
  ui.pendingRequest = false;
}

function clearMessageQueue(initialSeqNum = 0) {
  ui.messageQueue = [];
  ui.executedSeqNum = initialSeqNum;
  ui.executedMsgIds = new Set();
  clearTimeout(ui.gapFillTimer);
  ui.gapFillTimer = null;
  ui.gapFillRequested = false;
}

function enqueueCoreMessage(message) {
  if (!message || typeof message.seqNum !== "number") return;
  if (!room.isHost && room.connected) {
    room.transport?.sendToHost({
      type: "SYNC_ACK",
      sequence: message.seqNum
    });
  }
  if (ui.executedMsgIds.has(message.msgId)) return;
  if (message.seqNum <= ui.executedSeqNum) return;
  ui.messageQueue.push(message);
  ui.messageQueue.sort((a, b) => a.seqNum - b.seqNum);
  processMessageQueue();
}

function applyCoreMessage(message) {
  if (message.room) applyRoomSnapshot(message.room);
  if (message.game) game = message.game;
  if (message.authorityBackup) ui.authorityBackup = message.authorityBackup;
  if (message.ackRequestId) {
    clearPendingGameAction(message.ackRequestId);
  } else if (ui.pendingAction && message.seqNum > ui.pendingAction.baseSequence) {
    clearPendingGameAction();
  }
  if (message.draw?.kind === "event") {
    showToast(`摸到事件牌「${message.draw.name}」，已立即结算。`);
  } else if (!message.ok && message.reason) {
    showToast(message.reason);
  }
  scheduleStateCheck();
}

function processMessageQueue() {
  let applied = false;
  while (ui.messageQueue.length > 0) {
    const next = ui.messageQueue[0];
    if (next.seqNum <= ui.executedSeqNum) {
      ui.messageQueue.shift();
      continue;
    }
    if (next.seqNum === ui.executedSeqNum + 1) {
      ui.messageQueue.shift();
      applyCoreMessage(next);
      ui.executedSeqNum = next.seqNum;
      ui.executedMsgIds.add(next.msgId);
      if (ui.executedMsgIds.size > 100) {
        const arr = [...ui.executedMsgIds];
        ui.executedMsgIds = new Set(arr.slice(-50));
      }
      applied = true;
      continue;
    }
    if (next.seqNum > ui.executedSeqNum + 1) {
      if (!ui.gapFillRequested) {
        ui.gapFillRequested = true;
        const fromSeq = ui.executedSeqNum + 1;
        const toSeq = next.seqNum - 1;
        if (!room.isHost && room.connected) {
          room.transport?.sendToHost({
            type: "MISSING_MESSAGES_REQUEST",
            fromSeq,
            toSeq
          });
        }
        clearTimeout(ui.gapFillTimer);
        ui.gapFillTimer = setTimeout(() => {
          ui.gapFillRequested = false;
          while (ui.messageQueue.length > 0) {
            const msg = ui.messageQueue.shift();
            if (msg.seqNum > ui.executedSeqNum) {
              applyCoreMessage(msg);
              ui.executedSeqNum = msg.seqNum;
              ui.executedMsgIds.add(msg.msgId);
              if (ui.executedMsgIds.size > 100) {
                const arr = [...ui.executedMsgIds];
                ui.executedMsgIds = new Set(arr.slice(-50));
              }
            }
          }
          render();
        }, 3000);
      }
      break;
    }
  }
  if (applied) render();
}

function scheduleStateCheck() {
  clearTimeout(ui.syncTimer);
  ui.syncTimer = null;
  if (room.isHost || !room.connected || !game) return;
  ui.syncTimer = setTimeout(() => {
    if (!room.isHost && room.connected && game) {
      room.transport?.sendToHost({
        type: "SYNC_REQUEST",
        knownSequence: game.sequence ?? -1
      });
    }
    scheduleStateCheck();
  }, 5000);
}

function rememberGameAction(key, result) {
  processedGameActions.set(key, {
    ok: result.ok,
    reason: result.reason || "",
    draw: result.draw || null,
    sequence: game?.sequence || 0
  });
  while (processedGameActions.size > 120) {
    processedGameActions.delete(processedGameActions.keys().next().value);
  }
}

function sendActionResult(memberId, requestId, result) {
  room.transport?.sendToPlayer(memberId, {
    type: "ACTION_RESULT",
    requestId,
    ok: result.ok,
    reason: result.reason || "",
    draw: result.draw || null,
    sequence: result.sequence ?? game?.sequence ?? 0
  });
}

function retryPendingGameAction() {
  const pending = ui.pendingAction;
  if (!pending || room.isHost || !room.connected) return;
  if (pending.attempts >= 3) {
    clearPendingGameAction(pending.requestId);
    room.transport?.sendToHost({
      type: "SYNC_REQUEST",
      knownSequence: game?.sequence ?? -1
    });
    showToast("操作确认超时，已重新同步，请确认状态后重试");
    render();
    return;
  }
  pending.attempts++;
  const sent = room.transport?.sendToHost({
    type: "GAME_ACTION",
    requestId: pending.requestId,
    action: pending.action,
    payload: pending.payload
  });
  if (!sent) {
    clearPendingGameAction(pending.requestId);
    showToast("连接暂不可用，请等待重连后重试");
    render();
    return;
  }
  clearTimeout(ui.pendingActionTimer);
  ui.pendingActionTimer = setTimeout(retryPendingGameAction, 1800);
}

function broadcastLobby() {
  if (!room.isHost) return;
  room.transport?.broadcast({ type: "ROOM_SYNC", room: publicRoom() });
  render();
}

function handleJoin(message, meta) {
  if (!room.isHost || message.roomCode !== room.code) return;
  const safeName = String(message.name || "玩家").trim().slice(0, 16) || "玩家";
  room.transport.bindPlayer(meta.peerId, message.playerId, safeName);
  let member = room.members.find(item => item.id === message.playerId);
  const wasDisconnected = !!member && !member.connected;
  if (member) {
    member.connected = true;
    member.disconnectedAt = 0;
    member.name = safeName;
    member.peerId = meta.peerId;
    clearAckTimeout(member.id);
    ui.lastAckedSequence.delete(member.id);
  } else {
    const spectator = room.lifecycle === ROOM_STATE.PLAYING ||
      room.lifecycle === ROOM_STATE.SETTLEMENT;
    member = {
      id: message.playerId,
      name: safeName,
      isHost: false,
      connected: true,
      spectator,
      peerId: meta.peerId
    };
    room.members.push(member);
  }
  if (game) {
    const player = game.players.find(item => item.memberId === member.id);
    if (player) {
      if (player.aiControlled) {
        member.spectator = true;
        pushSystemChat(`${member.name} 已进入 AI 托管，以观战身份重连。`);
      } else {
        // 检查重连时间是否在 90 秒内
        const now = Date.now();
        const within90 = !player.disconnectedAt || (now - player.disconnectedAt < DISCONNECT_AI_TIMEOUT_MS);
        if (within90) {
          player.connected = true;
          player.disconnectedAt = 0;
          member.spectator = false;
        } else {
          // 超过 90 秒，以观战身份进入，AI 继续托管
          player.aiControlled = true;
          member.spectator = true;
          pushSystemChat(`${member.name} 断线超过 90 秒重连，以观战身份进入（AI 托管中）。`);
          appendLog(`${player.name} 断线超过 90 秒重连，AI 永久接管。`, "event");
        }
      }
    }
  }
  sendWelcome(member.id);
  pushSystemChat(wasDisconnected ? `${member.name} 已重连。` : `${member.name} 加入了房间。`);
  if (room.lifecycle === ROOM_STATE.WAITING) broadcastLobby();
  else syncAll();
}

function handleNetworkMessage(message, meta = {}) {
  if (!message || !message.type) return;
  if (message.type === "JOIN") {
    handleJoin(message, meta);
    return;
  }
  if (message.type === "WELCOME") {
    room.connected = true;
    applyRoomSnapshot(message.room);
    game = message.game;
    ui.authorityBackup = message.authorityBackup;
    if (Array.isArray(message.chatHistory)) {
      ui.chatMessages = message.chatHistory.slice(-CHAT_MAX_MESSAGES);
    }
    clearPendingGameAction();
    const snapshotSeq = message.game?.sequence ?? 0;
    const preservedMessages = ui.messageQueue.filter(msg => msg.seqNum > snapshotSeq);
    clearMessageQueue(snapshotSeq);
    if (Array.isArray(message.coreMessages)) {
      message.coreMessages.forEach(msg => {
        if (msg.seqNum > ui.executedSeqNum && !ui.executedMsgIds.has(msg.msgId)) {
          ui.messageQueue.push(msg);
        }
      });
    }
    preservedMessages.forEach(msg => {
      if (msg.seqNum > ui.executedSeqNum && !ui.executedMsgIds.has(msg.msgId)) {
        ui.messageQueue.push(msg);
      }
    });
    ui.messageQueue.sort((a, b) => a.seqNum - b.seqNum);
    processMessageQueue();
    scheduleStateCheck();
    startHeartbeat();
    if (ui.joinResolver) {
      ui.joinResolver(ok());
      ui.joinResolver = null;
    }
    render();
    return;
  }
  if (message.type === "REJECT") {
    if (ui.joinResolver) {
      ui.joinResolver(fail(message.reason || "无法加入房间"));
      ui.joinResolver = null;
    }
    return;
  }
  if (message.type === "ROOM_SYNC") {
    applyRoomSnapshot(message.room);
    render();
    return;
  }
  if (message.type === "CORE_MESSAGE") {
    enqueueCoreMessage(message);
    return;
  }
  if (message.type === "SYNC") {
    enqueueCoreMessage({
      msgId: `msg_legacy_${message.game?.sequence ?? Date.now()}_${Math.random()}`,
      seqNum: message.game?.sequence ?? 0,
      senderId: "system",
      action: "SYNC",
      timestamp: Date.now(),
      ok: true,
      reason: "",
      draw: null,
      room: message.room,
      game: message.game,
      authorityBackup: message.authorityBackup,
      ackRequestId: message.acknowledgedRequestId || ""
    });
    return;
  }
  if (message.type === "MISSING_MESSAGES_REQUEST" && room.isHost) {
    handleMissingMessagesRequest(meta.playerId, Number(message.fromSeq), Number(message.toSeq));
    return;
  }
  if (message.type === "ROOM_ACTION" && room.isHost) {
    handleRoomAction(meta.playerId, message.action, message.payload || {});
    return;
  }
  if (message.type === "GAME_ACTION" && room.isHost) {
    const requestId = String(message.requestId || "").slice(0, 96);
    const actionKey = requestId ? `${meta.playerId}:${requestId}` : "";
    if (actionKey && processedGameActions.has(actionKey)) {
      sendActionResult(meta.playerId, requestId, processedGameActions.get(actionKey));
      sendStateToPlayer(meta.playerId, requestId);
      return;
    }
    const result = hostDispatch(
      meta.playerId,
      message.action,
      message.payload || {},
      requestId
    );
    const response = { ...result, sequence: game?.sequence || 0 };
    if (actionKey) rememberGameAction(actionKey, response);
    sendActionResult(meta.playerId, requestId, response);
    if (!requestId && !result.ok) {
      room.transport?.sendToPlayer(meta.playerId, {
        type: "ACTION_ERROR",
        reason: result.reason
      });
    } else if (!requestId && result.draw?.kind === "event") {
      room.transport?.sendToPlayer(meta.playerId, {
        type: "DRAW_NOTICE",
        text: `摸到事件牌「${result.draw.name}」，已立即结算。`
      });
    }
    return;
  }
  if (message.type === "ACTION_RESULT") {
    clearPendingGameAction(message.requestId);
    if (!message.ok) {
      showToast(message.reason || "操作失败");
    } else if (message.draw?.kind === "event") {
      showToast(`摸到事件牌「${message.draw.name}」，已立即结算。`);
    }
    if ((message.sequence ?? -1) > (game?.sequence ?? -1)) {
      room.transport?.sendToHost({
        type: "SYNC_REQUEST",
        knownSequence: game?.sequence ?? -1
      });
    }
    render();
    return;
  }
  if (message.type === "ACTION_ERROR") {
    clearPendingGameAction();
    showToast(message.reason || "操作失败");
    render();
    return;
  }
  if (message.type === "DRAW_NOTICE") {
    showToast(message.text);
    return;
  }
  if (message.type === "SYNC_REQUEST" && room.isHost) {
    const knownSequence = Number(message.knownSequence);
    if (!Number.isSafeInteger(knownSequence) || knownSequence < (game?.sequence ?? 0)) {
      sendStateToPlayer(meta.playerId);
    } else {
      room.transport?.sendToPlayer(meta.playerId, {
        type: "SYNC_STATUS",
        sequence: game?.sequence ?? 0
      });
    }
    return;
  }
  if (message.type === "SYNC_ACK" && room.isHost) {
    clearAckTimeout(meta.playerId);
    const ackedSeq = Number(message.sequence);
    if (Number.isSafeInteger(ackedSeq)) {
      ui.lastAckedSequence.set(meta.playerId, ackedSeq);
    }
    return;
  }
  if (message.type === "SYNC_STATUS") {
    scheduleStateCheck();
    return;
  }
  if (message.type === "HOST_MOVING") {
    scheduleGracefulMigration(message.nextHostId);
    return;
  }
  if (message.type === "PROMOTE") {
    promoteToHost(message.room, message.gameBackup);
    return;
  }
  if (message.type === "CHAT" && room.isHost) {
    handleChatMessage(meta.playerId, message);
    return;
  }
  if (message.type === "CHAT_BROADCAST") {
    receiveChatBroadcast(message.message);
    return;
  }
  if (message.type === "HEARTBEAT" && room.isHost) {
    room.transport?.sendToPlayer(meta.playerId, { type: "HEARTBEAT_ACK" });
    return;
  }
  if (message.type === "HEARTBEAT_ACK") {
    ui.heartbeatMisses = 0;
    return;
  }
  if (message.type === "MUTE_UPDATE" && room.isHost) {
    handleMuteUpdate(meta.playerId, message);
    return;
  }
  if (message.type === "MUTE_NOTICE") {
    if (message.muted) ui.mutedPlayerIds.add(message.playerId);
    else ui.mutedPlayerIds.delete(message.playerId);
    render();
    return;
  }
}

const CHAT_MAX_MESSAGES = 100;
const CHAT_RATE_LIMIT_MS = 3000;
const CHAT_MAX_LENGTH = 100;
const QUICK_PHRASES = ["你好", "等我一下", "好牌！", "GG", "厉害", "😅", "🔥", "🎵"];
const SENSITIVE_WORDS = ["操", "傻逼", "草泥马", "去死", "废物", "滚蛋", "智障", "脑残", "废物", "煞笔", "弱智", "狗日", "他妈", "你妈", " fuck", "shit", "bitch"];
const BLOCKED_PLAYER_KEY = "puishi-blocked-players";

function filterChatContent(text) {
  let filtered = String(text || "");
  SENSITIVE_WORDS.forEach(word => {
    const escaped = word.replace(/[.*+?^${}()|[\]\\]/g, "\\$&");
    filtered = filtered.replace(new RegExp(escaped, "gi"), "*".repeat(word.length));
  });
  return filtered;
}

function loadBlockedPlayers() {
  try {
    const stored = localStorage.getItem(BLOCKED_PLAYER_KEY);
    if (stored) return new Set(JSON.parse(stored));
  } catch (_) {}
  return new Set();
}

function saveBlockedPlayers(set) {
  try { localStorage.setItem(BLOCKED_PLAYER_KEY, JSON.stringify([...set])); } catch (_) {}
}

function isPlayerBlocked(playerId) {
  if (!ui.blockedPlayerIds) ui.blockedPlayerIds = loadBlockedPlayers();
  return ui.blockedPlayerIds.has(playerId);
}

function toggleBlockPlayer(playerId) {
  if (!ui.blockedPlayerIds) ui.blockedPlayerIds = loadBlockedPlayers();
  if (ui.blockedPlayerIds.has(playerId)) ui.blockedPlayerIds.delete(playerId);
  else ui.blockedPlayerIds.add(playerId);
  saveBlockedPlayers(ui.blockedPlayerIds);
  render();
}

function addChatMessage(message) {
  ui.chatMessages.push(message);
  while (ui.chatMessages.length > CHAT_MAX_MESSAGES) ui.chatMessages.shift();
}

function pushSystemChat(text) {
  const msg = { type: "system", text, timestamp: Date.now() };
  addChatMessage(msg);
  if (room.isHost && room.connected) {
    broadcastChat(msg);
  }
  render();
}

function handleChatMessage(senderId, message) {
  if (!room.isHost) return;
  const sender = room.members.find(m => m.id === senderId);
  if (!sender) return;
  if (ui.mutedPlayerIds.has(senderId)) {
    room.transport?.sendToPlayer(senderId, {
      type: "MUTE_NOTICE",
      playerId: senderId,
      muted: true
    });
    return;
  }
  const content = filterChatContent(String(message.content || "").slice(0, CHAT_MAX_LENGTH).trim());
  if (!content) return;
  const chatMsg = {
    type: "chat",
    senderId,
    senderName: sender.name,
    isSpectator: sender.spectator,
    content,
    timestamp: Date.now()
  };
  addChatMessage(chatMsg);
  broadcastChat(chatMsg);
  render();
}

function broadcastChat(chatMsg) {
  const payload = { type: "CHAT_BROADCAST", message: chatMsg };
  room.members.forEach(member => {
    if (member.id === room.myId || !member.connected || member.isBot) return;
    room.transport?.sendToPlayer(member.id, payload);
  });
}

function receiveChatBroadcast(chatMsg) {
  addChatMessage(chatMsg);
  render();
}

function sendChat(text) {
  const now = Date.now();
  if (now - ui.chatLastSent < CHAT_RATE_LIMIT_MS) {
    showToast("发言过快，请稍候");
    return;
  }
  const content = filterChatContent(String(text || "").slice(0, CHAT_MAX_LENGTH).trim());
  if (!content) return;
  ui.chatLastSent = now;
  if (room.isHost) {
    const chatMsg = {
      type: "chat",
      senderId: room.myId,
      senderName: room.myName,
      isSpectator: room.members.find(m => m.id === room.myId)?.spectator || false,
      content,
      timestamp: now
    };
    addChatMessage(chatMsg);
    broadcastChat(chatMsg);
    render();
  } else {
    room.transport?.sendToHost({ type: "CHAT", content });
  }
}

function handleMuteUpdate(actorId, message) {
  if (!room.isHost || actorId !== room.hostId) return;
  const targetId = String(message.playerId || "").slice(0, 64);
  if (!targetId) return;
  if (message.muted) ui.mutedPlayerIds.add(targetId);
  else ui.mutedPlayerIds.delete(targetId);
  room.transport?.sendToPlayer(targetId, {
    type: "MUTE_NOTICE",
    playerId: targetId,
    muted: message.muted
  });
  const target = room.members.find(m => m.id === targetId);
  pushSystemChat(`${message.muted ? "禁言" : "解除禁言"}：${target?.name || targetId}`);
}

function toggleMute(playerId) {
  if (!room.isHost) return;
  const muted = ui.mutedPlayerIds.has(playerId);
  room.transport?.sendToHost({
    type: "MUTE_UPDATE",
    playerId,
    muted: !muted
  });
}

function startHeartbeat() {
  stopHeartbeat();
  if (room.isHost) return;
  ui.heartbeatMisses = 0;
  ui.heartbeatTimer = setTimeout(function beat() {
    if (!room.connected || room.isHost) return;
    ui.heartbeatMisses++;
    if (ui.heartbeatMisses >= 3) {
      ui.heartbeatMisses = 0;
      handleUnexpectedHostLoss();
      return;
    }
    room.transport?.sendToHost({ type: "HEARTBEAT" });
    ui.heartbeatTimer = setTimeout(beat, 5000);
  }, 5000);
}

function stopHeartbeat() {
  if (ui.heartbeatTimer) {
    clearTimeout(ui.heartbeatTimer);
    ui.heartbeatTimer = null;
  }
  ui.heartbeatMisses = 0;
}

function handleRoomAction(memberId, action, payload) {
  if (!room.isHost) return;
  const member = room.members.find(item => item.id === memberId);
  if (!member) return;
  if (action === "UPDATE_ROUNDS" && memberId === room.hostId && room.lifecycle === ROOM_STATE.WAITING) {
    const rounds = Number(payload.totalRounds);
    if (Number.isSafeInteger(rounds) && rounds > 0) {
      room.settings.totalRounds = rounds;
      broadcastLobby();
    }
  } else if (action === "START" && memberId === room.hostId) {
    startGame();
  } else if (action === "BACK_TO_LOBBY" && memberId === room.hostId && room.lifecycle === ROOM_STATE.SETTLEMENT) {
    resetToLobby();
  } else if (action === "LEAVE") {
    markMemberDisconnected(memberId, true);
  } else if (action === "ADD_BOT" && memberId === room.hostId && room.lifecycle === ROOM_STATE.WAITING) {
    const connectedRealPlayers = room.members.filter(m => m.connected && !m.spectator && !m.isBot).length;
    const existingBots = room.members.filter(m => m.isBot).length;
    if (connectedRealPlayers + existingBots >= 8) return showToast("房间人数已达上限");
    const difficulty = payload.difficulty === "normal" ? "normal" : "simple";
    const botNames = ["机器人A", "机器人B", "机器人C", "机器人D"];
    const usedNames = new Set(room.members.map(m => m.name));
    const botName = botNames.find(n => !usedNames.has(n)) || ("机器人" + (existingBots + 1));
    const botMember = {
      id: "bot_" + cryptoRandom(8),
      name: botName,
      isHost: false,
      connected: true,
      spectator: false,
      peerId: null,
      isBot: true,
      difficulty
    };
    room.members.push(botMember);
    pushSystemChat(`机器人「${botName}」(${difficulty === "normal" ? "普通" : "简单"})已加入房间。`);
    broadcastLobby();
  } else if (action === "REMOVE_BOT" && memberId === room.hostId && room.lifecycle === ROOM_STATE.WAITING) {
    const botId = String(payload.botId || "");
    const bot = room.members.find(m => m.id === botId && m.isBot);
    if (!bot) return;
    room.members = room.members.filter(m => m.id !== botId);
    pushSystemChat(`机器人「${bot.name}」已移出房间。`);
    broadcastLobby();
  } else if (action === "TRANSFER_HOST" && memberId === room.hostId) {
    transferHost(String(payload.targetMemberId || ""));
  }
}

function sendRoomAction(action, payload = {}) {
  if (room.isHost) handleRoomAction(room.myId, action, payload);
  else room.transport?.sendToHost({ type: "ROOM_ACTION", action, payload });
}

function sendGameAction(action, payload = {}) {
  if (ui.pendingRequest) return;
  if (room.isHost) {
    const result = hostDispatch(room.myId, action, payload);
    if (!result.ok) showToast(result.reason);
    else if (result.draw?.kind === "event") showToast(`摸到事件牌「${result.draw.name}」，已立即结算。`);
    render();
    return;
  }
  const requestId = `${room.myId}-${Date.now()}-${cryptoRandom(4)}`;
  ui.pendingRequest = true;
  ui.pendingAction = {
    requestId,
    action,
    payload: clone(payload),
    attempts: 0,
    baseSequence: game?.sequence ?? -1
  };
  retryPendingGameAction();
  render();
}

function startGame() {
  const players = roomPlayers().filter(member => member.connected);
  if (room.lifecycle !== ROOM_STATE.WAITING) return;
  if (players.length < 2) return showToast("至少需要2名玩家");
  game = createGameState(players, room.settings.totalRounds);
  processedGameActions.clear();
  room.lifecycle = ROOM_STATE.PLAYING;
  appendLog(`游戏开始，共${game.totalRounds}轮。每位玩家拥有12点购置点数。`, "event");
  pushSystemChat("游戏已开始，祝大家好运！");
  syncAll();
}

function resetToLobby() {
  game = null;
  processedGameActions.clear();
  clearTimeout(ui.hostPeriodicTimer);
  ui.hostPeriodicTimer = null;
  ui.pendingAcks.forEach(entry => clearTimeout(entry.timer));
  ui.pendingAcks.clear();
  ui.pendingSyncMembers.clear();
  ui.lastAckedSequence.clear();
  clearTimeout(ui.hostResyncTimer);
  ui.hostResyncTimer = null;
  clearMessageQueue(0);
  room.lifecycle = ROOM_STATE.WAITING;
  const connected = room.members
    .filter(member => member.connected)
    .sort((a, b) => Number(b.id === room.hostId) - Number(a.id === room.hostId));
  room.members = connected.map(member => ({
    ...member,
    spectator: false
  }));
  broadcastLobby();
}

function markMemberDisconnected(memberId, voluntary = false) {
  const member = room.members.find(item => item.id === memberId);
  if (!member || member.id === room.hostId) return;
  if (voluntary && (room.lifecycle === ROOM_STATE.WAITING || member.spectator)) {
    room.members = room.members.filter(item => item.id !== memberId);
    clearAckTimeout(memberId);
    ui.lastAckedSequence.delete(memberId);
    if (room.isHost) pushSystemChat(`${member.name} 离开了房间。`);
    if (game) syncAll();
    else broadcastLobby();
    return;
  }
  member.connected = false;
  member.disconnectedAt = Date.now();
  clearAckTimeout(memberId);
  ui.lastAckedSequence.delete(memberId);
  const player = game?.players.find(item => item.memberId === memberId);
  if (player) {
    player.connected = false;
    player.disconnectedAt = Date.now();
  }
  if (room.isHost) pushSystemChat(`${member.name} 断线了，正在等待重连…`);
  if (game) syncAll();
  else broadcastLobby();
}

async function createRoom(name) {
  ui.busy = true;
  ui.message = "正在创建房间...";
  ui.messageError = false;
  render();
  const code = cryptoRandom(5);
  try {
    const transport = new PeerTransport(code);
    installTransport(transport);
    await transport.startHost();
    room.connected = true;
    room.code = code;
    room.myName = name;
    room.hostId = room.myId;
    room.isHost = true;
    room.lifecycle = ROOM_STATE.WAITING;
    room.settings = { totalRounds: 10 };
    saveRoomSession(code, name);
    room.members = [{
      id: room.myId,
      name,
      isHost: true,
      connected: true,
      spectator: false,
      peerId: transport.myPeerId
    }];
    room.transport = transport;
    ui.screen = "lobby";
    ui.message = "";
  } catch (error) {
    room.transport?.close();
    room.transport = null;
    ui.message = friendlyConnectionError(error);
    ui.messageError = true;
  } finally {
    ui.busy = false;
    render();
  }
}

async function joinRoom(name, code, reconnect = false) {
  if (!reconnect) {
    ui.busy = true;
    ui.message = `正在加入房间 ${code}...`;
    ui.messageError = false;
    render();
  }
  try {
    const transport = new PeerTransport(code);
    installTransport(transport);
    await transport.startClient();
    room.transport = transport;
    room.code = code;
    room.myName = name;
    const joined = new Promise(resolve => {
      ui.joinResolver = resolve;
      setTimeout(() => {
        if (ui.joinResolver) {
          ui.joinResolver(fail("房间无响应，请确认房主在线后重试"));
          ui.joinResolver = null;
        }
      }, 30000);
    });
    transport.sendToHost({ type: "JOIN", roomCode: code, playerId: room.myId, name, reconnect });
    const result = await joined;
    if (!result.ok) throw new Error(result.reason);
    room.connected = true;
    saveRoomSession(code, name);
    startHeartbeat();
    ui.message = "";
    ui.messageError = false;
  } catch (error) {
    room.transport?.close();
    room.transport = null;
    room.connected = false;
    if (!reconnect) {
      ui.screen = "entry";
      ui.message = friendlyConnectionError(error);
      ui.messageError = true;
    } else {
      ui.message = "重连失败，请返回首页后重新加入。";
      ui.messageError = true;
    }
  } finally {
    ui.busy = false;
    render();
  }
}

function installTransport(transport) {
  room.transport = transport;
  transport.onMessage = handleNetworkMessage;
  transport.onPeerLeft = meta => {
    if (room.isHost && meta.playerId) markMemberDisconnected(meta.playerId);
  };
  transport.onHostLost = () => handleUnexpectedHostLoss();
}

function friendlyConnectionError(error) {
  const message = String(error?.message || error || "连接失败");
  if (message.includes("unavailable-id")) return "该房间码已被占用，请重试。";
  if (message.includes("peer-unavailable")) return "房间不存在或房主尚未就绪。";
  if (message.includes("PeerJS")) return "联机组件加载失败，请检查网络后刷新。";
  if (message.includes("timeout") || message.includes("超时") || message.includes("无响应")) return "连接房主超时，请确认房间码正确、房主在线，并检查网络后重试。";
  return message;
}

function handleUnexpectedHostLoss() {
  if (room.isHost || !room.connected) return;
  ui.hostLostAt = Date.now();
  ui.message = "房主连接中断，30秒后尝试转移房主。";
  render();
  clearTimeout(ui.migrationTimer);
  const candidates = room.members.filter(member => member.id !== room.hostId && member.connected && !member.spectator);
  const nextHost = candidates[0];
  if (!nextHost) return;
  const delay = nextHost.id === room.myId ? 30000 : 33500;
  ui.migrationTimer = setTimeout(() => {
    if (nextHost.id === room.myId) {
      const snapshot = publicRoom();
      snapshot.hostId = room.myId;
      snapshot.members = snapshot.members.map(member => ({
        ...member,
        isHost: member.id === room.myId,
        connected: member.id === room.hostId ? false : member.connected
      }));
      promoteToHost(snapshot, ui.authorityBackup);
    } else {
      reconnectToCurrentHost();
    }
  }, delay);
}

function scheduleGracefulMigration(nextHostId) {
  clearTimeout(ui.migrationTimer);
  ui.message = "房主正在转移，稍后自动重连。";
  render();
  if (nextHostId !== room.myId) ui.migrationTimer = setTimeout(reconnectToCurrentHost, 1800);
}

async function promoteToHost(roomSnapshot, gameBackup) {
  try {
    room.transport?.close();
    await new Promise(resolve => setTimeout(resolve, 700));
    applyRoomSnapshot(roomSnapshot);
    room.hostId = room.myId;
    room.isHost = true;
    room.members = room.members.map(member => ({ ...member, isHost: member.id === room.myId }));
    game = gameBackup || game;
    const transport = new PeerTransport(room.code);
    installTransport(transport);
    await transport.startHost();
    room.transport = transport;
    room.connected = true;
    ui.message = "";
    stopHeartbeat();
    ui.pendingAcks.forEach(entry => clearTimeout(entry.timer));
    ui.pendingAcks.clear();
    ui.pendingSyncMembers.clear();
    ui.lastAckedSequence.clear();
    clearMessageQueue(game?.sequence ?? 0);
    if (game) {
      const previousHost = game.players.find(player => player.memberId !== room.myId && !room.members.find(member => member.id === player.memberId)?.connected);
      if (previousHost) {
        previousHost.connected = false;
        previousHost.disconnectedAt = Date.now();
      }
    }
    syncAll();
  } catch (error) {
    room.isHost = false;
    ui.message = "房主转移失败，正在尝试恢复连接。";
    render();
    setTimeout(reconnectToCurrentHost, 1200);
  }
}

function reconnectToCurrentHost() {
  room.transport?.close();
  joinRoom(room.myName, room.code, true);
}

function leaveRoom() {
  if (!room.connected) return resetClient();
  if (room.isHost) {
    const next = room.members.find(member => member.id !== room.myId && member.connected && !member.spectator);
    if (next) {
      const snapshot = publicRoom();
      snapshot.hostId = next.id;
      snapshot.members = snapshot.members.map(member => ({
        ...member,
        isHost: member.id === next.id,
        connected: member.id === room.myId ? false : member.connected
      }));
      room.transport.sendToPlayer(next.id, { type: "PROMOTE", room: snapshot, gameBackup: game });
      room.transport.broadcast({ type: "HOST_MOVING", nextHostId: next.id });
      setTimeout(resetClient, 350);
      return;
    }
  } else {
    room.transport?.sendToHost({ type: "ROOM_ACTION", action: "LEAVE", payload: {} });
  }
  resetClient();
}

function transferHost(targetMemberId) {
  if (!room.isHost) return;
  const target = room.members.find(m => m.id === targetMemberId && m.connected && !m.spectator && !m.isBot && m.id !== room.myId);
  if (!target) return showToast("该成员无法成为房主");
  const snapshot = publicRoom();
  snapshot.hostId = target.id;
  snapshot.members = snapshot.members.map(member => ({
    ...member,
    isHost: member.id === target.id
  }));
  pushSystemChat(`房主已转让给「${target.name}」。`);
  room.transport.sendToPlayer(target.id, { type: "PROMOTE", room: snapshot, gameBackup: game });
  room.transport.broadcast({ type: "HOST_MOVING", nextHostId: target.id });
  room.hostId = target.id;
  room.isHost = false;
  ui.message = "房主转让中，正在重连…";
  clearTimeout(ui.hostPeriodicTimer);
  ui.hostPeriodicTimer = null;
  ui.pendingAcks.forEach(entry => clearTimeout(entry.timer));
  ui.pendingAcks.clear();
  ui.pendingSyncMembers.clear();
  ui.lastAckedSequence.clear();
  render();
  setTimeout(() => {
    room.transport?.close();
    room.transport = null;
    setTimeout(reconnectToCurrentHost, 1500);
  }, 350);
}

function resetClient() {
  clearTimeout(ui.migrationTimer);
  clearTimeout(ui.syncTimer);
  clearTimeout(ui.hostResyncTimer);
  clearTimeout(ui.hostPeriodicTimer);
  stopHeartbeat();
  ui.syncTimer = null;
  ui.hostResyncTimer = null;
  ui.hostPeriodicTimer = null;
  ui.pendingAcks.forEach(entry => clearTimeout(entry.timer));
  ui.pendingAcks.clear();
  ui.pendingSyncMembers.clear();
  ui.lastAckedSequence.clear();
  ui.chatMessages = [];
  ui.mutedPlayerIds.clear();
  clearRoomSession();
  clearPendingGameAction();
  room.transport?.close();
  room.connected = false;
  room.code = "";
  room.hostId = "";
  room.isHost = false;
  room.lifecycle = ROOM_STATE.WAITING;
  room.members = [];
  room.transport = null;
  game = null;
  ui.screen = "entry";
  ui.modal = null;
  ui.message = "";
  render();
}

function render() {
  // 若有待处理事件且当前我是响应者，且没有其他modal，自动弹出事件处理窗口
  if (!ui.modal && game?.pendingEvent && game.pendingEvent.responderMemberId === room.myId && !isSpectator()) {
    const pending = game.pendingEvent;
    const event = eventDefinition(pending.eventId);
    if (pending.stage === "choose") {
      const me = myGamePlayer();
      ui.modal = {
        kind: "event-choose",
        title: `事件：${event.name}`,
        description: event.description + "（请选择自己的1名角色和另一位玩家。注：技能被禁用的角色也可参与拼机）",
        ownCharacters: me?.characters || [],
        targets: game.players.filter(p => p.memberId !== me?.memberId),
        selectedCharacterUid: null,
        selectedTargetMemberId: null
      };
    } else if (pending.stage === "response") {
      const actor = game.players[pending.actorIndex];
      const targetPlayer = game.players[pending.targetPlayerIndex];
      const mustAccept = pending.eventId === "maimai";
      ui.modal = {
        kind: "event-response",
        title: `事件响应：${event.name}`,
        description: mustAccept
          ? `${actor.name} 邀请你一起「${event.name}」，必须参与。请选择自己的1名角色（技能被禁用的角色也可参与）。`
          : `${actor.name} 邀请你一起「${event.name}」。同意时选择1名角色拼机（技能被禁用的角色也可参与）；拒绝时发起者声望-5但获得能力加成。`,
        mustAccept,
        myCharacters: targetPlayer?.characters || [],
        selectedCharacterUid: null,
        decision: mustAccept ? "accept" : null
      };
    }
  }
  if (ui.screen === "entry" || !room.connected) renderEntry();
  else if (room.lifecycle === ROOM_STATE.WAITING) renderLobby();
  else if (room.lifecycle === ROOM_STATE.SETTLEMENT || game?.phase === GAME_PHASE.SETTLEMENT) renderSettlement();
  else renderGame();
  if (ui.toast) app.insertAdjacentHTML("beforeend", `<div class="toast" role="status">${escapeHtml(ui.toast)}</div>`);
  if (ui.rulesOpen) renderRulesModal();
  if (ui.modal) renderActionModal();
  if (ui.hostLostAt && !room.isHost && room.connected) {
    app.insertAdjacentHTML("beforeend", `<div class="connection-warning">${escapeHtml(ui.message || "连接中断，正在恢复。")}</div>`);
  }
  if (room.connected && ui.screen !== "entry") renderChatPanel();
  initIcons();
}
